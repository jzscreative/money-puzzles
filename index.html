/* ═══════════════════════════════════════════════════════════════════
   PART 4 — DERIVED ANSWERS, TOKENS, STORAGE
   No answer key is ever written down. Every asserted value is produced
   by derive() at render time, from the same state the board draws from.
   ═══════════════════════════════════════════════════════════════════ */
/* v5.1-partial, and the label is deliberate. This build carries P0 (both
   showstoppers, both guards proven by seeding the defect and watching the test
   fail) and P1 (every accuracy finding, including the false claim that JTD COST
   is absent from the real report — it is column 15). P2 through P7 are NOT in
   it: the five parallel agents were stopped by a monthly API spend limit before
   they wrote anything. Calling this "v5.1" would tell the next session the
   remediation shipped complete. It did not. */
const BUILD = "v5.1-partial · built 260803 2117 ET";

/* One caption per level, on the map. Data, so adding a level does not mean
   editing an if-chain that silently captions the new one as the old one. */
const LEVELCAP={
  0:"what you are actually looking at",
  100:"where each number comes from",
  200:"the arithmetic",
  300:"spending is the engine",
  400:"the forecast is yours",
  500:"earned, and billed",
  600:"mixed, and unlabelled",
  700:"the real page"
};

/* ---------- the session seed ----------
   Drawn once at load, used for option order and for which warm-up items come
   up. THIS IS NOT A CLOCK. It stores nothing, it measures nothing, and it
   cannot tell how long he was away — which is the one property of this build
   that must never be traded away. Deterministic WITHIN a load, so a re-render
   after a wrong answer does not move things under his thumb. */
const SESSION_SEED = Math.floor(Math.random()*2147483647)+1;
/* Math.imul IS NOT AN OPTIMISATION. `h * 1103515245` reaches about 4.7e18,
   roughly five hundred times above 2^53, so float64 rounding destroys exactly
   the low bits that `>>> 0` then keeps. In v5.0 that made the generator emit
   an even number 9,993 times out of 10,000, and the measured consequence was
   that 27 of 27 shuffled four-option items put the correct answer at display
   position 3, so "always pick the last option" scored 96.2%. That is worse
   than the v4 defect the shuffle was written to fix, and it passed 1,654
   checks. Math.imul does the multiply in 32-bit integer space, where it is
   exact. The index is taken from the HIGH bits, because an LCG's low bits
   have famously short periods. */
function shuffleOrder(n, key){
  let h=SESSION_SEED>>>0;
  for(let i=0;i<key.length;i++) h=(Math.imul(h,31)+key.charCodeAt(i))>>>0;
  const idx=[]; for(let i=0;i<n;i++) idx.push(i);
  for(let i=n-1;i>0;i--){
    h=(Math.imul(h,1103515245)+12345)>>>0;
    const j=Math.floor((h/4294967296)*(i+1)), t=idx[i]; idx[i]=idx[j]; idx[j]=t;
  }
  return idx;
}

/* ---------- cumulative warm-up ----------
   Nothing from an earlier level ever came back. Seventeen scored items, each
   met once, massed, days apart. A section may declare a `warm` pool: ordinary
   steps, written on a DIFFERENT invented job so the surface features vary, and
   two of them are spliced onto the front of the section each session.

   THIS RUNS WITHOUT A CLOCK, and that constraint is not negotiable. The app
   stores no timestamp, has no interval, and cannot tell how long he was away,
   so it can never say so. Scheduling here is by two things only: which items
   he has not yet got right, and a per-load random seed. An item he has never
   answered correctly comes up before one he has.

   The picked items are MOVED out of the pool, not copied, so no id exists
   twice; the ones left behind stay in `sec.pool` and the self-test validates
   them too, or half the warm-up content would ship unchecked. */
const KEY="mp_v4", SAVEV=5;   // KEY stays mp_v4: renaming it discards his answers
function priorAnswers(){
  try{
    if(typeof localStorage==="undefined") return {};
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    return (raw && raw.st) || {};
  }catch(e){ return {}; }
}
function installWarmups(){
  const prior=priorAnswers();
  SECTIONS.forEach(sec=>{
    const pool=sec.warm;
    if(!Array.isArray(pool) || !pool.length) return;
    const n=Math.min(sec.warmN||2, pool.length);
    const order=shuffleOrder(pool.length, sec.id+"|warm");
    const solid=i=>{ const r=prior[pool[i].id]; return !!(r && r.a1===1); };
    const ranked=order.filter(i=>!solid(i)).concat(order.filter(solid));
    const take=ranked.slice(0,n).sort((a,b)=>a-b);
    const chosen=take.map(i=>pool[i]);
    sec.pool=pool.filter((s,i)=>take.indexOf(i)<0);
    pool.forEach(s=>{ s.warm=true; });
    sec.steps=chosen.concat(sec.steps);
  });
}
installWarmups();

const ALLSTEPS = SECTIONS.flatMap((s,i)=>s.steps.concat(s.pool||[]).map(st=>({...st, _sec:i})));
const SECOF = {}; SECTIONS.forEach((s,i)=>s.steps.concat(s.pool||[]).forEach(st=>{SECOF[st.id]=i;}));
const layoutOf = step => SECTIONS[SECOF[step.id]].layout;

function fracHTML(s){
  const box='display:inline-flex;flex-direction:column;align-items:center;text-align:center';
  const lbl='font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.75';
  const num='font-size:14.5px;font-weight:800;padding:3px 10px';
  return '<span style="display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap">'
    +'<span style="'+box+'">'
    +'<span style="'+lbl+'">money spent</span>'
    +'<span style="'+num+'">'+money(s.jtd)+'</span>'
    +'<span style="border-top:2px solid currentColor;align-self:stretch"></span>'
    +'<span style="'+num+'">'+money(s.eac)+'</span>'
    +'<span style="'+lbl+'">money expected in total</span></span>'
    +'<span style="font-size:19px;font-weight:800">= '+pctS(s.pct)+'</span></span>';
}

function moversFor(step){
  const vis = visibleIds(layoutOf(step));
  if(!step.state) return [];
  const a=derive(step.state), b=derive(step.after||step.state);
  return vis.filter(id=>Math.abs(b[id]-a[id])>0.005);
}
function answerIds(step){
  return step.mode==="identify" ? step.ids.slice() : moversFor(step);
}
function computeAnswer(step){ return derive(step.state)[step.field]; }

function tokenValue(tok, step){
  if(tok==="job")     return step.state ? (derive(step.state).name||"") : undefined;
  if(tok==="FRAC")    return step.state ? fracHTML(derive(step.state)) : undefined;
  if(tok==="FRAC.after") return step.state ? fracHTML(derive(step.after||step.state)) : undefined;
  if(tok==="nmovers") return String(moversFor(step).length);
  if(tok==="lmovers"){
    const names=moversFor(step).map(id=>CMAP[id].k);
    if(!names.length) return "nothing";
    return names.length===1 ? names[0]
      : names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  }
  /* {c1.who}, {c1.hrs}, {c1.rate}, {c1.cost} — person N of this step's crew,
     1-based. cost is hours x rate and is computed here, never written down. */
  const cm=/^c(\d+)\.(who|hrs|rate|cost)$/.exec(tok);
  if(cm){
    const p=((step.state||{}).crew||[])[parseInt(cm[1],10)-1];
    if(!p) return undefined;
    if(cm[2]==="who")  return p.who;
    if(cm[2]==="hrs")  return String(p.hrs);
    if(cm[2]==="rate") return money(p.rate);
    return money(p.hrs*p.rate);
  }
  /* {r1.wip}, {r4.profit}, {r2.name} — a figure or a name off row N of a
     many-row step, 1-based, in the order the rows are printed. This is how the
     real-page explanations quote several rows at once without any of those
     figures being typed by hand. */
  const rm=/^r(\d+)\.([a-z]+)$/.exec(tok);
  if(rm){
    const rows=step.rows||[]; const rs=rows[parseInt(rm[1],10)-1];
    if(!rs) return undefined;
    const d=derive(rs);
    if(rm[2]==="name") return d.name;
    return CMAP[rm[2]] ? fmtVal(CMAP[rm[2]], d[rm[2]]) : undefined;
  }
  const m=/^(after\.|d\.)?([a-z]+)$/.exec(tok);
  if(!m || !CMAP[m[2]] || !step.state) return undefined;
  const c=CMAP[m[2]], a=derive(step.state), b=derive(step.after||step.state);
  if(m[1]==="after.") return fmtVal(c, b[m[2]]);
  if(m[1]==="d.")     return fmtVal(c, Math.abs(b[m[2]] - a[m[2]]));
  return fmtVal(c, a[m[2]]);
}
function expand(txt, step){
  if(txt==null) return txt;
  /* THE DIGIT IN THIS CLASS IS LOad-BEARING. Without it {c1.who} and {r2.name}
     never match, so tokenValue() is never asked and the braces render on
     screen verbatim. expand() throws on an UNRESOLVED token and never threw
     here, because there was nothing to resolve. Both suites passed at 1,654
     checks with six screens showing literal code, including the whole of the
     "how an hour becomes a dollar" card and the entire explanation on the
     700 level's flagship item. The number audit could not see it: it proves no
     figure was typed TWICE, and an unexpanded token produces no figure at all.
     The guard is now in selfTest() and refuses to boot. */
  return String(txt).replace(/\{([A-Za-z][A-Za-z0-9.]*)\}/g, (m,tok)=>{
    const v = tokenValue(tok, step);
    if(v===undefined) throw new Error("unresolved token "+m+" on step "+step.id);
    return v;
  });
}

/* ---------- progress. Keyed on stable string ids, never on position. ----------
   KEY and SAVEV are declared with the warm-up block above, because the warm-up
   picker has to read prior answers before this loader runs. */
let ST={}, HW=0;   // HW is vestigial: nothing locks. Kept so older saves load.
(function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    /* accept any payload at or below this version and MIGRATE it rather than
       dropping it. Progress is keyed on stable step ids, so carrying it
       forward is safe; silently wiping weeks of three-minute sessions on a
       version bump is not. */
    if(raw && raw.st && typeof raw.v==="number" && raw.v<=SAVEV){
      const known=new Set(ALLSTEPS.map(s=>s.id));
      for(const k in raw.st) if(known.has(k)) ST[k]=raw.st[k];   // unknown ids dropped
      HW = Math.min(Math.max(0, raw.hw|0), SECTIONS.length-1);
    }
  }catch(e){}
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({v:SAVEV, st:ST, hw:HW})); }catch(e){} }
function rec(id, patch){ ST[id]=Object.assign({}, ST[id], patch); save(); }

const isScored = st => st.kind==="choice" || st.kind==="select"
                    || st.kind==="compute" || st.kind==="rowpick";

/* ---------- option order ----------
   The correct option sat at position 1 in six of nine items in v4, so "pick 1,
   then pick 2" cleared eight of nine inside the retry budget. Order is now
   shuffled per session, off SESSION_SEED above. Steps whose options have a
   natural reading order (up / down / it does not move) opt out with
   fixed:true. */
function optOrder(step){
  const n=(step.opts||[]).length;
  if(!n) return [];
  if(step.fixed){ const a=[]; for(let i=0;i<n;i++) a.push(i); return a; }
  return shuffleOrder(n, step.id);
}
/* Warm-up items are excluded from the section's own count. They are drawn from
   a pool and differ between sessions, so counting them would make the score on
   the map move for reasons he did not cause — and that count is his record of
   what he has done, not a live scoreboard. */
function secStat(i){
  const steps=SECTIONS[i].steps.filter(s=>!s.warm);
  const sc=steps.filter(isScored);
  const right=sc.filter(s=>ST[s.id] && ST[s.id].a===1).length;
  const seenAll=steps.every(s=>ST[s.id] && ST[s.id].v);
  return {n:sc.length, right, seenAll, complete: seenAll && right===sc.length};
}
/* NOTHING IS EVER LOCKED. [Josh, 260803]
   "No reason we shouldn't be able to jump around. It's not a college entry
   exam, it's a resource."
   This is a design decision, not a relaxed setting, and it settles two of the
   review's hardest findings at once. The behavioural risk was that one wrong
   answer sealed four sections and the only visible escape was wiping all
   progress; that risk is now structurally absent. And the measurement argument
   about whether "all correct" constitutes mastery stops being load-bearing,
   because nothing depends on the answer: the count is retrospective evidence
   of what he has done, which is the only kind of persistence this project ever
   agreed to keep. Do not reintroduce gating without re-reading both.
   `secStat().complete` survives ONLY as a label on the map. */
function bumpHW(){ save(); }
const unlocked = i => true;
function firstUnfinished(i){
  const steps=SECTIONS[i].steps;
  let found=-1;
  for(let k=0;k<steps.length;k++){
    const st=steps[k], r=ST[st.id];
    if(!r || !r.v){ found=k; break; }
    if(isScored(st) && r.a!==1){ found=k; break; }
  }
  if(found<0) return 0;
  const st=steps[found], r=ST[st.id];
  /* NEVER re-open on a question he has already got wrong. After a gap the
     app's first act was to re-administer the test he failed, which is the
     worst possible opening move for task initiation. Walk back to the nearest
     teaching card in this section so he arrives warm and walks in on his own
     momentum. */
  if(isScored(st) && r && r.a===0){
    for(let j=found-1;j>=0;j--)
      if(steps[j].kind==="concept" || steps[j].kind==="worked") return j;
  }
  return found;
}

/* ═══════════════════════════════════════════════════════════════════
   PART 5 — THE BOARD
   Three visual channels, never crossed:
     HUE           the direction the data moved (green up, red down,
                   amber deliberately unchanged)
     HEAVY BORDER  you chose this cell. Survives the reveal.
     BADGE         right, wrong, missed. Achromatic on purpose, so it
                   can sit on a red or green cell and still be read.
   ═══════════════════════════════════════════════════════════════════ */
const MASK="•••••";
const $ = id => document.getElementById(id);
let lastTrigger=null, lpTimer=null, suppressUntil=0;
const CALC_IDS = CELLS.filter(c=>c.calc).map(c=>c.id);

/* WHAT IS HIDDEN ON A QUESTION SCREEN, and why it changed.
   v4.0 masked the whole board. That removed information the learner needed
   and gave nothing back: on the two hardest questions in the app the answer
   turns on the fee and the total expected cost, and v4.0 had both hidden and
   neither restated in the question, so the only way through was to pattern-
   match the worked example — which is the exact failure masking existed to
   prevent. Now only the DASHED calculated cells are hidden. Showing the three
   that arrive from outside the page leaks no answer anywhere, and it teaches
   the section-1 distinction again on every question screen for free. */
function maskSet(opt){
  const vis=visibleIds(opt.layout);
  if(opt.mask===true) return new Set(vis);
  if(Array.isArray(opt.mask)) return new Set(opt.mask.filter(id=>vis.indexOf(id)>=0));
  return new Set();
}
const hiddenCalc = layout => CALC_IDS.filter(id=>visibleIds(layout).indexOf(id)>=0);

function drawBoard(state, opt){
  clearTimeout(lpTimer);
  const s=derive(state), L=LAYOUTS[opt.layout], hide=maskSet(opt);
  let html='<div class="jobname">'+(s.name||"")+'</div>';
  html += L.map(row=>'<div class="brow">'+row.map(x=>{
    if(!CMAP[x]) return '<div class="op" aria-hidden="true">'+x+'</div>';
    const c=CMAP[x], masked=hide.has(x);
    const spoken = masked ? "value hidden for this question" : fmtVal(c,s[x]);
    /* BARE MODE. Suppresses the formula subtitle under every calculated field
       and the "?" definition button. Thirteen of seventeen questions in v4
       were answerable off the screen furniture alone, because the board prints
       every formula permanently and the glossary contains several answers
       verbatim. The glossary is NOT stripped from the learning path — it is the
       reader's lifeline and it exists because of a real memory profile. Bare
       mode is used only where the point is to measure rather than to teach. */
    const bare = !!opt.bare;
    /* Bare also drops the DASHED EDGE on calculated cells. That edge is an
       annotation, and the real report carries none: nothing on the real page
       tells you which of its numbers are opinions. Leaving the dash in place
       would have made the transfer item a lookup. */
    return '<div class="cell'+((c.calc&&!bare)?' calc':'')+((opt.tappable&&!bare)?' hasq':'')
      + '" id="cell-'+x+'" data-id="'+x+'">'
      + '<button type="button" class="cellhit" data-id="'+x+'" aria-label="'
      + c.k+((c.sub&&!bare)?", "+c.sub:"")+", "+spoken+'"'
      + (opt.tappable?' aria-pressed="false"':'')+'>'
      + '<span class="k" aria-hidden="true">'+c.k+'</span>'
      + ((c.sub&&!bare)?'<span class="s" aria-hidden="true">'+c.sub+'</span>':'')
      + '<span class="v'+(masked?' mask':'')+'" aria-hidden="true">'
      + (masked?MASK:fmtVal(c,s[x]))+'</span></button>'
      + ((opt.tappable&&!bare)
          ? '<button type="button" class="cellq" data-id="'+x+'" aria-label="What does '
            + c.k+' mean?">?</button>'
          : '')
      + '</div>';
  }).join("")+'</div>').join("");
  $("board").innerHTML=html;
  $("board").className = opt.bare ? "bare" : "";
  const lp=$("lphint"); if(lp) lp.style.display = opt.bare ? "none" : "";
  wireCells(!!opt.tappable, !!opt.bare);
}

/* ---------- the real report: a whole page of rows, not one job ----------
   Every other screen in this app shows one job unfolded in calculation order.
   The artifact he actually opens is a table of many jobs in report order, and
   no item in v4 ever put him in front of one. Nothing here is masked and
   nothing carries a formula subtitle: the page he has to read does not
   annotate itself. */
function drawRows(step, opt){
  opt=opt||{};
  clearTimeout(lpTimer);
  const cols=visibleIds("real");
  let h='<div class="rp"><table><thead><tr><th class="jn" scope="col">PROJECT</th>'
    + cols.map(id=>'<th scope="col">'+CMAP[id].k+'</th>').join("")
    + '</tr></thead><tbody>';
  step.rows.forEach((rs,i)=>{
    const d=derive(rs);
    h+='<tr data-row="'+i+'"'+(opt.tappable?' tabindex="0" role="button" aria-pressed="false"':'')+'>'
      + '<th class="jn" scope="row">'+d.name+'</th>'
      + cols.map(id=>'<td>'+fmtVal(CMAP[id],d[id])+'</td>').join("")+'</tr>';
  });
  h+='</tbody></table></div>';
  $("board").innerHTML=h;
  $("board").className="bare";
  const lp=$("lphint"); if(lp) lp.style.display="none";
  if(opt.tappable){
    document.querySelectorAll("#board tbody tr").forEach(tr=>{
      const toggle=()=>{ const on=tr.classList.toggle("pick");
        tr.setAttribute("aria-pressed", on?"true":"false"); setMode(step); };
      tr.onclick=toggle;
      tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };
    });
    setMode(step);
  } else setMode(null);
}

/* ---------- mode chrome ----------
   On a select or rowpick step the board stops being a readout and becomes the
   answer control. That was previously discoverable only by tapping it. */
function setMode(step, resultText){
  const el=$("modechrome"); if(!el) return;
  if(!step){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="";
  if(resultText!==undefined){ el.innerHTML='<span>'+resultText+'</span>'; return; }
  const rows = step.kind==="rowpick";
  const n = rows ? document.querySelectorAll("#board tbody tr.pick").length
                 : document.querySelectorAll("#board .cell.chosen").length;
  el.innerHTML='<span>'+(rows?"Tap the rows":"Tap the fields")+' · '+n+' selected</span>'
    + (n ? '<button class="clr" type="button" onclick="clearPicks()">Clear</button>' : '');
}
function clearPicks(){
  document.querySelectorAll("#board tbody tr.pick").forEach(tr=>{
    tr.classList.remove("pick"); tr.setAttribute("aria-pressed","false"); });
  document.querySelectorAll("#board .cell.chosen").forEach(c=>{
    c.classList.remove("chosen");
    const hit=c.querySelector(".cellhit"); if(hit) hit.setAttribute("aria-pressed","false"); });
  setMode(cur());
}

function wireCells(tappable, bare){
  document.querySelectorAll("#board .cellq").forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); showDef(b.dataset.id, b); };
  });
  document.querySelectorAll("#board .cellhit").forEach(b=>{
    const id=b.dataset.id;
    if(tappable){
      /* On a select step the cell IS the answer control, and there is NO
         long-press: a deliberate press was opening a definition instead of
         choosing, which cost two taps and looked like the app ignoring you.
         The "?" button, rendered only on these steps, is the definition path. */
      b.onclick=()=>{
        /* NO suppression guard here. The "?" is a sibling button that does not
           bubble, and there is no long-press on this step, so nothing can have
           legitimately armed a guard. The guard being global is what swallowed
           the first tap after every definition lookup. */
        const on=$("cell-"+id).classList.toggle("chosen");
        b.setAttribute("aria-pressed", on?"true":"false");
        setMode(cur());
      };
      return;
    }
    /* In bare mode the definitions are deliberately unreachable, so the cell
       body must not silently keep opening them. */
    if(bare) return;
    b.onclick=()=>{ if(Date.now()<suppressUntil) return; showDef(id,b); };
    const start=()=>{ clearTimeout(lpTimer); lpTimer=setTimeout(()=>showDef(id,b),650); };
    const stop =()=> clearTimeout(lpTimer);
    b.addEventListener("touchstart",start,{passive:true});
    ["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener("mousedown",start);
    b.addEventListener("contextmenu",e=>{ e.preventDefault(); showDef(id,b); });
  });
}

function setCell(id, from, to, opt){
  opt=opt||{};
  const el=$("cell-"+id); if(!el) return;
  const c=CMAP[id], a=derive(from), b=derive(to);
  const d=b[id]-a[id], moved=Math.abs(d)>0.005;
  const v=el.querySelector(".v");
  if(v){ v.className="v"; v.textContent=fmtVal(c,b[id]); }
  const hit=el.querySelector(".cellhit");
  if(hit) hit.setAttribute("aria-label", c.k+(c.sub?", "+c.sub:"")+", "+fmtVal(c,b[id])
    + (moved ? ", was "+fmtVal(c,a[id]) : ""));
  el.classList.remove("up","down","still","flash");
  void el.offsetWidth;
  if(opt.direction!==false){
    el.classList.add(moved ? (d>0?"up":"down") : "still", "flash");
    if(!el.querySelector(".chip"))
      el.insertAdjacentHTML("beforeend", moved
        ? '<span class="chip '+(d>0?"up":"down")+'" aria-hidden="true">'+(d>0?"▲":"▼")+'</span>'
        : '<span class="chip still" aria-hidden="true">'+(opt.stillLabel||"NO CHANGE")+'</span>');
    if(moved && !el.querySelector(".was"))
      el.insertAdjacentHTML("beforeend", '<span class="was" aria-hidden="true">was '+fmtVal(c,a[id])+'</span>');
  } else {
    el.classList.add("flash");
  }
}
function badge(id, kind, text){
  const el=$("cell-"+id); if(!el || el.querySelector(".badge")) return;
  /* a judgement badge and a direction chip overlap by about a third of a cell
     on a phone. At the moment of judgement the badge is the information; hue
     and the "was" line still carry the direction. */
  const chip=el.querySelector(".chip"); if(chip) chip.remove();
  el.insertAdjacentHTML("beforeend", '<span class="badge '+kind+'" aria-hidden="true">'+text+'</span>');
  const hit=el.querySelector(".cellhit");
  if(hit) hit.setAttribute("aria-label",(hit.getAttribute("aria-label")||"")+". "
    + text.replace(/[^A-Za-z ]/g,"").trim().toLowerCase());
}

/* ---------- definition dialog ---------- */
const defOpen = () => $("defWrap").style.display==="flex";
function showDef(id, trigger){
  const c=CMAP[id]; if(!c||!c.def) return;
  suppressUntil=Date.now()+400; lastTrigger=trigger||null;
  $("defBody").innerHTML=c.def;
  $("defWrap").style.display="flex";
  $("defClose").focus();
}
function hideDef(){
  $("defWrap").style.display="none";
  if(lastTrigger && lastTrigger.focus) lastTrigger.focus();
  lastTrigger=null;
}

/* ═══════════════════════════════════════════════════════════════════
   PART 6 — THE ENGINE
   Nothing below needs editing to add, remove or reorder content.
   ═══════════════════════════════════════════════════════════════════ */
let view="map", SEC=0, S=0, answered=false, tries=0, warned=false, wIdx=0, OPTORDER=null;

const cur = () => SECTIONS[SEC].steps[S];
/* bare mode can be set on a step or on a whole section */
const bareOn = step => !!(step.bare || (SECTIONS[SECOF[step.id]]||{}).bare);
const foot = h => { $("foot").innerHTML=h; };
const primary = (label,fn,cls) =>
  '<button class="btn '+(cls||"")+'" type="button" onclick="'+fn+'">'+label+'</button>';
const ghost = (label,fn) =>
  '<button class="btn ghost" type="button" onclick="'+fn+'">'+label+'</button>';
/* step 0 used to render a dead disabled Back, leaving an 11px pill in the top
   corner as the only exit. prevStep() already knew how to fall through. */
const backBtn = () => S===0 ? ghost("All sections","goMap()") : ghost("Back","prevStep()");
const lastStep = () => S >= SECTIONS[SEC].steps.length-1;

function srcHTML(step){
  return (step.src||[]).map(k=>{
    const s=SRC[k]; if(!s) return "";
    return s.callout
      ? '<div class="confirm"><span class="h">'+s.h+'</span>'+s.t+'</div>'
      : '<details class="src"><summary>Where this comes from</summary><p>'+s.t+'</p></details>';
  }).join("");
}
function tallyHTML(){
  const st=secStat(SEC);
  return '<div class="tally">'+st.right+' of '+st.n+' answered correctly in this section</div>';
}

/* A visually hidden heading on every screen that would otherwise render none.
   Four of six step kinds produced no heading at all, so heading-jump came up
   empty on most of the app. */
const SR='style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;'
       + 'overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0"';

function render(){
  if(view==="map") return renderMap();
  if(view==="end") return renderEnd();
  const sec=SECTIONS[SEC], step=cur();
  $("where").textContent=sec.name;
  /* Clearing the long-press timer belongs HERE, not only in drawBoard. Leaving
     a board step for a card that has no board never called drawBoard, so an
     armed long-press survived the navigation and popped a definition open on
     the next screen. It only became reachable once a level of pure teaching
     cards existed to navigate into. */
  clearTimeout(lpTimer);
  answered=false; tries=0; warned=false; wIdx=0;
  $("map").style.display="none";
  $("right").style.display="";
  $("topbtn").style.display="";
  const teaching = step.kind==="concept" || step.kind==="worked";
  $("right").className = teaching ? "teach" : "ask";
  const pos=(S+1)+" of "+sec.steps.length;
  $("band").className="band "+(teaching?"teach":"ask");
  $("band").textContent = step.warm            ? "Warm-up · "+pos
                        : step.kind==="concept" ? "Read · "+pos
                        : step.kind==="worked"  ? "Watch · "+pos
                        : "Your turn · "+pos;
  window.scrollTo(0,0);

  if(step.kind==="concept"){
    $("left").style.display="none";
    $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
      +'<div class="body">'+expand(step.body,step)+'</div>'+srcHTML(step);
    foot(backBtn()+'<span class="spacer"></span>'
      +primary(lastStep()?"Finish section":"Continue","nextStep()"));
    return;
  }
  $("left").style.display="";

  if(step.kind==="worked"){
    setMode(null);
    drawBoard(step.state,{layout:sec.layout, mask:!!step.blank, bare:bareOn(step)});
    $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
      +'<div class="body" id="wtext">'+expand(step.setup,step)+'</div>';
    foot(backBtn()+'<span class="spacer"></span>'
      +primary(expand(step.button||"Follow it through",step),"showStage(0)"));
    return;
  }

  /* A question already answered correctly re-opens as a REVIEW, not a re-test.
     One stray tap while re-reading used to overwrite a correct answer. A tool
     built to be consulted cannot only be taken. */
  if(isScored(step) && ST[step.id] && ST[step.id].a===1) return reviewStep(step);

  if(step.kind==="rowpick"){
    drawRows(step,{tappable:true});
    $("panel").innerHTML='<h1 '+SR+'>'+sec.name+', step '+pos+'</h1>'
      +'<div class="body">'+expand(step.q,step)+'</div>'
      +'<div class="hint">Tap rows in the table above. Tap again to unselect. '
      +'It scrolls sideways, exactly as the real one does.</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn" type="button" onclick="submitRows()">Submit</button>';
    foot(backBtn()+'<span class="spacer"></span>'+primary("Submit","submitRows()"));
    return;
  }

  /* `showall` un-masks the calculated cells on a question screen. It is used
     only on orientation items, where the question is about what the board IS
     rather than about a value on it, and a row of dots would be noise. */
  drawBoard(step.state,{layout:sec.layout,
                        mask: step.showall ? [] : hiddenCalc(sec.layout),
                        tappable:step.kind==="select", bare:bareOn(step)});
  setMode(step.kind==="select" ? step : null);

  if(step.kind==="choice"){
    OPTORDER=optOrder(step);
    $("panel").innerHTML='<h1 '+SR+'>'+sec.name+', step '+pos+'</h1>'
      +'<div class="body">'+expand(step.q,step)+'</div>'
      +'<div class="opts" id="opts">'+OPTORDER.map((real,disp)=>
        '<button class="opt" type="button" onclick="pick('+disp+')">'
        +expand(step.opts[real],step)+'</button>').join("")
      +'</div><div id="msg" role="status"></div>';
    foot(backBtn()+'<span class="spacer"></span><span class="hint">Choose one</span>');
    return;
  }
  if(step.kind==="select"){
    $("panel").innerHTML='<h1 '+SR+'>'+sec.name+', step '+pos+'</h1>'
      +'<div class="body">'+expand(step.q,step)+'</div>'
      +'<div class="hint">Tap fields on the board above. Tap again to unselect.'
      +(bareOn(step)?'':' The <b>?</b> on each field explains what it means.')+'</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn" type="button" onclick="submitSel()">Submit</button>';
    foot(backBtn()+'<span class="spacer"></span>'+primary("Submit","submitSel()"));
    return;
  }
  /* TYPED STEPS: the primary control is repeated IN THE PANEL, above the fold.
     The fixed bottom bar sits underneath the iOS keyboard, and the Enter
     fallback cannot fire because a decimal keypad has no Return key, so the
     bar alone was a dead end on every typed question in the app. */
  if(step.kind==="compute"){
    $("panel").innerHTML='<h1 '+SR+'>'+sec.name+', step '+pos+'</h1>'
      +'<div class="body">'+expand(step.q,step)+'</div>'
      +'<input class="numin" id="numin" inputmode="decimal" enterkeyhint="go" autocomplete="off" '
      +'aria-label="Your answer" placeholder="type your answer">'
      +'<div class="hint">'+expand(step.hint||"",step)+'</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn" type="button" onclick="submitNum()">Check</button>';
    foot(backBtn()+'<span class="spacer"></span>'+primary("Check","submitNum()"));
    $("numin").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();submitNum();} });
    return;
  }
  if(step.kind==="explain"){
    const prev=(ST[step.id]&&ST[step.id].txt)||"";
    $("panel").innerHTML='<h1 '+SR+'>'+sec.name+', step '+pos+'</h1>'
      +'<div class="body">'+expand(step.prompt,step)+'</div>'
      +'<textarea class="txtin" id="txtin" aria-label="Your explanation" '
      +'placeholder="Write it out. Nobody but you sees this.">'+prev+'</textarea>'
      +'<div class="hint">There is no grade here, and skipping it blocks nothing. '
      +'You compare your own words against a model answer.</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn dark" type="button" onclick="showModel()">Show the model answer</button>'
      +ghost("Skip — it blocks nothing","skipExplain()");
    foot(backBtn()+'<span class="spacer"></span>'+primary("Show the model answer","showModel()","dark"));
    return;
  }
}

function reviewStep(step){
  answered=true;
  if(step.kind==="rowpick"){ drawRows(step,{}); setMode(null); }
  else revealBoard(step, []);
  $("panel").innerHTML='<div class="verdict s" role="status">Answered</div>'
    +'<div class="body">'+expand(step.q,step)+'</div>'
    +'<div class="body">'+expand(step.why,step)+'</div>'+srcHTML(step);
  foot(backBtn()+'<span class="spacer"></span>'+ghost("Try it again","retry()")
    +primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
}
/* Retry clears the answer but NEVER a1. First-attempt correctness is written
   once and is the only honest record in the file; wiping it on retry would
   have made it a record of persistence instead. Nothing depends on it — the
   gate is gone — so it is purely a read for him. */
function retry(){
  const step=cur(), prev=ST[step.id]||{};
  ST[step.id]= (prev.a1===undefined) ? {v:1} : {v:1, a1:prev.a1};
  save(); render();
}

/* ---------- worked examples: one stage per tap, text replaced ---------- */
function showStage(i){
  const sec=SECTIONS[SEC], step=cur();
  setMode(null);
  wIdx=Math.max(0, Math.min(i, step.stages.length-1));
  const reached=new Set();
  for(let k=0;k<=wIdx;k++) (step.stages[k].cells||[]).forEach(id=>reached.add(id));
  /* Any calculated cell not yet reached is masked. Mid-sequence the board used
     to display arithmetic that contradicted the rule printed two lines above
     it — EAC still reading its old total while JTD had already moved. */
  const pending = visibleIds(sec.layout).filter(id=>CMAP[id].calc && !reached.has(id));
  drawBoard(step.state,{layout:sec.layout, mask: step.blank ? true : pending, bare:bareOn(step)});
  for(let k=0;k<=wIdx;k++){
    (step.stages[k].cells||[]).forEach(id=>{
      if(step.blank) setCell(id, step.state, step.state, {direction:false});
      else setCell(id, step.state, step.after||step.state, {stillLabel:step.stillLabel});
    });
  }
  const st=step.stages[wIdx];
  $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
    +'<div class="stagen">Step '+(wIdx+1)+' of '+step.stages.length+'</div>'
    +'<div class="body fade">'+expand(st.text,step)+'</div>'
    +(wIdx===step.stages.length-1 ? srcHTML(step) : "");
  const back = wIdx===0 ? backBtn() : ghost("Back","showStage("+(wIdx-1)+")");
  const next = wIdx < step.stages.length-1
    ? primary("Next","showStage("+(wIdx+1)+")")
    : primary(lastStep()?"Finish section":"Continue","nextStep()");
  foot(back+'<span class="spacer"></span>'+next);
  window.scrollTo(0,0);
}

/* ---------- grading. Answers are stored, not views. ---------- */
function msg(html,cls){ const m=$("msg"); if(m) m.innerHTML='<div class="'+(cls||"warn")+'">'+html+'</div>'; }
/* a1 — FIRST-ATTEMPT correctness, written once and never overwritten.
   Unlimited retries are the design, so without a1 the app could only ever say
   "resolved", which is a record of persistence rather than of knowing.

   IT CANNOT LIVE IN grade(). A first wrong answer never reaches grade(): it
   short-circuits into the one-more-try message, so by the time grade() runs
   the attempt counter has already moved and every wrong first try was being
   recorded as a first-time-right. Caught by the smoke suite on nine of nine
   choice items. noteFirst() is therefore called on EVERY real attempt, before
   the retry branch — and never on an unreadable entry or an empty submit,
   because those are not answers. */
function noteFirst(step, ok){
  const prev=ST[step.id]||{};
  if(prev.a1===undefined) rec(step.id,{a1: ok?1:0});
}
function grade(ok){
  const step=cur();
  answered=true;
  const prev=ST[step.id]||{};
  const patch={a:ok?1:0, n:tries+1, v:1};
  if(prev.a1===undefined) patch.a1 = ok?1:0;   // belt and braces
  rec(step.id, patch);
  bumpHW();
  return ok;
}
function verdictHTML(ok){
  return '<div class="verdict '+(ok?"y":"n")+'" role="status">'+(ok?"Correct":"Not quite")+'</div>';
}
function revealBoard(step, keepChosen){
  const sec=SECTIONS[SEC];
  drawBoard(step.after||step.state,{layout:sec.layout});
  /* Every visible cell gets a treatment on a movement question, not only the
     ones that moved. On the planned-booking question the entire explanation is
     about EAC COST NOT moving, and EAC was the single cell on the board
     carrying no mark at all — the one the sentence was about. */
  const movementItem = !!step.after || step.kind==="select";
  if(step.mode!=="identify" && movementItem){
    visibleIds(sec.layout).forEach(id=>setCell(id, step.state, step.after||step.state,
      {stillLabel:step.stillLabel||"NO CHANGE"}));
  }
  (keepChosen||[]).forEach(id=>{
    const el=$("cell-"+id); if(!el) return;
    el.classList.add("chosen");
    const hit=el.querySelector(".cellhit");
    if(hit) hit.setAttribute("aria-pressed","true");
  });
}
function reveal(ok, step, keepChosen){
  revealBoard(step, keepChosen);
  $("panel").innerHTML = verdictHTML(ok)
    + '<div class="body">'+expand(step.why,step)+'</div>'
    + srcHTML(step) + tallyHTML();
  foot(backBtn()+'<span class="spacer"></span>'
    + (ok ? "" : ghost("Try it again","retry()"))
    + primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
}

/* `disp` is the DISPLAYED position. OPTORDER maps it back to the authored
   index, because options are shuffled per session. */
function pick(disp){
  if(answered) return;
  const step=cur();
  const btns=[...document.querySelectorAll("#opts .opt")];
  const order = OPTORDER && OPTORDER.length===btns.length
    ? OPTORDER : btns.map((_,k)=>k);
  const real = order[disp], keyDisp = order.indexOf(step.a);
  noteFirst(step, real===step.a);
  if(real===step.a){
    btns.forEach((b,j)=>{ b.disabled=true; if(j===keyDisp) b.classList.add("right"); });
    btns[disp].classList.add("chosen");
    grade(true); return reveal(true, step);
  }
  if(tries===0){
    tries=1; btns[disp].disabled=true; btns[disp].classList.add("wrong");
    msg("Not quite. <b>One more try</b> — pick again.");
    return;
  }
  btns.forEach((b,j)=>{ b.disabled=true;
    if(j===keyDisp) b.classList.add("right"); else if(j===disp) b.classList.add("wrong"); });
  grade(false); reveal(false, step);
}

function submitSel(){
  if(answered) return;
  const step=cur();
  const picked=[...document.querySelectorAll("#board .cell.chosen")].map(e=>e.dataset.id);
  if(!picked.length && !warned){
    warned=true;
    msg("Nothing is selected. If you mean <b>none of them move</b>, tap Submit again and that is the answer you will give.");
    return;
  }
  const want=answerIds(step);
  const ok = picked.length===want.length && picked.slice().sort().join()===want.slice().sort().join();
  noteFirst(step, ok);
  if(!ok && tries===0){
    tries=1; warned=true;
    msg("Not quite. <b>One more try</b> — change your selection and submit again.");
    return;
  }
  grade(ok);
  reveal(ok, step, picked);
  const vis=visibleIds(SECTIONS[SEC].layout);
  vis.forEach(id=>{
    const p=picked.includes(id), w=want.includes(id);
    if(p&&w) badge(id,"right","✓ RIGHT");
    else if(p&&!w) badge(id,"wrong","✗ WRONG");
    else if(!p&&w) badge(id,"missed","○ MISSED");
  });
  setMode(step, "Result · you chose "+picked.length+" of "+vis.length);
}

/* ---------- the real report: grading a row selection ---------- */
function submitRows(){
  if(answered) return;
  const step=cur();
  const picked=[...document.querySelectorAll("#board tbody tr.pick")]
    .map(tr=>parseInt(tr.dataset.row,10)+1);
  if(!picked.length && !warned){
    warned=true;
    msg("Nothing is selected. If you mean <b>none of these rows</b>, tap Submit again and that is the answer you will give.");
    return;
  }
  const want=(step.ids||[]).slice();
  const ok = picked.length===want.length
    && picked.slice().sort().join()===want.slice().sort().join();
  noteFirst(step, ok);
  if(!ok && tries===0){
    tries=1; warned=true;
    msg("Not quite. <b>One more try</b> — change your selection and submit again.");
    return;
  }
  grade(ok);
  drawRows(step,{});
  document.querySelectorAll("#board tbody tr").forEach(tr=>{
    const n=parseInt(tr.dataset.row,10)+1;
    const p=picked.indexOf(n)>=0, w=want.indexOf(n)>=0, jn=tr.querySelector(".jn");
    if(p&&w){ tr.classList.add("rr"); jn.insertAdjacentHTML("beforeend",'<span class="rpmark">&#10003; RIGHT</span>'); }
    else if(p&&!w){ tr.classList.add("rw"); jn.insertAdjacentHTML("beforeend",'<span class="rpmark wrong">&#10007; WRONG</span>'); }
    else if(!p&&w){ tr.classList.add("rm"); jn.insertAdjacentHTML("beforeend",'<span class="rpmark missed">&#9675; MISSED</span>'); }
  });
  setMode(step, "Result &middot; you chose "+picked.length+" of "+step.rows.length+" rows");
  $("panel").innerHTML = verdictHTML(ok)
    + '<div class="body">'+expand(step.why,step)+'</div>'
    + srcHTML(step) + tallyHTML();
  foot(backBtn()+'<span class="spacer"></span>'
    + (ok ? "" : ghost("Try it again","retry()"))
    + primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
}

function parseNum(raw){
  let t=String(raw||"").trim().replace(/−/g,"-").replace(/[$,\s]/g,"")
        .replace(/×/g,"*").replace(/÷/g,"/");
  if(t.endsWith("%")) t=t.slice(0,-1);
  let mult=1;
  const suf=/^(-?[\d.]+)([kKmM])$/.exec(t);          // 80k, 1.2m — the notation people use
  if(suf){ t=suf[1]; mult = /[kK]/.test(suf[2]) ? 1000 : 1000000; }
  t=t.replace(/[xX]/g,"*");
  if(!t) return NaN;
  if(/^-?\d*\.?\d+$/.test(t)) return parseFloat(t)*mult;
  if(/^[0-9+\-*/(). ]+$/.test(t)){
    try{ const v=Function('"use strict";return ('+t+')')();
      return (typeof v==="number" && isFinite(v)) ? v*mult : NaN; }catch(e){ return NaN; }
  }
  return NaN;
}
function submitNum(){
  if(answered) return;
  const step=cur(), el=$("numin"), raw=(el.value||""), n=parseNum(raw);
  /* An unreadable entry is NOT an answer. It used to consume the retry and
     then grade you wrong, so typing "100k" twice — the correct answer, twice —
     was scored as a failure. */
  if(isNaN(n)){
    msg(raw.trim()
      ? "That is not a number I can read. Digits are fine, and so is <b>80k</b>, or a sum like <b>40000+40000</b>. This does not count as a try."
      : "Nothing typed yet. <b>Type an answer</b> — this does not count as a try.");
    return;
  }
  const target=computeAnswer(step), c=CMAP[step.field];
  const hadPct = raw.indexOf("%")>=0;
  const ok = c.fmt==="pct"
    ? (hadPct ? Math.abs(n-target*100)<=0.1
              : (Math.abs(n-target*100)<=0.1 || Math.abs(n-target)<=0.001))
    : Math.abs(n-target)<=1;
  noteFirst(step, ok);
  if(!ok && tries===0){
    tries=1;
    msg("Not quite. <b>One more try</b> — check the arithmetic and tap Check again.");
    el.select();
    return;
  }
  el.disabled=true; el.style.borderColor = ok?"var(--up)":"var(--down)";
  grade(ok); reveal(ok, step);
}

/* ---------- constructed response. Self-scored, always skippable. ----------
   The stated success criterion is that Josh can say this OUT LOUD, cold, to
   his boss. This is the only instrument in the app that touches it, and in v4
   it was contaminated by its own construction: one button committed the text
   AND revealed the model, so there was never a moment where he had committed
   to an answer and had not yet seen a better one.

   Two changes. A PRE-REVEAL tap, before the model renders, asking whether he
   could say it right now — the only uncontaminated datum in the file. And a
   PER-BULLET checklist instead of one gestalt rating, because six binary
   judgements against six propositions beat one feeling about a paragraph.
   The gap between the two is the actionable signal, and it is reported flatly,
   in both directions, with no encouragement attached. */
function skipExplain(){ rec(cur().id,{sk:1, v:1}); nextStep(); }

function showModel(){
  const step=cur();
  const txt=($("txtin")&&$("txtin").value)||"";
  rec(step.id,{txt:txt, v:1});
  $("panel").innerHTML='<div class="verdict s" role="status">Before you look</div>'
    +'<div class="body">'+(txt.trim()
        ? 'You have written it down. The model answer is on the next tap.'
        : 'You did not write anything, which is fine. The model answer is on the next tap.')
    +'<br><br><b>Could you say that out loud to Ron right now, cold, with the report open in front of him?</b></div>'
    +'<div class="opts" id="preopts">'
      +'<button class="opt" type="button" onclick="preAns(1)">Yes</button>'
      +'<button class="opt" type="button" onclick="preAns(0)">Not yet</button>'
    +'</div>'
    +'<div class="hint">Nothing turns on the answer. It is asked before the model appears because afterwards it is unanswerable.</div>';
  foot(backBtn()+'<span class="spacer"></span>'+ghost("Skip — it blocks nothing","skipExplain()"));
  window.scrollTo(0,0);
}

function preAns(v){ rec(cur().id,{pre:v}); revealModel(); }

function revealModel(){
  const step=cur(), r=ST[step.id]||{}, txt=r.txt||"";
  const items=step.model.map((m,i)=>
    '<li><button class="chk" type="button" id="chk'+i+'" aria-pressed="false" '
    +'onclick="toggleChk('+i+')"><span class="box" aria-hidden="true"></span>'
    +'<span>'+expand(m,step)+'</span></button></li>').join("");
  $("panel").innerHTML='<div class="verdict s" role="status">Compare</div>'
    +'<div class="body">'+(txt.trim()
        ? 'What you wrote:<br><br><i>'+txt.replace(/[<>]/g,"")+'</i>'
        : 'You did not write anything. Read the model answer, then come back to this step when you want to try it cold.')+'</div>'
    +'<div class="model"><div class="h">A model answer, point by point</div>'
    +'<div class="body" style="font-size:14px;margin-bottom:6px">Tap each point your own words actually covered.</div>'
    +'<ul class="chklist">'+items+'</ul></div>'
    +'<div id="msg" role="status"></div>';
  foot(backBtn()+'<span class="spacer"></span>'
    +primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
  scoreChk();
}

function toggleChk(i){
  const b=$("chk"+i); if(!b) return;
  const on=b.classList.toggle("on");
  b.setAttribute("aria-pressed", on?"true":"false");
  scoreChk();
}
function scoreChk(){
  const step=cur(), r=ST[step.id]||{};
  const boxes=[...document.querySelectorAll(".chklist .chk")];
  const hit=boxes.filter(b=>b.classList.contains("on")).length;
  rec(step.id,{chk:hit, chkn:boxes.length});
  if(!hit){ msg("Nothing ticked yet.","hint"); return; }
  /* the gap between what he said he could do and what he actually covered */
  let line = hit+" of "+boxes.length+" points covered.";
  if(r.pre===1 && hit < boxes.length)
    line += " You said you could say it cold, and "+(boxes.length-hit)
         +" point"+(boxes.length-hit===1?" was":"s were")+" not in what you wrote. That gap is the useful part of this screen.";
  else if(r.pre===0 && hit===boxes.length)
    line += " You said not yet, and you covered all of them.";
  else if(r.pre===1 && hit===boxes.length)
    line += " That matches what you said before you looked.";
  msg(line+" Nothing here is scored and nothing depends on it.","hint");
}

/* ---------- the section map ---------- */
function goMap(){ view="map"; render(); }
function openSection(i){
  if(i<0 || i>=SECTIONS.length) return;
  SEC=i; S=firstUnfinished(i); view="sec"; render();
}
function resume(){
  for(let i=0;i<SECTIONS.length;i++) if(!secStat(i).complete) return openSection(i);
  openSection(SECTIONS.length-1);
}
function resetAll(){
  if(!confirm("Clear all progress, including anything you have typed, and start again from the beginning?")) return;
  ST={}; HW=0; save(); goMap();
}
function renderMap(){
  view="map";
  $("map").style.display="flex";
  $("left").style.display="none";
  $("right").style.display="none";
  $("topbtn").style.display="none";
  const totalSc=SECTIONS.reduce((n,s)=>n+s.steps.filter(x=>isScored(x)&&!x.warm).length,0);
  const rightSc=SECTIONS.reduce((n,s,i)=>n+secStat(i).right,0);
  const touched=Object.keys(ST).length>0;
  let html='<h1 class="maphead">How the firm counts money</h1>'
    +'<div class="mapsub">Every figure in here is invented and no real Buro Happold project appears.'
    +'<br><b>'+rightSc+' of '+totalSc+' questions answered correctly.</b> '
    +'Start anywhere, in any order, and retry anything as often as you like. '
    +'It saves after every answer, so you can stop mid-section and lose nothing.</div>';
  let lvl=null;
  const nextUp=SECTIONS.findIndex((x,k)=>!secStat(k).complete);
  SECTIONS.forEach((s,i)=>{
    if(s.level!==lvl){
      lvl=s.level;
      html+='<h2 class="lvlhead">'+String(s.level).padStart(3,"0")
        +' level <span>· '+(LEVELCAP[s.level]||"")+'</span></h2>';
    }
    /* every row is open. The progress column is a record of what he has done,
       never a barrier and never a reason he cannot go somewhere. */
    const st=secStat(i);
    const started = st.right>0 || SECTIONS[i].steps.some(x=>ST[x.id]&&ST[x.id].v);
    const prog = st.complete ? "All "+st.n+" correct"
      : started ? st.right+" of "+st.n+" correct"
      : "Not started";
    html+='<button class="sec '+(st.complete?"done":"")+' '+(nextUp===i?"now":"")
      +'" type="button" onclick="openSection('+i+')">'
      +'<span class="secnum">'+(st.complete?"✓":i+1)+'</span>'
      +'<span class="secbody"><span class="secname">'+s.name+'</span>'
      +'<span class="secline">'+s.line+' · '+s.steps.length+' steps</span></span>'
      +'<span class="secprog">'+prog+'</span></button>';
  });
  /* Reset used to sit in the footer slot that says "Back" on every other
     screen, on the screen he opens every single time. */
  html+='<button class="resetlink" type="button" onclick="resetAll()">Start over from the beginning</button>'
    +'<div class="mapfoot"><span id="ver">'+BUILD+'</span></div>';
  $("map").innerHTML=html;
  $("where").textContent="Money Puzzles";
  foot('<span class="spacer"></span>'+primary(touched?"Continue":"Start","resume()"));
  window.scrollTo(0,0);
}

/* ---------- navigation ---------- */
/* ---------- an ending ----------
   Finishing the last step of a section used to land silently on the map, with
   no acknowledgement that anything had been finished. This is not a reward
   screen: no praise, no exclamation marks, no encouragement. It states what
   was done, in the same flat voice as the verdicts, and offers the door. */
function renderEnd(){
  const sec=SECTIONS[SEC], st=secStat(SEC);
  const nextI = SEC+1 < SECTIONS.length ? SEC+1 : -1;
  $("map").style.display="none";
  $("left").style.display="none";
  $("right").style.display="";
  $("topbtn").style.display="";
  $("where").textContent=sec.name;
  $("right").className="teach";
  $("band").className="band teach";
  $("band").textContent="End of section";
  const line = st.n===0
    ? "Nothing in this one was scored."
    : st.right===st.n
      ? "All "+st.n+" of its questions are answered correctly."
      : st.right+" of its "+st.n+" questions are answered correctly. The rest are still open, and they stay open.";
  const last = nextI<0
    ? "<br><br>That is the last section built. The <b>800 level</b>, on FRS 102 and provisions, is not written yet: it is waiting on one answer from finance about whether the adjustment is about to be taken off the report altogether."
    : "";
  $("panel").innerHTML='<h1>You have reached the end of '+sec.name+'.</h1>'
    +'<div class="body">'+line
    +'<br><br>Nothing is locked and nothing expires. Any step in here re-opens as a reminder rather than a test, and you can come back to any of it in any order.'
    +last+'</div>';
  foot(ghost("Back into the section","reopenSection()")
    +'<span class="spacer"></span>'
    +(nextI<0 ? primary("All sections","goMap()")
              : primary("Next: "+SECTIONS[nextI].name,"openSection("+nextI+")")));
  window.scrollTo(0,0);
}
function reopenSection(){ view="sec"; S=SECTIONS[SEC].steps.length-1; render(); }

function prevStep(){ if(S>0){ S--; render(); } else goMap(); }
function nextStep(){
  /* "seen" means got to the end of, not glanced at. It used to be stamped on
     paint, so a two-second look before a meeting counted as finished and the
     step was skipped for ever after. */
  rec(cur().id,{v:1});
  bumpHW();
  S++;
  if(S>=SECTIONS[SEC].steps.length){ view="end"; render(); return; }
  render();
}

/* ═══════════════════════════════════════════════════════════════════
   PART 7 — THE SELF TEST
   This runs before the app will start. A phone has no console, so a
   stray backtick used to be a white screen. Now it is a red banner
   naming the defect. The number audit is the important one: it expands
   every sentence in the app and refuses to start if any money or
   percentage figure in the prose is not a value derive() produced from
   that step's own state. That is the mechanical guarantee that no
   figure is ever typed twice.
   ═══════════════════════════════════════════════════════════════════ */
const SCAN_MONEY=/−?\$\d{1,3}(?:,\d{3})*(?:\.\d+)?/g, SCAN_PCT=/\d+(?:\.\d+)?%/g;
const TOKENS=/\{([A-Za-z][A-Za-z0-9.]*)\}/g;   // must match expand()'s exactly
/* The allow-set is scoped to the TOKENS THIS SENTENCE ACTUALLY USES, not to
   every value on the board. The board-wide version passed a figure that was
   wrong for its sentence but happened to equal some other field on the same
   step — which is precisely how a plausible wrong number survives review. */
function allowedFigures(step, raw){
  const out=new Set();
  const hasState=!!step.state;
  const a=hasState?derive(step.state):null, b=hasState?derive(step.after||step.state):null;
  if(raw===undefined){                       // whole-step set, kept for tooling
    if(hasState) CELLS.forEach(c=>[a[c.id],b[c.id],Math.abs(b[c.id]-a[c.id])].forEach(v=>out.add(fmtVal(c,v))));
    (step.rows||[]).forEach(rs=>{ const d=derive(rs);
      CELLS.forEach(c=>out.add(fmtVal(c,d[c.id]))); });
    return out;
  }
  let m; TOKENS.lastIndex=0;
  while((m=TOKENS.exec(String(raw)))!==null){
    const tok=m[1];
    if(tok==="FRAC" || tok==="FRAC.after"){
      if(!hasState) continue;
      const s2 = tok==="FRAC" ? a : b;
      out.add(money(s2.jtd)); out.add(money(s2.eac)); out.add(pctS(s2.pct));
      continue;
    }
    const c2=/^c(\d+)\.(rate|cost)$/.exec(tok);
    if(c2){
      const p=((step.state||{}).crew||[])[parseInt(c2[1],10)-1];
      if(p) out.add(money(c2[2]==="rate" ? p.rate : p.hrs*p.rate));
      continue;
    }
    const r=/^r(\d+)\.([a-z]+)$/.exec(tok);
    if(r){
      const rs=(step.rows||[])[parseInt(r[1],10)-1];
      if(rs && CMAP[r[2]]) out.add(fmtVal(CMAP[r[2]], derive(rs)[r[2]]));
      continue;
    }
    if(!hasState) continue;
    const t=/^(after\.|d\.)?([a-z]+)$/.exec(tok);
    if(!t || !CMAP[t[2]]) continue;
    const c=CMAP[t[2]], f=t[2];
    out.add(fmtVal(c, t[1]==="after." ? b[f] : t[1]==="d." ? Math.abs(b[f]-a[f]) : a[f]));
  }
  return out;
}
function stringsOf(step){
  const out=[];
  ["title","body","setup","button","q","hint","why","prompt"].forEach(k=>{ if(step[k]) out.push([k,step[k]]); });
  (step.opts||[]).forEach((o,i)=>out.push(["opts["+i+"]",o]));
  (step.model||[]).forEach((o,i)=>out.push(["model["+i+"]",o]));
  (step.stages||[]).forEach((s,i)=>out.push(["stages["+i+"].text",s.text]));
  return out;
}
/* A state may carry a JTD COST total OR a TIME COST / SUBS & EXP split, never
   both. A state with jtd:60000, time:40000, subs:15000 would draw 60000 on the
   teaching board and 55000 on the real board while every sentence claimed one
   figure — the exact class of quietly-wrong number this whole app exists to
   stop Josh repeating in front of his boss. */
function stateConflict(s){
  if(!s) return false;
  if(s.jtd!==undefined && (s.time!==undefined || s.subs!==undefined || s.crew!==undefined)) return true;
  /* a crew AND a flat time would give two different answers for TIME COST */
  if(s.crew!==undefined && s.time!==undefined) return true;
  return false;
}
function selfTest(){
  const err=[], ids=new Set(), sids=new Set();
  const KINDS=["concept","worked","choice","select","compute","explain","rowpick"];
  SECTIONS.forEach((sec,i)=>{
    if(sids.has(sec.id)) err.push("duplicate section id: "+sec.id); sids.add(sec.id);
    if(!LAYOUTS[sec.layout]) err.push(sec.id+": unknown layout "+sec.layout);
    const vis=LAYOUTS[sec.layout]?visibleIds(sec.layout):[];
    /* the warm-up items NOT drawn this session are validated too. Half the
       warm-up content would otherwise ship without ever being checked. */
    sec.steps.concat(sec.pool||[]).forEach(step=>{
      const at=sec.id+" / "+step.id;
      if(!step.id) err.push(at+": step has no id");
      if(ids.has(step.id)) err.push("duplicate step id: "+step.id); ids.add(step.id);
      if(KINDS.indexOf(step.kind)<0) err.push(at+": unknown kind "+step.kind);
      (step.src||[]).forEach(k=>{ if(!SRC[k]) err.push(at+": unknown source key "+k); });
      [["state",step.state],["after",step.after]].forEach(([w,s])=>{
        if(stateConflict(s)) err.push(at+": its "+w+" carries BOTH a jtd total and a time/subs split. "
          + "They can disagree, and one of them would be drawn while the other was described.");
      });
      (step.rows||[]).forEach((s,k)=>{ if(stateConflict(s))
        err.push(at+" row "+(k+1)+": carries BOTH a jtd total and a time/subs split."); });
      if(step.kind==="rowpick"){
        if(!Array.isArray(step.rows) || step.rows.length<2) err.push(at+": rowpick needs at least two rows");
        else{
          step.rows.forEach((s,k)=>{ if(s.time===undefined || s.subs===undefined)
            err.push(at+" row "+(k+1)+": a real-page row must carry time and subs, "
              + "because JTD COST is not a column on that page"); });
          if(!Array.isArray(step.ids) || !step.ids.length) err.push(at+": rowpick needs ids (1-based row numbers)");
          else step.ids.forEach(n=>{ if(!(n>=1 && n<=step.rows.length))
            err.push(at+": row number "+n+" is not one of this step's "+step.rows.length+" rows"); });
          const nm=step.rows.map(s=>s.name);
          if(new Set(nm).size!==nm.length) err.push(at+": two rows share a project name, so a selection is ambiguous");
        }
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind!=="rowpick" && step.rows) err.push(at+": rows are only read by a rowpick step");
      if(step.kind==="choice"){
        if(!Array.isArray(step.opts)||step.opts.length<2) err.push(at+": needs at least two options");
        else if(!(step.a>=0 && step.a<step.opts.length)) err.push(at+": answer index out of range");
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="select"){
        if(!step.state) err.push(at+": select needs a state");
        if(step.mode==="identify"){
          if(!Array.isArray(step.ids)||!step.ids.length) err.push(at+": identify needs ids");
          else step.ids.forEach(id=>{ if(vis.indexOf(id)<0) err.push(at+": id "+id+" is not on this section's board"); });
        }
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="compute"){
        if(!step.state||!CMAP[step.field]) err.push(at+": compute needs a state and a real field");
        else if(!isFinite(computeAnswer(step))) err.push(at+": derived answer is not a finite number");
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="worked"){
        if(!Array.isArray(step.stages)||!step.stages.length) err.push(at+": worked needs stages");
        (step.stages||[]).forEach((s,k)=>(s.cells||[]).forEach(id=>{
          if(vis.indexOf(id)<0) err.push(at+" stage "+(k+1)+": cell "+id+" is not on this section's board");
        }));
      }
      if(step.kind==="explain" && (!Array.isArray(step.model)||!step.model.length))
        err.push(at+": explain needs a model answer");
      /* a compute step must TALK ABOUT the field it GRADES. Repointing the
         field silently produced a build that asked for EAC, graded against
         JTD, and marked the correct answer wrong — with a clean self-test. */
      if(step.kind==="compute" && CMAP[step.field]){
        /* The EXPLANATION must assert the graded field. Checking the question
           was too weak: a question legitimately names its operands, so a step
           asking for EAC and grading JTD still passed because {jtd} appears in
           the stem. The `why` is where the answer is asserted, so that is
           where the graded field has to appear. */
        const f=step.field, refs=new RegExp("\\{(?:after\\.)?"+f+"\\}");
        if(!refs.test(String(step.why||"")))
          err.push(at+": grades the field "+f+" but its explanation never states {"+f+"}. "
            + "The graded field and the described field have diverged.");
      }
      stringsOf(step).forEach(([k,raw])=>{
        let out;
        try{ out=expand(raw,step); }
        catch(e){ err.push(at+" ."+k+": "+e.message); return; }
        /* NOTHING WITH BRACES MAY REACH THE SCREEN.
           expand() throws on a token it cannot RESOLVE, which says nothing
           about a token it never MATCHED. Six screens shipped literal code
           under a fully green suite because of one missing digit in a
           character class. This is the assertion that catches that whole
           class of failure, and it is deliberately dumb: if a brace survives
           expansion, for any reason, the app does not start. */
        const leftover=out.match(/\{[^}]*\}/g);
        if(leftover) err.push(at+" ."+k+": "+leftover.length+" token(s) never expanded and would "
          + "render as literal code on screen: "+[...new Set(leftover)].join(" "));
        const allow=allowedFigures(step, raw);
        (out.match(SCAN_MONEY)||[]).forEach(f=>{ if(!allow.has(f))
          err.push(at+" ."+k+": the figure "+f+" is typed in, not derived. Use a token."); });
        (out.match(SCAN_PCT)||[]).forEach(f=>{ if(!allow.has(f))
          err.push(at+" ."+k+": the percentage "+f+" is typed in, not derived. Use a token."); });
      });
    });
  });
  return err;
}
function fail(title, lines){
  const e=$("err"); if(!e) return;
  e.style.display="block";
  e.innerHTML='<b>'+title+'</b>'+(lines.length?'<ul>'+lines.map(l=>'<li>'+l+'</li>').join("")+'</ul>':"");
}

/* ---------- boot ---------- */
function boot(){
  window.onerror=function(m,src,line){ fail("Something broke and the app stopped.",[m+" (line "+line+")"]); };
  $("defClose").onclick=hideDef;
  $("defWrap").addEventListener("click",e=>{ if(e.target===$("defWrap")) hideDef(); });
  document.addEventListener("keydown",e=>{
    if(!defOpen()) return;
    if(e.key==="Escape"){ hideDef(); return; }
    /* the dialog had no containment: Shift+Tab landed on buttons hidden
       underneath the overlay, which a keyboard user could then activate. */
    if(e.key==="Tab"){ e.preventDefault(); $("defClose").focus(); }
  });
  const errs=selfTest();
  if(errs.length){ fail("This build did not pass its own check, so it has not started. "+errs.length+" problem(s):", errs); return; }
  render();
}
if(typeof window!=="undefined" && typeof document!=="undefined" && document.getElementById) boot();
else if(typeof globalThis!=="undefined") globalThis.__MP={SECTIONS,CELLS,CMAP,LAYOUTS,SRC,derive,money,pctS,
  fmtVal,visibleIds,moversFor,answerIds,computeAnswer,expand,selfTest,parseNum,BUILD,allowedFigures,stringsOf,
  optOrder,stateConflict,isScored,REALROWS,secStat};
</script>
</body>
