 {id:"billing.intro", kind:"concept",
  title:"Two new boxes, and they run on a different clock.",
  body:"Everything so far used seven boxes. From here it has nine.<br><br><b>INV</b> is short for <b>invoiced</b>: what has actually been billed to the client. It moves on its own schedule, the invoice schedule set up on the project. People also say <b>billed</b> for this.<br><br><b>WIP</b> is short for <b>work in progress</b>: claimed revenue minus invoiced. Money the firm says it has earned but has not yet asked for.<br><br>What the firm <b>earns</b> comes out of the cost calculation. What it <b>bills</b> comes off the invoice schedule. The two calculations do not touch.<br><br>They are watched together, though: the firm's own guidance is that a growing WIP is the prompt to raise an invoice."},

 {id:"billing.worked", kind:"worked", state:FOXGLOVE, after:FOX_INV42, stillLabel:"NO CHANGE",
  title:"Send an invoice. Watch what does not move.",
  setup:"Back to {job}: {rev} claimed as earned, {inv} billed so far, so {wip} sitting in WIP.<br><br>The billing team now raises another {d.inv} of invoice.",
  button:"Send it",
  stages:[
   {cells:["inv"], text:"<b>INV</b> goes {inv} to <b>{after.inv}</b>. That is the invoice going out to the client."},
   {cells:["wip"], text:"<b>WIP</b> falls {wip} to <b>{after.wip}</b>. It is only ever claimed revenue minus invoiced, so billing more closes the gap."},
   {cells:["pct","rev","profit"], text:"<b>And nothing else moved at all.</b> Not the percentage, not what the firm claims, not the profit.<br><br>Invoicing does not earn anything. The claiming already happened when the money was spent. The invoice is only asking to be paid for it."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>{d.inv} of invoice went out, so billed went {inv} to {after.inv} and the gap between claimed and billed closed from {wip} to {after.wip}. Claimed revenue is {after.rev}, exactly what it was before, because it is calculated off cost and the cost did not move.<br><br>Two numbers, two schedules. They are watched together, but they are not connected."}
  ], src:["names"]},

 {id:"billing.early", kind:"choice", state:FOXGLOVE,
  q:"You persuade the client to let you invoice a big chunk of {job} early.<br><br>What happens to CLAIMED REVENUE?",
  opts:["Nothing. Invoicing does not change what the firm says it earned",
        "It rises, because billing is how revenue gets recognised",
        "It falls, because WIP falls",
        "It rises next month, once the client pays"],
  a:0,
  why:"<b>Nothing.</b> Earning follows money spent. Billing follows the project's invoice schedule.<br><br>Invoicing early is still worth doing, because it is cash in the door sooner. It is just not revenue.",
  src:["names"]},

 {id:"billing.movers", kind:"select", state:FOXGLOVE, after:FOX_INV38,
  q:"{job} invoices another <b>{d.inv}</b>.<br><br><b>Tap every field that reads differently afterwards.</b>",
  why:"<b>{lmovers}. Nothing else.</b><br><br>INV goes {inv} to {after.inv}. WIP, being claimed revenue minus invoiced, falls {wip} to {after.wip}.<br><br>Everything on the earning side is untouched, because none of it knows or cares that an invoice went out."},

 {id:"billing.sandpiper", kind:"choice", state:SANDPIPER,
  q:"On <b>{job}</b>, WIP reads {wip}, which is exactly the same as CLAIMED REVENUE. Why?",
  opts:["Because nothing has been invoiced on it yet, so the whole claim is still sitting unbilled",
        "Because WIP is always equal to claimed revenue until a job closes out",
        "Because the client has been invoiced and has not yet paid that invoice",
        "Because the claim and the billing schedule happen to have lined up this month"],
  a:0,
  why:"<b>Because INV reads {inv}.</b> WIP is what is claimed minus what is billed, so with nothing billed at all, the whole {rev} sits claimed and unbilled.<br><br>That gap is not a mistake, it is information. On a job this early it is expected, because the invoice schedule has not started yet.<br><br>Worth knowing before you say “normal” in front of finance: their own shorthand is <b>“Neg WIP: good. Pos WIP: bad”</b>, and a positive WIP is what tells them an invoice should be raised. They are not describing an error either; they are describing which direction they would rather be facing.<br><br>The third answer is the one to keep separate in your head. Billed-and-not-paid is a real thing and it has its own column on the real report, <b>UNPAID INV</b>. It is not this.",
  src:["names"]},

 {id:"billing.meaning", kind:"choice", state:FOXGLOVE,
  q:"A job's WIP has been large and growing for three months. What does that tell you, <b>on its own</b>?",
  opts:["That the claim has been running ahead of the billing for three months, and nothing beyond that",
        "That the job is losing money, because the cash has not come in against it",
        "That the client has been billed and is refusing to pay the invoices",
        "That the forecast of remaining cost has been set too low"],
  a:0,
  why:"<b>Only that the claim has run ahead of the billing.</b> That is the whole of what the column says.<br><br>It could be a billing lag, which is a cash problem worth chasing. It could be that the claim is running ahead of what you could actually defend to a client, which is a forecast problem. <b>WIP on its own does not tell you which</b>, and treating it as though it does is how people spend a fortnight chasing the wrong one.<br><br>A client who has been billed and is simply not paying is a third thing again, and it shows up under <b>UNPAID INV</b>, its own column on the real report.<br><br>Next screen: what you would actually look at to tell them apart.",
  src:["wip"]},

 {id:"billing.tell", kind:"choice", state:FOXGLOVE,
  q:"So WIP is wide and growing.<br><br><b>What would you look at to tell a billing lag from a claim running too far ahead?</b>",
  opts:["The invoice schedule, against what has been claimed. If an invoice was due and did not go out, it is a billing lag",
        "JTD PROFIT. If it is still positive, the job is fine and the WIP will close itself",
        "UNPAID INV. A large figure there means the claim has gone too high",
        "EAC COST. If it has risen, the claim must have been too high all along"],
  a:0,
  why:"<b>The invoice schedule.</b> Billing runs off it, so comparing what it said should have gone out against what actually did separates the two cases in about a minute.<br><br>If the schedule was followed and WIP is still wide, then billing is not the problem, and what you are looking at is a claim the job may not be able to defend. At that point you are back in the forecast, not the invoices.<br><br>The firm watches the two together for exactly this reason. Its own wording is that a positive and growing WIP <i>“indicates an invoice should be raised”</i>, which is a prompt to go and look, not a verdict.<br><br>UNPAID INV is a different question again: money billed and not collected. Neither of these.",
  src:["wip"]},

 {id:"billing.recap", kind:"concept", state:FOXGLOVE,
  title:"Two clocks, and the gap between them.",
  body:"<b>What the firm claims</b> comes out of the cost calculation: money spent over money expected, times the fee. Nothing about a client is in it.<br><br><b>What the firm bills</b> comes off the invoice schedule set up on the project. Nothing about cost is in it.<br><br><b>WIP is the distance between the two.</b> Claimed minus billed. It is not a verdict on anything; it is a prompt to go and look, and the first place to look is the invoice schedule.<br><br>Two clocks, one gap, watched together. That is the level.",
  src:["wip"]}
]},

/* ═════════ 600 LEVEL ═════════
   NEW in v5, and the level that does the job the app exists for.
   Every question in v4 sat inside a section whose title named the lever, so
   the block supplied the cue and the DISCRIMINATION was never trained once.
   Four events look nearly identical on a month-end sheet and behave
   completely differently: time booked with the forecast dropping, time booked
   with the forecast not dropping, a forecast revision with no spend at all,
   and an invoice. His boss will not label the lever. */
{id:"mixed", level:600, layout:"full",
 name:"Mixed, Unlabelled",
 line:"Four events that look alike, and how to tell them apart",
 warmN:2,
 warm:[
 {id:"mixed.warm.recompose", kind:"compute", state:MARLOW, field:"pct",
  q:"Warm-up. <b>{job}</b> has spent <b>{jtd}</b> against an expected total of <b>{eac}</b>.<br><br>What is LIVE CALCULATED % COMP?",
  hint:"spent over expected in total. Type the division itself if that is easier.",
  why:"<b>{pct}.</b> Not a tidy number, and neither is anything on a real page."},

 {id:"mixed.warm.wip", kind:"choice", state:SANDPIPER,
  q:"Warm-up. On <b>{job}</b>, WIP reads {wip} and INV reads {inv}.<br><br>What does that combination mean?",
  opts:["Everything claimed so far is still unbilled",
        "The client has been billed and has not paid",
        "The job has not started",
        "The claim has been written off"],
  a:0,
  why:"<b>Nothing has been billed yet.</b> WIP is claimed minus billed, so with INV at {inv} the whole {rev} claim is sitting unbilled."},

 {id:"mixed.warm.invoice", kind:"select", state:KESTREL, after:KES_INV,
  q:"Warm-up. <b>{d.inv}</b> of invoice goes out on <b>{job}</b>. Nothing else happens.<br><br><b>Tap every field that reads differently afterwards.</b>",
  why:"<b>{lmovers}. Nothing else.</b><br><br>Invoicing does not claim anything. The claiming already happened when the money was spent."},

 {id:"mixed.warm.margin", kind:"choice", state:MARLOW,
  q:"Warm-up. <b>{job}</b> has a fee of <b>{fee}</b> and expects to cost <b>{eac}</b>.<br><br>If somebody now books planned work to it, which way does JTD PROFIT go?",
  opts:["Down. Expected cost is above the fee, so every dollar spent claims back less than a dollar",
        "Up. Planned work always earns money",
        "It does not move, because planned work is neutral",
        "It depends on whether the client has been invoiced"],
  a:0,
  why:"<b>Down.</b> Expected cost of {eac} is above the {fee} fee, so the margin is negative and working to plan makes the reported loss bigger.",
  src:["formula"]}
 ],
 steps:[

 {id:"mixed.intro", kind:"concept",
  title:"Nothing here tells you which lever moved.",
  body:"Every question so far has sat under a heading that named the thing being tested. Spending. The forecast. Billing. <b>The heading was doing half the work.</b><br><br>A month-end sheet has no headings. Four events look nearly identical on it and behave completely differently:<br><br>time booked with the forecast coming off;<br>time booked with the forecast <i>not</i> coming off;<br>a forecast revision with no spending at all;<br>and an invoice.<br><br>From here the questions describe what happened in a month and leave you to work out which of those it was. <b>That identification is the part that breaks in front of somebody else</b>, and it is the only part nothing in this app has practised.<br><br>The board is back to nine boxes, because invoices are in play again."},

 {id:"mixed.a", kind:"choice", state:FOXGLOVE, after:FOX_REWORK10, fixed:true,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed on it, and EAC COST went from {eac} to {after.eac}.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to about {after.profit}.</b><br><br>Work out which event this was before doing any arithmetic. Time landed, so real money went out. But EAC COST <i>rose</i>, by the same {d.jtd}, which means nothing came off the forecast. This was work that was not on the plan.<br><br>So both halves of the fraction grew, the percentage barely moved ({pct} to {after.pct}), the claim rose only about {d.rev}, and cost rose {d.jtd}.<br><br><b>The tell was EAC COST.</b> Time landing with EAC COST holding still is planned work. Time landing with EAC COST rising by the same amount is unplanned work. That one comparison separates the two events that look most alike.",
  src:["formula"]},

 {id:"mixed.b", kind:"select", state:KESTREL, after:KES_INV,
  q:"A month on <b>{job}</b>. The only thing that happened was that <b>{d.inv}</b> went out to the client.<br><br><b>Tap every field that reads differently at the end of the month.</b>",
  why:"<b>{lmovers}. Nothing else.</b><br><br>An invoice moves INV, and WIP moves because it is claimed minus billed. That is the entire footprint.<br><br>What the firm claims is untouched at {rev}, because it is calculated off cost and no cost moved. Profit is untouched at {profit}.<br><br><b>The tell for an invoice:</b> it is the only event on this page that moves anything at all without touching the cost side. If the claim did not move, no cost moved, and there is very little else it can have been.",
  src:["names"]},

 {id:"mixed.c", kind:"choice", state:FOXGLOVE, after:FOX_ETC90,
  q:"A month on <b>{job}</b>. Nobody booked an hour to it. No invoice went out. Nothing was delivered.<br><br>At the end of the month CLAIMED REVENUE reads <b>{after.rev}</b>, down from {rev}.<br><br>What happened?",
  opts:["Somebody raised the forecast of what is still left to spend",
        "The client cancelled part of the scope, so the fee came down",
        "An invoice was cancelled and had to be reversed",
        "Cost was moved off this job onto another one"],
  a:0,
  why:"<b>The forecast went up.</b> ETC COST went {etc} to {after.etc}, so EAC COST went {eac} to {after.eac}, the percentage fell {pct} to {after.pct}, and the claim fell {d.rev}.<br><br>Rule the other three out by hand, because that is the actual skill. If the fee had come down, FEE would read differently, and it reads {fee} in both months. An invoice moves INV and WIP and nothing else. Cost moving off the job would have moved JTD COST, and JTD COST is unchanged at {jtd}.<br><br><b>The tell:</b> the claim moved and JTD COST did not. Only one thing does that.",
  src:["formula"]},

 {id:"mixed.d", kind:"choice", state:KESTREL, after:KES_PLAN, fixed:true,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed, and EAC COST finished the month at {after.eac}, exactly where it started.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:0,
  why:"<b>Up, {profit} to {after.profit}.</b><br><br>EAC COST held still, so the forecast came off by the same {d.etc} the cost went on. That is planned work.<br><br>Only the top of the fraction grew, {pct} to {after.pct}. The claim rose {d.rev} while cost rose {d.jtd}, so profit rose {d.profit}.<br><br>Notice the <i>rate</i>: the claim rose by more than the cost did. That is because this job expects to cost {after.eac} against a fee of {fee}, which leaves a healthy margin. Hold that thought for two screens.",
  src:["formula"]},

 {id:"mixed.e", kind:"select", state:FOXGLOVE, after:FOX_PLAN10,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of planned time landed. Nobody invoiced anything.<br><br><b>Tap every field that reads differently at the end of the month.</b>",
  why:"<b>{nmovers} fields move: {lmovers}.</b><br><br>Two of them are worth stopping on.<br><br><b>EAC COST does not move</b>, and that is the signature of planned work: the {d.jtd} crossed from one side of the total to the other rather than being added to it.<br><br><b>WIP moves, and nobody invoiced anything.</b> WIP is claimed minus billed, and the claim just rose, so the gap widened with the billing side untouched. <b>An invoice is not the only thing that moves WIP</b>, which is exactly why WIP on its own never tells you what happened.",
  src:["wip"]},

 {id:"mixed.f", kind:"choice", state:MARLOW, after:MAR_PLAN, fixed:true,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed, and EAC COST finished at {after.eac}, exactly where it started. Same shape as two screens ago.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to {after.profit}.</b> Same event, opposite result, and the reason is not in the event at all.<br><br>The mechanism ran exactly as before. EAC COST held still, so this was planned work; the percentage rose {pct} to {after.pct} and the claim rose {d.rev}.<br><br>But cost rose {d.jtd}, which is more. <b>This job expects to cost {after.eac} against a fee of {fee}.</b> Expected cost is above the fee, so every dollar spent claims back less than a dollar.<br><br><b>The check you cannot get from the event itself:</b> before saying which way profit went, look at EAC COST against FEE. On a healthy job, planned spending earns. On a job expecting to overspend, the same planned spending loses, every week, until the fee or the forecast changes.",
  src:["formula"]},

 {id:"mixed.g", kind:"choice", state:FOXGLOVE,
  q:"Two jobs, same month. On both of them JTD PROFIT fell.<br><br>On the first, JTD COST rose. On the second, JTD COST did not move at all.<br><br>What is the difference between them?",
  opts:["On the first, real money went out. On the second nothing physical happened, and somebody changed a forecast",
        "The second is worse, because a fall with no spending means the client is disputing the work",
        "The first is worse, because that money is gone and cannot be recovered",
        "There is no difference worth acting on. Both are a fall in profit"],
  a:0,
  why:"<b>Money moved on one. An opinion moved on the other.</b><br><br>JTD COST is the only field on this page that nobody can revise. If it moved, real cost landed. If it did not, whatever changed came out of the forecast, and the question becomes why the forecast changed and whether the new one is right.<br><br>They are not ranked, and the second is <b>not</b> the smaller problem. A forecast that has moved that far is telling you something about the work; it just has not cost anything yet.<br><br><b>Keep this as your first move on any sheet.</b> Profit moved: did JTD COST move? That one question splits every event on this page into two halves before you have done any arithmetic at all.",
  src:["formula"]},

 {id:"mixed.h", kind:"choice", state:FOXGLOVE, after:FOX_INV38,
  q:"A month on <b>{job}</b>. CLAIMED REVENUE finished at <b>{after.rev}</b>, exactly where it started. WIP went from {wip} to <b>{after.wip}</b>.<br><br>What happened?",
  opts:["An invoice went out",
        "The forecast was cut, so the claim caught up with the billing",
        "Cost was moved off this job onto another one",
        "The client paid an outstanding invoice"],
  a:0,
  why:"<b>An invoice went out.</b> INV went {inv} to {after.inv}, and WIP, being claimed minus billed, closed by the same {d.inv}.<br><br>Rule the others out by hand. Cutting the forecast would have moved CLAIMED REVENUE, and it did not move. Cost coming off the job would have moved JTD COST and dragged the claim with it. And a client <i>paying</i> an invoice moves neither of these: payment lives in the UNPAID INV column, which is not on this board at all.<br><br><b>The tell:</b> the claim held still and WIP moved. Only billing does that.",
  src:["names"]},

 {id:"mixed.explain", kind:"explain", state:FOXGLOVE, after:FOX_REWORK10,
  prompt:"Ron puts a month-end sheet in front of you and says <i>“three of these moved and I do not understand why.”</i><br><br><b>In your own words: what do you check, and in what order?</b>",
  model:["First: did JTD COST move? It is the only field nobody can revise, so if it moved, real money went out, and if it did not, an opinion changed.",
         "If JTD COST moved, the next question is what EAC COST did. If EAC COST held still, the work was on the plan and the forecast came off by the same amount. If EAC COST rose by the same amount the cost did, the work was not on the plan.",
         "If JTD COST did not move but the claim did, somebody changed the forecast, and the only question that matters then is whether the new forecast is right.",
         "If the claim did not move but WIP did, it was billing. An invoice moves INV and WIP and touches nothing else.",
         "Then, before saying whether any of it was good or bad: EAC COST against FEE. On a job expecting to cost less than its fee, spending on plan earns money. On a job expecting to overspend, the same spending loses it.",
         "And I would say which of those I think it is, rather than reading him the list, because that is what he is actually asking for."]}
]},

/* ═════════ 700 LEVEL ═════════
   NEW in v5, and the reason the whole spec called it the transfer level.
   Everything before this point runs in CALCULATION order with each formula
   printed under its field and a "?" on every one. The artifact he actually
   opens does none of that: it prints the RESULT first and its EVIDENCE last,
   it annotates nothing, and JTD COST is not a column on it — it is
   TIME COST + SUBS & EXP, which the app stated twice and never once asked him
   to do. bare:true on the section strips the subtitles, the "?" and the
   dashed edge. showall on each step, because the real page hides nothing.

   EVERY ROW HERE IS INVENTED. The repo is public. No Buro Happold project and
   no figure off any real report reaches this file, ever. */
{id:"real", level:700, layout:"real", bare:true,
 name:"The Real Page",
 line:"Report order, nothing annotated, and one column missing",
 steps:[

 {id:"real.intro", kind:"concept",
  title:"The page in its own order, with nothing explained.",
  body:"Everything so far has been one job opened out, in the order the numbers are calculated, with each formula printed under its name and a <b>?</b> on every field.<br><br><b>None of that scaffolding exists on the real report.</b><br><br>From here the board switches to the real column order, the formulas come off, and the <b>?</b> goes away.<br><br>Two columns you have not seen appear. <b>TIME COST</b> is the cost of the hours booked to the job: everybody's hours, priced at their internal rate. <b>SUBS &amp; EXP</b> is everything spent that is not somebody's hours, so sub-consultant invoices, travel, printing, equipment. Added together, those two are the job's cost to date.<br><br>Which brings up the one you have leaned on all the way through. <b>JTD COST is printed on the real report</b>, at column 15, sitting directly between SUBS &amp; EXP and ETC COST. It is <b>covered up on this board, once</b>, so you can prove to yourself that you can rebuild it out of the two columns it is made of.<br><br>None of this is a trick. It is the same arithmetic, laid out the way the thing on your screen at seven in the morning lays it out.<br><br>Every job and every figure from here on is invented.",
  src:["report"]},

 /* THE item. If only one thing in this level survives, it is this one: it is
    the only screen in the app shaped like the artifact. */
 {id:"real.find", kind:"rowpick", rows:REALROWS, ids:[2,4],
  q:"Five jobs, real column order, nothing annotated. It scrolls sideways.<br><br><b>Tap the one claiming a lot it has not billed. Then tap the one that is going to lose money.</b>",
  why:"<b>{r2.name} and {r4.name}.</b><br><br><b>{r2.name}</b> has claimed {r2.rev} and billed only {r2.inv}, so WIP is {r2.wip}. That is money the firm says it has earned and has not yet asked for. It is the widest gap on the page by a distance. It is a <i>cash</i> question, not a profit one: that job is making {r2.profit}.<br><br><b>{r4.name}</b> is the one losing money. Its fee is {r4.fee} and it now expects to cost {r4.eac}. The expected cost is above the fee, so JTD PROFIT is {r4.profit}.<br><br>Two completely different problems, and neither one shows in the other's column. {r4.name}'s WIP is {r4.wip}, almost nothing, which on a fast scan looks like the healthiest row on the page.",
  src:["report"]},

 {id:"real.recompose", kind:"compute", state:R_CEDARWAY, field:"jtd", showall:true,
