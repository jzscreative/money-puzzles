 warm:[
 {id:"spend.warm.opinion", kind:"choice", state:KESTREL,
  q:"Warm-up, on a job you have not used for this before. On <b>{job}</b>, which of these three is somebody's <b>opinion</b> rather than a contract or a record?",
  opts:["ETC COST, the forecast of what is still left to spend",
        "FEE, because fees get renegotiated",
        "JTD COST, because people fill in timesheets from memory",
        "None of them. They all come out of the system"],
  a:0,
  why:"<b>ETC COST.</b> The fee is a contract, money spent is a record of what happened, and the forecast of what is left is a judgement about a future that has not happened.<br><br>On {job} that judgement currently reads {etc}."},

 {id:"spend.warm.eac", kind:"compute", state:MARLOW, field:"eac",
  q:"Warm-up. <b>{job}</b> has spent <b>{jtd}</b> and forecasts <b>{etc}</b> still to spend.<br><br>What is EAC COST?",
  hint:"the two cost numbers, added together",
  why:"<b>{eac}.</b> Spent plus still to spend.<br><br>Worth noticing on this one: the fee is {fee}, and {eac} is more than that. This job expects to overspend its fee."},

 {id:"spend.warm.calc", kind:"select", mode:"identify", state:KESTREL,
  ids:["eac","pct","rev","profit"],
  q:"Warm-up. <b>Tap every field the board worked out for itself</b>, rather than receiving from somewhere outside.",
  why:"<b>EAC COST, LIVE CALCULATED % COMP, CLAIMED REVENUE and JTD PROFIT.</b> All four are drawn with a dashed edge, which is the board saying so.<br><br>The three solid ones arrived: the fee off a contract, money spent out of timesheets and invoices, the forecast out of somebody's head."},

 {id:"spend.warm.rev", kind:"compute", state:KESTREL, field:"rev",
  q:"Warm-up. <b>{job}</b> has a fee of <b>{fee}</b> and LIVE CALCULATED % COMP reads <b>{pct}</b>.<br><br>What is CLAIMED REVENUE?",
  hint:"that percentage, applied to the fee",
  why:"<b>{rev}.</b> The percentage, times the fee. Nothing looked at a drawing."}
 ],
 steps:[

 {id:"spend.intro", kind:"concept",
  title:"Revenue answers to money spent. Nothing else.",
  body:"This is the idea everything else hangs off, and it is the one that feels wrong the first time you meet it.<br><br><b>Finishing something moves nothing on this page. Spending does.</b>"},

 /* P7-2 · zeroMove:true marks this as a DELIBERATE zero-mover, not an
    authoring accident. A select step's after equal to its state is exactly
    the shape of the P7-2 defect (the app and the independent reference both
    conclude "nothing moved", for the same wrong structural reason) UNLESS
    the whole point of the item is that nothing moves — which is this item's
    entire teaching point. verify_v5.js's new structural check (§4c) treats
    every non-identify select step's after===state as a failure unless
    zeroMove is explicitly set, so this flag is what keeps that guard from
    flagging its own intended exception. */
 {id:"spend.nothing", kind:"select", state:FOXGLOVE, after:FOXGLOVE, zeroMove:true,
  q:"Back on <b>{job}</b>. Today you issue the complete drawing set: a major milestone, delivered, out of the door.<br><br><b>Tap every field that moves.</b>",
  why:"<b>Nothing moved. Not one field.</b><br><br>Issuing the drawings changed no cost, so it changed no reported revenue. There is nowhere on this board to record that it happened at all.<br><br>This is why a job can feel finished and still report as though it is not.",
  src:["formula"]},

 {id:"spend.worked", kind:"worked", state:FOXGLOVE, after:FOX_PLAN6,
  title:"Book time that was planned, and follow it through.",
  setup:"Somebody puts <b>{d.jtd}</b> of hours on {job} in their timesheet this week.<br><br>It was planned work, so the forecast of what is left drops by the same amount. Nothing was delivered. No drawing was issued. Only money moved.",
  button:"Follow it through",
  stages:[
   {cells:["jtd"], text:"<b>JTD COST</b> rises by {d.jtd}, to <b>{after.jtd}</b>. That is the timesheet hours landing."},
   {cells:["etc"], text:"<b>ETC COST</b> falls by {d.etc}, to <b>{after.etc}</b>. The work got done, so there is that much less of it left to do."},
   {cells:["eac"], text:"<b>EAC COST does not move.</b> Still {after.eac}.<br><br>The money simply crossed from one side to the other. The job is not expected to cost a penny more than it was."},
   {cells:["pct"], text:"The top of the fraction grew and the bottom did not, so the percentage rises.{FRAC.after}"},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is {after.pct} of the {fee} fee, so <b>{after.rev}</b>. Up {d.rev}."},
   {cells:["profit"], text:"What the firm claims rose {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT goes {profit} to {after.profit}</b>.<br><br>Money went out of the door and the job got more profitable."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>{d.jtd} of planned time landed, so spent went {jtd} to {after.jtd} and the forecast came off by the same {d.etc}. Expected in total held still at {after.eac}, so the percentage rose from {pct} to {after.pct}, the claim rose {d.rev}, and profit went {profit} to {after.profit}.<br><br>Nothing was delivered. No drawing went out. The only event was money."}
  ], src:["formula"]},

 {id:"spend.planned", kind:"choice", state:FOXGLOVE, after:FOX_PLAN10, fixed:true,
  q:"You book <b>{d.jtd}</b> of time on {job} this week. The work was planned, so ETC COST drops by the same {d.etc}.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:0,
  why:"<b>Up.</b> EAC COST stays at {after.eac}, because the {d.jtd} crossed from one side to the other. JTD COST is now {after.jtd}, so LIVE CALCULATED % COMP rises to {after.pct} and CLAIMED REVENUE to {after.rev}.<br><br>The claim rose {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT rose from {profit} to {after.profit}</b>.<br><br>Spending on plan earns money. There is one exception, three screens from here.",
  src:["formula","wholejob"]},

 /* DEMONSTRATE THE HARD CASE. v4 gave the counterintuitive case no worked
    example at all: it demonstrated the planned booking and then asked the
    rework booking cold, which is the section's entire payload. */
 {id:"spend.reworked", kind:"worked", state:FOXGLOVE, after:FOX_REWORK10, stillLabel:"DID NOT MOVE",
  title:"Now the same money, on work nobody planned.",
  setup:"Back to the start. Somebody books <b>{d.jtd}</b> of time to {job} again, the same figure as before.<br><br>This time it is rework. It was not in the plan, so the plan still holds everything it held before: there is still <b>{etc}</b> of work to come.<br><br>Watch the second box, because the whole difference is there.",
  button:"Follow it through",
  stages:[
   {cells:["jtd"], text:"<b>JTD COST</b> rises by {d.jtd}, to <b>{after.jtd}</b>.<br><br>Exactly as before. The money does not know why it was spent."},
   {cells:["etc"], text:"<b>ETC COST does not move.</b> Still {after.etc}.<br><br>This is the whole difference, and it is one box. The rework was not on the list of work still to come, so doing it took nothing off that list. Everything that was still to do is still to do."},
   {cells:["eac"], text:"<b>EAC COST rises</b>, {eac} to <b>{after.eac}</b>.<br><br>Last time the money crossed from one side to the other and this total held still. This time it was added to one side and nothing came off the other, so the job is now expected to cost more than it was."},
   {cells:["pct"], text:"Both halves of the fraction grew, so the percentage barely moves.{FRAC.after}<br><br>Compare that with the planned week, where only the top grew."},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is {after.pct} of the {fee} fee, so <b>{after.rev}</b>. Up about {d.rev}."},
   {cells:["profit"], text:"And here is the sting. The claim rose about {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT falls, {profit} to about {after.profit}</b>."},
   {cells:[], text:"<b>Both weeks side by side, which is the sentence to keep:</b><br><br>Identical {d.jtd} of money out of the door. In the planned week the forecast came off by the same amount, expected cost held still, and profit rose. In this week the forecast did not move, expected cost rose to {after.eac}, and profit fell to about {after.profit}.<br><br>Same work, same money, opposite result. <b>The forecast decided it.</b>"}
  ], src:["formula"]},

 {id:"spend.rework", kind:"choice", state:FOXGLOVE, after:FOX_REWORK10, fixed:true,
  q:"Same week, same <b>{d.jtd}</b> booked on {job}. Again it is rework nobody planned, so <b>ETC COST does not drop</b>: there is still {etc} of work left to do.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down.</b> EAC COST rises to {after.eac}, because the {d.jtd} was added and nothing came off the forecast. LIVE CALCULATED % COMP goes to {after.pct}, so CLAIMED REVENUE is {after.rev}.<br><br>The claim rose about {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT fell from {profit} to about {after.profit}</b>.<br><br><b>Identical cash out of the door. Opposite result.</b> The only difference was what happened to a forecast.",
  src:["formula","wholejob"]},

 {id:"spend.etcwhy", kind:"choice", state:FOXGLOVE,
  q:"Why does doing <b>planned</b> work push ETC COST down by the same amount it pushes JTD COST up?",
  opts:["Because ETC COST is a priced list, and a planned piece comes off it at its listed price",
        "Because the system holds EAC COST steady by design, no matter what gets booked to the job",
        "Because the Project Director manually adjusts the forecast every month to keep it matching",
        "Because the fee itself has not changed, so the two totals underneath it have to balance out"],
  a:0,
  why:"<b>Because ETC COST is a priced list.</b> Hours planned per person for the work still to come, priced at their internal rates, plus the expenses and sub-consultants still to come.<br><br>Do a planned piece of it and that piece leaves the list of work still to come, at the price it was on that list for, and joins the record of work already done. Same hours, priced the same way, crossing from one column to the other. That is the entire reason EAC COST held still.<br><br>The second answer is the one to reject hardest. <b>Nothing holds EAC COST steady by design.</b> It held still because the two halves happened to move by the same amount, and you have just watched what happens when they do not.",
  src:["etclist"]},

 /* P5-3 · a margin card, added before spend.losing. The item two screens from
    here turns entirely on margin, and margin did not exist anywhere in the
    app until that item's own "why" defined it after the fact — the first
    encounter with the word was inside the answer to a question that had
    already been asked and marked. This card exists so the question that
    follows is a fair test of a taught term, not an ambush. mixed.d and
    mixed.f, three levels on, inherit this same word already taught. */
 {id:"spend.margin", kind:"concept", state:MARLOW,
  title:"One word before the next screen: margin.",
  body:"<b>Margin</b> is the gap between a job's fee and what it expects to cost in total, EAC COST.<br><br>Fee above expected cost, and the gap is <b>positive</b>: the job earns something on every dollar it claims. Fee below expected cost, and the gap is <b>negative</b>: the job loses a little on every dollar it claims back, however well the work goes and however carefully the money is spent.<br><br>{job} is a negative-margin job. Its fee is {fee}. Its expected cost, EAC COST, is {eac}. {fee} against {eac} is a gap running the wrong way.<br><br>None of this is about drawings, or about anybody's competence. It is entirely fee against expected cost, and it is the reason the next two screens behave the way they do."},

 /* P5-4 · a worked example for the negative-margin job, added before
    spend.losing. This mechanism is the app's own headline claim and, until
    now, the only one of eight levels' worth of central claims with no worked
    example anywhere in the file — his first encounter with it was a cold
    four-option question. Same job, same booking, same numbers spend.losing
    asks about a moment later: JTD +{d.jtd}, ETC -{d.etc}, EAC unchanged,
    pct {pct}->{after.pct}, claim +{d.rev}, profit {profit}->{after.profit}. */
 {id:"spend.worked2", kind:"worked", state:MARLOW, after:MAR_PLAN, stillLabel:"NO CHANGE",
  title:"The same mechanism, on a job that is already losing money.",
  setup:"{job} already shows <b>{profit}</b> of JTD PROFIT, because it expects to cost {eac} against a fee of only {fee}.<br><br>Somebody books {d.jtd} of <b>planned</b> time to it — the same kind of week that made Foxglove more profitable, two screens ago.",
  button:"Follow it through",
  stages:[
   {cells:["jtd"], text:"<b>JTD COST</b> rises by {d.jtd}, to <b>{after.jtd}</b>. Money out of the door, exactly as before."},
   {cells:["etc"], text:"<b>ETC COST</b> falls by the same {d.etc}, to <b>{after.etc}</b>. It was planned, so that piece of work leaves the list of work still to come."},
   {cells:["eac"], text:"<b>EAC COST does not move.</b> Still {after.eac}. The money simply crossed from one side to the other, exactly as before."},
   {cells:["pct"], text:"The top of the fraction grew and the bottom did not, so the percentage rises, {pct} to {after.pct}."},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is {after.pct} of the {fee} fee, so <b>{after.rev}</b>. Up {d.rev}."},
   {cells:["profit"], text:"And here is where it stops matching what you just watched. The claim rose {d.rev} while cost rose {d.jtd} — <i>more</i> than the claim did. <b>JTD PROFIT falls, {profit} to {after.profit}.</b>"},
   {cells:[], text:"<b>Put FEE beside EAC COST and the reason is sitting there:</b> a {fee} fee against {after.eac} of expected cost. Expected cost is above the fee, so the gap between them — the job's own margin — is negative. Every dollar spent here claims back less than a dollar, planned or not, until the fee or the forecast changes."}
  ], src:["formula"]},

 /* THE EXCEPTION, and the most useful arithmetic in the app. Nothing in v4
    could produce it, because no job in v4 was ever expected to overspend. */
 {id:"spend.losing", kind:"choice", state:MARLOW, after:MAR_PLAN, fixed:true,
  q:"A different job. <b>{job}</b> expects to cost <b>{eac}</b> against a fee of <b>{fee}</b>, and already shows <b>{profit}</b> of JTD PROFIT.<br><br>Somebody books <b>{d.jtd}</b> of time to it. It was <b>planned</b> work, so ETC COST drops by the same {d.etc} and EAC COST does not move at all.<br><br>You have just learned that spending on plan earns money. Which way does JTD PROFIT go here?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, to {after.profit}.</b> And this is the exception worth carrying out of the level.<br><br>Every step of the mechanism worked exactly as you learned it. Spending on plan pushed the percentage up, {pct} to {after.pct}, so the claim rose from {rev} to {after.rev}. Nothing misbehaved.<br><br><b>Now look at the rate.</b> The claim rose {d.rev} while cost rose {d.jtd}. Every dollar spent on this job claims back less than a dollar, because EAC COST of {after.eac} is above the fee of {fee}, and the ratio between those two <i>is</i> the margin.<br><br>So the rule is not “spending on plan earns money”. It is <b>“spending on plan earns money at the job's own margin”</b>. If that margin is negative, working to plan makes the reported loss bigger every week, and it will keep doing so until the fee or the forecast changes.",
  src:["formula"]},

 {id:"spend.explain", kind:"explain", state:FOXGLOVE, after:FOX_REWORK10,
  prompt:"Say it in your own words, as if to somebody who has never seen this app.<br><br><b>Why did the same {d.jtd} of booked time make the job more profitable in one case, and less profitable in the other?</b>",
  model:["The booked cost landed on JTD COST in both cases, so money spent rose by the same {d.jtd} either way.",
         "In the planned case, the forecast of remaining work (ETC COST) dropped by the same amount, so EAC COST, the total expected cost, did not change at all.",
         "The top of the fraction grew and the bottom stayed still, so LIVE CALCULATED % COMP rose, and CLAIMED REVENUE rose with it, by more than the cost did.",
         "In the rework case, ETC COST did not drop, so EAC COST rose too. The bottom of the fraction grew as well, so the percentage rose much less, and the claim rose by less than the cost.",
         "So the thing that decided the outcome was neither the work nor the money. It was what happened to a forecast.",
         "And the exception: on a job already expecting to cost more than its fee, even the planned case loses money, because every dollar spent claims back less than a dollar."]},

 {id:"spend.recap", kind:"concept", state:FOXGLOVE,
  title:"The level in three sentences.",
  body:"<b>Finishing work moves nothing.</b> There is nowhere on this page to record that a drawing went out of the door.<br><br><b>Spending money moves everything</b>, because what the firm claims is driven by cost spent over cost expected in total.<br><br><b>Whether spending helps or hurts depends on two things.</b> Whether the forecast of remaining work came off by the same amount, and whether the job expects to cost less than its fee. Planned work on a healthy job earns money. The same work on a job expecting to overspend loses money, every week, until something above the arithmetic changes.<br><br>That is the engine. The 400 level is about the one input into it that you set yourself."}
]},

/* ═════════ 400 LEVEL ═════════ */
{id:"forecast", level:400, layout:"core",
 name:"The Forecast Is Yours",
 line:"Move it, and money already claimed moves with it",
 warmN:2,
 warm:[
 {id:"forecast.warm.rework", kind:"choice", state:KESTREL, after:KES_REWORK, fixed:true,
  q:"Warm-up, on a job you have not used for this before. <b>{d.jtd}</b> of unplanned rework is booked to <b>{job}</b>, so ETC COST does not drop.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to {after.profit}.</b> Nothing came off the forecast, so EAC COST rose from {eac} to {after.eac}. Both halves of the fraction grew, the claim only rose {d.rev}, and cost rose {d.jtd}."},

 /* P7-2 · zeroMove:true — same deliberate-exception marker as spend.nothing
    above; see that comment for why this flag exists. */
 {id:"forecast.warm.nothing", kind:"select", state:KESTREL, after:KESTREL, zeroMove:true,
  q:"Warm-up. <b>{job}</b> issues its full drawing set today. A real milestone, out of the door.<br><br><b>Tap every field that moves.</b>",
  why:"<b>Nothing moves.</b> No cost changed, so nothing the board calculates changed. There is nowhere on this page to record that the drawings went out."},

 {id:"forecast.warm.profit", kind:"compute", state:MARLOW, field:"profit",
  q:"Warm-up. <b>{job}</b> claims <b>{rev}</b> and has spent <b>{jtd}</b>.<br><br>What is JTD PROFIT? A minus sign is allowed.",
  hint:"claimed minus spent",
  why:"<b>{profit}.</b> Claimed minus spent, and on this job that comes out negative, because expected cost of {eac} is above the {fee} fee."},

 {id:"forecast.warm.fee", kind:"choice", state:KESTREL,
  q:"Warm-up. What has to happen for the fee on the whole <b>project</b> to change?",
  opts:["The client agrees it in writing, normally through an Additional Service Request",
        "The Project Director revises it at the monthly plan review, without client input",
        "Finance recalculates it at month end, once cost spent is known",
        "It rises automatically once expected cost passes it"],
  a:0,
  why:"<b>The client agrees it in writing.</b> A Partner signs the Additional Service Request, and the firm's instruction is not to start the work until written approval is in.",
  src:["fee"]}
 ],
 steps:[

 /* THE HONEST FRAME COMES FIRST. v4 demonstrated for four screens that a
    number he controls invents income, and only then said it was serious. The
    takeaway as sequenced was "the number is fake and I can move it". */
 {id:"forecast.intro", kind:"concept",
  title:"One number here is not a fact, and it is the most serious thing on the page.",
  body:"FEE is contracted. JTD COST is a record of what was actually spent, down to the timesheet line.<br><br><b>ETC COST is a forecast.</b> Somebody's estimate of what is still to come, and on your projects that somebody is you.<br><br><b>Here is the serious part, before the demonstration rather than after it.</b> A cost forecast is the only proxy for progress this system has. Nothing on this page looks at a drawing, so the forecast is doing the entire job of saying where the work has actually got to.<br><br>That is why the firm puts a control around it and asks for it reviewed and signed off every month. What follows shows you exactly how much a revision moves, in both directions. Read it as a description of your own responsibility, not as a loophole.",
  src:["plan"]},

 {id:"forecast.worked", kind:"worked", state:FOXGLOVE, after:FOX_ETC10, stillLabel:"DID NOT MOVE",
  title:"Change only the forecast. Change nothing real.",
  setup:"{job} is going far better than expected. You decide only {after.etc} of work is left, not {etc}.<br><br>You spend nothing. You deliver nothing. You change one thing: your view of the work still to come.",
  button:"Follow it through",
  stages:[
   {cells:["etc"], text:"<b>ETC COST</b> goes {etc} to <b>{after.etc}</b>. That is the only thing you touched."},
   {cells:["jtd"], text:"<b>JTD COST did not move.</b> {jtd} spent, before and after.<br><br>Keep your eye on this one. It is the field telling the truth."},
   {cells:["eac"], text:"<b>EAC COST</b> falls {eac} to <b>{after.eac}</b>, because it is only ever the two numbers above it added together."},
   {cells:["pct"], text:"The same money spent on top. A much smaller number underneath.{FRAC.after}"},
   {cells:["rev"], text:"{after.pct} of the {fee} fee is <b>{after.rev}</b> of CLAIMED REVENUE, up from {rev}."},
   {cells:["profit"], text:"<b>JTD PROFIT goes {profit} to {after.profit}.</b><br><br>The firm just recorded <b>{d.profit} of income because you revised an opinion.</b> No work was done. No invoice went out. Nobody spoke to the client."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>The forecast of remaining work went {etc} to {after.etc}. Nothing else was touched. Expected cost fell {eac} to {after.eac}, the same money spent now sits over a smaller total so the percentage rose {pct} to {after.pct}, the claim rose {rev} to {after.rev}, and profit went {profit} to {after.profit}.<br><br>Money spent: unchanged at {jtd}, before and after. That is the field telling the truth."}
  ], src:["formula","wholejob"]},

 {id:"forecast.raise", kind:"choice", state:FOXGLOVE, after:FOX_ETC90, fixed:true,
  q:"Back to where {job} started, with {etc} forecast still to spend. You now conclude the job will take longer, and you raise ETC COST from {etc} to {after.etc}. You touch nothing else.<br><br>Which way does CLAIMED REVENUE go?",
  opts:["Up","Down","It does not move, because no work changed"], a:1,
  why:"<b>Down.</b> EAC COST rises to {after.eac}, so LIVE CALCULATED % COMP falls from {pct} to {after.pct}, and CLAIMED REVENUE falls from {rev} to {after.rev}.<br><br><b>The firm has just un-earned {d.rev}</b>, in a month when nobody did anything differently.",
  src:["formula","wholejob"]},

 {id:"forecast.movers", kind:"select", state:FOXGLOVE, after:FOX_ETC90,
  q:"The same move. ETC COST goes from {etc} to {after.etc}, and nothing else is touched.<br><br><b>Tap every field that reads differently afterwards, including the one you changed yourself.</b>",
  why:"<b>{nmovers} fields move: {lmovers}.</b><br><br><b>JTD COST does not, and that is the one to watch.</b> Money actually spent is unchanged at {jtd}. Work delivered is unchanged. The client is unchanged.<br><br>What the firm claims fell {d.rev} anyway, and <b>JTD PROFIT is now {after.profit}</b>: the whole paper profit, gone, in a month when nobody did anything differently.",
  src:["formula","wholejob"]},

 {id:"forecast.cut", kind:"choice", state:FOX_ETC90, after:FOX_ETC30,
  q:"A month later {job} goes better than feared, and you cut ETC COST from {etc} down to {after.etc}.<br><br>What happens to CLAIMED REVENUE?",
  opts:["It rises to {after.rev}",
        "It stays at {rev}. You cannot un-claim income you have already lost",
        "It falls to {profit}, because cutting the forecast cuts what there is left to claim",
        "It does not move until the job closes and the {fee} fee is settled up"],
  a:0,
  why:"<b>It rises to {after.rev}.</b> LIVE CALCULATED % COMP jumps from {pct} to {after.pct}, because the same money spent now sits over a much smaller expected total.<br><br>That is {d.rev} more than last month, off a forecast revision and nothing else.<br><br><b>The lever works both ways.</b> It is not a penalty box, it is a live wire. Raising the forecast un-claims money; cutting it claims money back. Both happen in a month where nobody did anything differently, and both are your signature.",
  src:["formula","wholejob"]},

 /* THE ONE THAT MATTERS, and the reason the framing had to move to the front
    of the level. Cutting Marlow's forecast to this exact figure puts expected
    cost at the fee and the loss at zero, so the temptation is arithmetically
    perfect and the answer is still not "yes". */
 {id:"forecast.fix", kind:"choice", state:MARLOW, after:MAR_ETCFIX,
  q:"<b>{job}</b> is showing <b>{profit}</b> of JTD PROFIT, because it expects to cost {eac} against a fee of {fee}.<br><br>You could make that loss disappear this month by cutting ETC COST from {etc} to <b>{after.etc}</b>. That would put expected cost at {after.eac}, exactly the fee, and JTD PROFIT at <b>{after.profit}</b>.<br><br>Nothing about the work has changed. Should you?",
  opts:["Only if the remaining work really will cost {after.etc}. The forecast is a statement about the work, not a dial for the result",
        "Yes. The forecast was always far too cautious at {etc}, and taking it down makes the whole monthly report noticeably more accurate",
        "Yes, but only if the client is told about it first, since the {fee} fee itself is not changing at all",
        "No. A forecast must never ever be revised downwards, whatever the new remaining-cost estimate would actually be"],
  a:0,
  why:"<b>Only if it is true.</b><br><br>The arithmetic is perfect and that is exactly the problem. Cutting the forecast to {after.etc} puts expected cost at {after.eac}, precisely the {fee} fee, and JTD PROFIT at {after.profit}. The loss vanishes and nobody had to do anything.<br><br>Which is why the firm's instruction on this is one sentence long: <b>do not manage the adjustment, fix the project data.</b> If the work left genuinely will cost {after.etc}, then the old forecast was wrong and correcting it is your job. If it will not, you have moved this month's number and next month it comes back larger, because the money still has to be spent.<br><br>The fourth answer is wrong too, and worth saying so out loud: forecasts get revised downwards all the time and should be. <b>The test is never the direction. It is whether the number is a description of the work.</b>",
  src:["plan"]},

 {id:"forecast.ugly", kind:"compute", state:MAR_ETCUP, field:"rev",
  q:"Different month, same job. <b>{job}</b> has now spent <b>{jtd}</b> and has raised its forecast to <b>{etc}</b> still to go. The fee is <b>{fee}</b>.<br><br>What is CLAIMED REVENUE?",
  hint:"spent, over expected in total, times the fee. You can type the whole sum as one expression and it will work it out.",
  why:"<b>{rev}.</b> Spent {jtd} over an expected total of {eac} is {pct}, rounded to one decimal for reading. The engine itself never rounds mid-calculation, so that unrounded share of the {fee} fee lands at {rev}.<br><br>If you multiply the <i>rounded</i> {pct} back out by hand you will land a few dollars short of {rev} — that gap is rounding, not a mistake, and it is exactly why the app accepts an answer close to either one on a question shaped like this.<br><br>JTD PROFIT is now {profit}. Nothing was spent between the last screen and this one. The forecast went up, so the claim came down, so the loss got bigger. That is the whole lever, on a number that does not land anywhere tidy.",
  src:["formula"]},

 {id:"forecast.explain", kind:"explain", state:FOXGLOVE, after:FOX_ETC90,
  prompt:"A colleague looks at the Traffic Light Report and says <b>“we lost {d.rev} on {job} this month.”</b> You check, and nothing changed except ETC COST.<br><br><b>In your own words, what do you tell them?</b>",
  model:["Nothing was actually lost. No extra money was spent, and no work was undone.",
         "The forecast of remaining cost, ETC COST, was raised from {etc} to {after.etc}.",
         "That raised EAC COST, the total expected cost, from {eac} to {after.eac}.",
         "LIVE CALCULATED % COMP is money spent divided by money expected in total, so a bigger bottom number makes the percentage fall, from {pct} to {after.pct}.",
         "CLAIMED REVENUE is that percentage times the fee, so it fell too, from {rev} to {after.rev}. That fall is the {d.rev} they are looking at.",
         "So the right question is not “what went wrong this month”. It is “is the new forecast right”.",
         "And if it is right, nothing needs explaining away. The job really is going to cost more, and we have just found out in the month we found out."]},

 {id:"forecast.close", kind:"concept",
  title:"The part no puzzle can teach.",
  body:"You have now seen that one number, which you set yourself, moves what the firm claims in either direction, with no change at all in the work.<br><br>That is why Buro Happold puts a control around it. The Project Director reviews progress with the Job Leads by the <b>23rd</b> of the month to make sure the plans are accurate, and signs off the ETC on every job plan as part of the Project Director Checklist by the <b>25th</b>. Before a plan is changed, the change gets laid out for the relevant people first. And when a number looks wrong, the firm's instruction is one line: <b>do not manage the adjustment, fix the project data.</b><br><br>Shading a forecast is a real decision, not a technicality. <b>There is no test at the end of this level, because the test happens every month.</b>",
  src:["plan"]}
]},

/* ═════════ 500 LEVEL ═════════
   Moved down two levels in v5 (it was the 300 level in v4).
   Moved out of the 100 level in v4 on 260803. Two reviewers disagreed on
   the surface and agreed underneath: the section is well built and it

{id:"billing", level:500, layout:"full",
 name:"Claimed and Billed",
 line:"Two numbers, two schedules, and the gap between them",
 warmN:2,
 warm:[
 {id:"billing.warm.etc", kind:"choice", state:KESTREL, after:KES_ETCDOWN, fixed:true,
  q:"Warm-up. You cut <b>{job}</b>'s ETC COST from {etc} to {after.etc} because the job is going better than expected. You spend nothing and deliver nothing.<br><br>Which way does CLAIMED REVENUE go?",
  opts:["Up","Down","It does not move, because no work changed"], a:0,
  why:"<b>Up, {rev} to {after.rev}.</b> Expected cost fell {eac} to {after.eac}, so the same money spent now sits over a smaller total and the percentage rose {pct} to {after.pct}.<br><br>Money spent did not move. It is still {jtd}."},

 {id:"billing.warm.watch", kind:"select", state:KESTREL, after:KES_ETCDOWN,
  q:"Warm-up, same move: ETC COST goes {etc} to {after.etc} and nothing else is touched.<br><br><b>Tap every field that reads differently afterwards, including the one you changed.</b>",
  why:"<b>{nmovers} fields move: {lmovers}.</b><br><br>JTD COST does not, and it is the one to watch. Money actually spent is unchanged at {jtd}."},

 {id:"billing.warm.loss", kind:"choice", state:MARLOW,
  q:"Warm-up. <b>{job}</b> has a fee of <b>{fee}</b>, has spent <b>{jtd}</b>, and shows <b>{profit}</b> of JTD PROFIT.<br><br>Why is it negative?",
  opts:["It expects to cost {eac} in total, which is more than the fee",
        "It has already spent more money than its {fee} fee is even worth",
        "It has not yet been invoiced its full {fee} fee amount",
        "The client is disputing and withholding part of the {fee} fee"],
  a:0,
  why:"<b>Expected cost is above the fee.</b> {eac} expected against a {fee} fee, so the most it can ever claim is less than it will spend.<br><br>It has spent {jtd}, which is still under the fee. Expecting to overspend is what shows the loss, not having overspent."},

 {id:"billing.warm.hours", kind:"choice", state:FOX_CREW,
  q:"Warm-up. Two people book time to <b>{job}</b>. {c1.who} books {c1.hrs} hours; {c3.who} books {c3.hrs} hours.<br><br>Why does the one with fewer hours land the same money?",
  opts:["Because each person has an internal rate, and theirs is higher",
        "Because senior people's hours are rounded up",
        "Because the client is charged more for senior people",
        "Because sub-consultant costs are attached to the senior person"],
  a:0,
  why:"<b>Different internal rates.</b> {c1.who} costs {c1.rate} an hour, {c3.who} costs {c3.rate}. {c1.hrs} hours of one is {c1.cost}; {c3.hrs} hours of the other is {c3.cost}.<br><br>What the client is charged is a different, higher rate, and none of it appears on this board.",
  src:["hours"]}
 ],
 steps:[

 {id:"billing.intro", kind:"concept",
  title:"Two new boxes, and they run on a different clock.",
  body:"Everything so far used seven boxes. From here it has nine.<br><br><b>INV</b> is short for <b>invoiced</b>: what has actually been billed to the client. It moves on its own schedule, the invoice schedule set up on the project. People also say <b>billed</b> for this.<br><br><b>WIP</b> is short for <b>work in progress</b>: claimed revenue minus invoiced. Money the firm says it has earned but has not yet asked for.<br><br>What the firm <b>earns</b> comes out of the cost calculation. What it <b>bills</b> comes off the invoice schedule. The two calculations do not touch.<br><br>They are watched together, though: the firm's own guidance is that a growing WIP is the prompt to raise an invoice."},

 {id:"billing.worked", kind:"worked", state:FOXGLOVE, after:FOX_INV42, stillLabel:"NO CHANGE",
  title:"Send an invoice. Watch what does not move.",
  setup:"Back to {job}: {rev} claimed as earned, {inv} billed so far, so {wip} sitting in WIP.<br><br>The billing team now raises another {d.inv} of invoice.",
  button:"Send it",
  stages:[
   {cells:["inv"], text:"<b>INV</b> goes {inv} to <b>{after.inv}</b>. That is the invoice going out to the client."},
   {cells:["wip"], text:"<b>WIP</b> falls {wip} to <b>{after.wip}</b>. It is only ever claimed revenue minus invoiced, so billing more closes the gap."},
   {cells:["pct","rev","profit"], text:"<b>And nothing else moved at all.</b> Not the percentage, not what the firm claims, not the profit.<br><br>Invoicing does not earn anything. The claiming already happened when the money was spent. The invoice is only asking to be paid for it."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>{d.inv} of invoice went out, so billed went {inv} to {after.inv} and the gap between claimed and billed closed from {wip} to {after.wip}. Claimed revenue is {after.rev}, exactly what it was before, because it is calculated off cost and the cost did not move.<br><br>Two numbers, two schedules. They are watched together, but they are not connected."}
  ], src:["names"]},

 {id:"billing.early", kind:"choice", state:FOXGLOVE,
  q:"You persuade the client to let you invoice a big chunk of {job} early.<br><br>What happens to CLAIMED REVENUE?",
  opts:["Nothing. Invoicing does not change what the firm says it earned",
        "It rises, because billing is how revenue gets recognised on this board",
        "It falls, because WIP falls when an invoice goes out",
        "It rises next month, once the client actually pays"],
  a:0,
  why:"<b>Nothing.</b> Earning follows money spent. Billing follows the project's invoice schedule.<br><br>Invoicing early is still worth doing, because it is cash in the door sooner. It is just not revenue.",
  src:["names"]},

 {id:"billing.movers", kind:"select", state:FOXGLOVE, after:FOX_INV38,
  q:"{job} invoices another <b>{d.inv}</b>.<br><br><b>Tap every field that reads differently afterwards.</b>",
  why:"<b>{lmovers}. Nothing else.</b><br><br>INV goes {inv} to {after.inv}. WIP, being claimed revenue minus invoiced, falls {wip} to {after.wip}.<br><br>Everything on the earning side is untouched, because none of it knows or cares that an invoice went out."},

 /* P2-1 · nine "Up / Down / It does not move" items existed before this one
    and "It does not move" was correct on zero of them, so two tries with no
    understanding at all cleared every single one. This is the obvious missing
    case and it is this level's own central claim: an invoice moves INV and
    WIP and touches nothing else. */
 {id:"billing.profitcheck", kind:"choice", state:KESTREL, after:KES_INV, fixed:true,
  q:"<b>{d.inv}</b> of invoice goes out on <b>{job}</b>. Nothing else happens.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:2,
  why:"<b>It does not move. Still {profit}.</b><br><br>JTD PROFIT is claimed revenue minus money spent, and neither one of those is calculated from INV. The invoice only closes the gap between what has been claimed and what has been billed, which is WIP: {wip} to {after.wip}.<br><br>This is the tell for an invoice on any sheet you read: it is the only event on this page that moves something without touching cost or the claim at all.",
  src:["names"]},

 {id:"billing.sandpiper", kind:"choice", state:SANDPIPER,
  q:"On <b>{job}</b>, WIP reads {wip}, which is exactly the same as CLAIMED REVENUE. Why?",
  opts:["Because nothing has been invoiced on it yet, so the whole claim is sitting unbilled",
        "Because WIP is always exactly equal to claimed revenue until a job finally closes out",
        "Because the client has been invoiced and has not yet paid that particular invoice",
        "Because the claim and the billing schedule happen to have lined up this month"],
  a:0,
  why:"<b>Because INV reads {inv}.</b> WIP is what is claimed minus what is billed, so with nothing billed at all, the whole {rev} sits claimed and unbilled.<br><br>That gap is not a mistake, it is information. On a job this early it is expected, because the invoice schedule has not started yet.<br><br>Worth knowing before you say “normal” in front of finance: their own shorthand is <b>“Neg WIP: good. Pos WIP: bad”</b>, and a positive WIP is what tells them an invoice should be raised. They are not describing an error either; they are describing which direction they would rather be facing.<br><br>The third answer is the one to keep separate in your head. Billed-and-not-paid is a real thing and it has its own column on the real report, <b>UNPAID INV</b>. It is not this.",
  src:["names"]},

 {id:"billing.meaning", kind:"choice", state:FOXGLOVE,
  q:"A job's WIP has been large and growing for three months. What does that tell you, <b>on its own</b>?",
  opts:["That the claim has been running ahead of the billing for three months, and nothing beyond that",
        "That the job is genuinely losing real money, because the cash has not come in against it",
        "That the client has been billed already and is refusing outright to pay the invoices sent",
        "That the forecast of remaining cost has been quietly set far too low for three whole months now"],
  a:0,
  why:"<b>Only that the claim has run ahead of the billing.</b> That is the whole of what the column says.<br><br>It could be a billing lag, which is a cash problem worth chasing. It could be that the claim is running ahead of what you could actually defend to a client, which is a forecast problem. <b>WIP on its own does not tell you which</b>, and treating it as though it does is how people spend a fortnight chasing the wrong one.<br><br>A client who has been billed and is simply not paying is a third thing again, and it shows up under <b>UNPAID INV</b>, its own column on the real report.<br><br>Next screen: what you would actually look at to tell them apart.",
  src:["wip"]},

 {id:"billing.tell", kind:"choice", state:FOXGLOVE,
  q:"So WIP is wide and growing.<br><br><b>What would you look at to tell a billing lag from a claim running too far ahead?</b>",
  opts:["The invoice schedule, against what has been claimed. If an invoice was due and did not go out, it is a billing lag",
        "JTD PROFIT, taken entirely on its own. If it is still positive, the whole job is fine and the WIP will close itself",
        "UNPAID INV, taken entirely on its own. A large figure there means the claim itself has gone too high",
        "EAC COST, taken entirely on its own. If it has risen recently, the claim must have been too high"],
  a:0,
  why:"<b>The invoice schedule.</b> Billing runs off it, so comparing what it said should have gone out against what actually did separates the two cases in about a minute.<br><br>If the schedule was followed and WIP is still wide, then billing is not the problem, and what you are looking at is a claim the job may not be able to defend. At that point you are back in the forecast, not the invoices.<br><br>The firm watches the two together for exactly this reason. Its own wording is that a positive and growing WIP <i>“indicates an invoice should be raised”</i>, which is a prompt to go and look, not a verdict.<br><br>UNPAID INV is a different question again: money billed and not collected. Neither of these.",
  src:["wip"]},

 {id:"billing.recap", kind:"concept", state:FOXGLOVE,
  title:"Two clocks, and the gap between them.",
  body:"<b>What the firm claims</b> comes out of the cost calculation: money spent over money expected, times the fee. Nothing about a client is in it.<br><br><b>What the firm bills</b> comes off the invoice schedule set up on the project. Nothing about cost is in it.<br><br><b>WIP is the distance between the two.</b> Claimed minus billed. It is not a verdict on anything; it is a prompt to go and look, and the first place to look is the invoice schedule.<br><br>Two clocks, one gap, watched together. That is the level.",
  src:["wip"]}
]},

/* ═════════ 600 LEVEL ═════════
   NEW in v5, and the level that does the job the app exists for.
   Every question in v4 sat inside a section whose title named the lever, so
   the block supplied the cue and the DISCRIMINATION was never trained once.
   Four events look nearly identical on a month-end sheet and behave
   completely differently: time booked with the forecast dropping, time booked
   with the forecast not dropping, a forecast revision with no spend at all,
   and an invoice. His boss will not label the lever. */
{id:"mixed", level:600, layout:"full", bare:true,
 /* P2-2 · this level's own premise is that nothing tells you which lever
    moved — but it used to run every item on a board still printing every
    formula subtitle and dashing every calculated cell, which fights the
    level's own point twice over: it hands back the "how" scaffolding this
    level is explicitly testing without, and it hides the very values a
    reader would use to reason the identification out. bare:true strips the
    formula subtitles and the dashed calc edge (see the "real" section, the
    same treatment); the companion one-line engine change below (in
    renderStep's mask: computation) makes bare also unmask calculated cell
    VALUES, which is the actual fix — the values stay visible, they are just
    not labelled as calculated for you. Do not extend bare to any teaching
    level; it stays confined to where the point is to measure. */
 name:"Mixed, Unlabelled",
 line:"Four events that look alike, and how to tell them apart",
 warmN:2,
 warm:[
 {id:"mixed.warm.recompose", kind:"compute", state:MARLOW, field:"pct",
  q:"Warm-up. <b>{job}</b> has spent <b>{jtd}</b> against an expected total of <b>{eac}</b>.<br><br>What is LIVE CALCULATED % COMP?",

 steps:[

 {id:"mixed.intro", kind:"concept",
  title:"Nothing here tells you which lever moved.",
  body:"Every question so far has sat under a heading that named the thing being tested. Spending. The forecast. Billing. <b>The heading was doing half the work.</b><br><br>The Traffic Light Report has no headings like that. Four events look nearly identical on it and behave completely differently:<br><br>time booked with the forecast coming off;<br>time booked with the forecast <i>not</i> coming off;<br>a forecast revision with no spending at all;<br>and an invoice.<br><br>From here the questions describe what happened in a month and leave you to work out which of those it was. <b>That identification is the part that breaks in front of somebody else</b>, and it is genuinely harder than anything so far, because nothing tells you in advance which lever to check.<br><br>The board still carries all nine boxes, the same as the level before this one, because invoices are still in play."},

 {id:"mixed.a", kind:"choice", state:FOXGLOVE, after:FOX_REWORK10, fixed:true,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed on it, and EAC COST went from {eac} to {after.eac}.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to about {after.profit}.</b><br><br>Work out which event this was before doing any arithmetic. Time landed, so real money went out. But EAC COST <i>rose</i>, by the same {d.jtd}, which means nothing came off the forecast. This was work that was not on the plan.<br><br>So both halves of the fraction grew, the percentage barely moved ({pct} to {after.pct}), the claim rose only about {d.rev}, and cost rose {d.jtd}.<br><br><b>The tell was EAC COST.</b> Time landing with EAC COST holding still is planned work. Time landing with EAC COST rising by the same amount is unplanned work. That one comparison separates the two events that look most alike.",
  src:["formula"]},

 {id:"mixed.b", kind:"select", state:KESTREL, after:KES_INV,
  q:"A month on <b>{job}</b>. The only thing that happened was that <b>{d.inv}</b> was invoiced to the client.<br><br><b>Tap every field that reads differently at the end of the month.</b>",
  why:"<b>{lmovers}. Nothing else.</b><br><br>An invoice moves INV, and WIP moves because it is claimed minus billed. That is the entire footprint.<br><br>What the firm claims is untouched at {rev}, because it is calculated off cost and no cost moved. Profit is untouched at {profit}.<br><br><b>The tell for an invoice:</b> it is the only event on this page that moves anything at all without touching the cost side. If the claim did not move, no cost moved, and there is very little else it can have been.",
  src:["names"]},

 {id:"mixed.c", kind:"choice", state:FOXGLOVE, after:FOX_ETC90,
  q:"A month on <b>{job}</b>. Nobody booked an hour to it. No invoice went out. Nothing was delivered.<br><br>At the end of the month CLAIMED REVENUE reads <b>{after.rev}</b>, down from {rev}.<br><br>What happened?",
  opts:["Somebody raised the forecast of what is still left to spend",
        "The client cancelled part of the scope, so the fee came down",
        "An invoice was cancelled and had to be reversed",
        "Cost was moved off this job onto another one"],
  a:0,
  why:"<b>The forecast went up.</b> ETC COST went {etc} to {after.etc}, so EAC COST went {eac} to {after.eac}, the percentage fell {pct} to {after.pct}, and the claim fell {d.rev}.<br><br>Rule the other three out by hand, because that is the actual skill. If the fee had come down, FEE would read differently, and it reads {fee} in both months. An invoice moves INV and WIP and nothing else. Cost moving off the job would have moved JTD COST, and JTD COST is unchanged at {jtd}.<br><br><b>The tell:</b> the claim moved and JTD COST did not. Only one thing does that.",
  src:["formula"]},

 {id:"mixed.d", kind:"choice", state:KESTREL, after:KES_PLAN, fixed:true,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed, and EAC COST finished the month at {after.eac}, exactly where it started.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:0,
  why:"<b>Up, {profit} to {after.profit}.</b><br><br>EAC COST held still, so the forecast came off by the same {d.etc} the cost went on. That is planned work.<br><br>Only the top of the fraction grew, {pct} to {after.pct}. The claim rose {d.rev} while cost rose {d.jtd}, so profit rose {d.profit}.<br><br>Notice the <i>rate</i>: the claim rose by more than the cost did. That is because this job expects to cost {after.eac} against a fee of {fee}, which leaves a healthy margin. Hold that thought for two screens.",
  src:["formula"]},

 {id:"mixed.e", kind:"select", state:FOXGLOVE, after:FOX_PLAN10,
  q:"A month on <b>{job}</b>. <b>{d.jtd}</b> of time landed. Nobody invoiced anything.<br><br><b>Tap every field that reads differently at the end of the month.</b>",
  why:"<b>{nmovers} fields move: {lmovers}.</b><br><br>Two of them are worth stopping on.<br><br><b>EAC COST does not move</b>, and that is the signature of planned work: the {d.jtd} crossed from one side of the total to the other rather than being added to it.<br><br><b>WIP moves, and nobody invoiced anything.</b> WIP is claimed minus billed, and the claim just rose, so the gap widened with the billing side untouched. <b>An invoice is not the only thing that moves WIP</b>, which is exactly why WIP on its own never tells you what happened.",
  src:["wip"]},

 /* P5-7 · re-cut onto KES_OVER/KES_OVER_PLAN (see the job-state comment
    above), a different job with different numbers throughout, so this no
    longer shares MARLOW -> MAR_PLAN with spend.losing and mixed.warm.margin,
    and the stem no longer says "same shape as two screens ago" — which
    handed over the identification instead of making it happen again. */
 {id:"mixed.f", kind:"choice", state:KES_OVER, after:KES_OVER_PLAN, fixed:true,
  q:"A different month, a different job. <b>{job}</b>. <b>{d.jtd}</b> of time landed, and EAC COST finished at {after.eac}, exactly where it started.<br><br>Which way did JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to {after.profit}.</b> Work through the mechanism exactly as before, because the event itself does not tell you the answer.<br><br>EAC COST held still, so this was planned work; the percentage rose {pct} to {after.pct} and the claim rose {d.rev}.<br><br>But cost rose {d.jtd}, which is more. <b>This job expects to cost {after.eac} against a fee of {fee}.</b> Expected cost is above the fee, so every dollar spent claims back less than a dollar.<br><br><b>The check you cannot get from the event itself:</b> before saying which way profit went, look at EAC COST against FEE. On a healthy job, planned spending earns. On a job expecting to overspend, the same planned spending loses, every week, until the fee or the forecast changes.",
  src:["formula"]},

 {id:"mixed.g", kind:"choice", state:FOXGLOVE,
  q:"Two jobs, same month. On both of them JTD PROFIT fell.<br><br>On the first, JTD COST rose. On the second, JTD COST did not move at all.<br><br>What is the difference between them?",
  opts:["On the first, real money went out. On the second nothing physical happened, and somebody changed a forecast",
        "The second is worse, because a fall in profit with no spending at all means the client is disputing the work",
        "The first is worse, because that money is already gone out of the door and can never be recovered",
        "There is no real difference worth acting on here at all. Both are just a fall in reported profit"],
  a:0,
  why:"<b>Money moved on one. An opinion moved on the other.</b><br><br>JTD COST is the only field on this page that nobody can revise. If it moved, real cost landed. If it did not, whatever changed came out of the forecast, and the question becomes why the forecast changed and whether the new one is right.<br><br>They are not ranked, and the second is <b>not</b> the smaller problem. A forecast that has moved that far is telling you something about the work; it just has not cost anything yet.<br><br><b>Keep this as your first move on any sheet.</b> Profit moved: did JTD COST move? That one question splits every event on this page into two halves before you have done any arithmetic at all.",
  src:["formula"]},

 {id:"mixed.h", kind:"choice", state:FOXGLOVE, after:FOX_INV38,
  q:"A month on <b>{job}</b>. CLAIMED REVENUE finished at <b>{after.rev}</b>, exactly where it started. WIP went from {wip} to <b>{after.wip}</b>.<br><br>What happened?",
  opts:["An invoice went out",
        "The forecast was cut, so the claim caught up with the billing",
        "Cost was moved off this job onto another one",
        "The client paid an outstanding invoice"],
  a:0,
  why:"<b>An invoice went out.</b> INV went {inv} to {after.inv}, and WIP, being claimed minus billed, closed by the same {d.inv}.<br><br>Rule the others out by hand. Cutting the forecast would have moved CLAIMED REVENUE, and it did not move. Cost coming off the job would have moved JTD COST and dragged the claim with it. And a client <i>paying</i> an invoice moves neither of these: payment lives in the UNPAID INV column, which is not on this board at all.<br><br><b>The tell:</b> the claim held still and WIP moved. Only billing does that.",
  src:["names"]},

 /* P2-1 · the second of the two added "It does not move" items. This one is
    a genuinely untracked event, not a masked mover: getting paid for an
    invoice already sent lives in UNPAID INV, a column this board does not
    carry at all, so nothing here can move. */
 {id:"mixed.i", kind:"choice", state:KESTREL, after:KESTREL, fixed:true,
  q:"A month on <b>{job}</b>. The client pays an invoice that has been sitting outstanding for weeks. Nothing else happens.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:2,
  why:"<b>It does not move. Still {profit}.</b><br><br>Being paid is a different event from being billed, and this board does not carry a column for it at all — it lives in <b>UNPAID INV</b> on the real report, not here. No cost moved, so the claim could not have moved, so JTD PROFIT could not have moved either.<br><br>Hold this alongside the invoice question two screens back. <b>Sending an invoice moves INV and WIP. Being paid for one moves nothing on this board at all.</b> They are not the same event, even though both involve the word “invoice”.",
  src:["names"]},

 /* P5-7 · "add one item whose correct answer is you cannot tell from this."
    Everything before this item asks for a single, nameable cause. This one
    genuinely has two: cost was booked AND an invoice went out, in the same
    month, and WIP conflates both. Getting this wrong by confidently naming
    one cause is the realistic failure this level exists to prevent. */
 {id:"mixed.j", kind:"choice", state:MARLOW, after:MAR_COMPOUND, fixed:true,
  q:"A month on <b>{job}</b>. JTD COST moved, an invoice went out, and WIP moved too, from {wip} to {after.wip}.<br><br>Can you tell, from that WIP movement on its own, whether billing has fallen behind or the claim is simply running ahead of it?",
  /* P7-6/P7's new §8 measurement-bias check (verify_v5.js) caught this pair on
     first run: the correct option was 77 characters longer than its nearest
     distractor, a uniquely-longest-option cue of exactly the kind P2-3 fixed
     across 23 other items. Trimmed the correct option to its core claim and
     lengthened all three distractors with plausible-sounding qualifying
     clauses, closing the margin without losing any option's meaning. */
  opts:["No. WIP is claimed minus billed, and both sides moved this month, so you cannot separate them from the WIP number alone",
        "Yes. A WIP that has moved this way always means billing has fallen behind the claim, no matter what else happened on the job this month",
        "Yes. A WIP that has moved this way always means the claim is running too far ahead of billing to defend, regardless of any other cost movement",
        "Yes. The direction WIP moved always tells you directly and unambiguously which side, billing or claiming, caused the change this month"],
  a:0,
  why:"<b>No, and this is the one to sit with.</b> Two things happened this month, not one: {d.jtd} of cost was booked, unplanned, so EAC COST rose along with it and JTD PROFIT fell to {after.profit}; and separately {d.inv} was invoiced. Both of those move WIP, in opposite directions, and the number you can see is only their net.<br><br>Exactly the same lesson from the 500 level applies here, on a harder screen: <b>WIP is a prompt to go and look, never a verdict on its own</b>, and the place to look is the invoice schedule against what was actually claimed. What you CAN say without it: JTD COST moved, so real money genuinely went out, and at least part of this fall is not a forecast opinion. What EAC COST does tells you the rest — it rose, which is how you know the cost side was unplanned.",
  src:["wip"]},

 {id:"mixed.explain", kind:"explain", state:FOXGLOVE, after:FOX_REWORK10,
  prompt:"Ron puts the Traffic Light Report in front of you and says <i>“three of these moved and I do not understand why.”</i><br><br><b>In your own words: what do you check, and in what order?</b>",
  model:["First: did JTD COST move? It is the only field nobody can revise, so if it moved, real money went out, and if it did not, an opinion changed.",
         "If JTD COST moved, the next question is what EAC COST did. If EAC COST held still, the work was on the plan and the forecast came off by the same amount. If EAC COST rose by the same amount the cost did, the work was not on the plan.",
         "If JTD COST did not move but the claim did, somebody changed the forecast, and the only question that matters then is whether the new forecast is right.",
         "If the claim did not move but WIP did, it was billing. An invoice moves INV and WIP and touches nothing else.",
         "Then, before saying whether any of it was good or bad: EAC COST against FEE. On a job expecting to cost less than its fee, spending on plan earns money. On a job expecting to overspend, the same spending loses it.",
         "And I would say which of those I think it is, rather than reading him the list, because that is what he is actually asking for."]}
]},

   printed under its field and a "?" on every one. The artifact he actually
   opens does none of that: it prints the RESULT first and its EVIDENCE last,
   it annotates nothing, and JTD COST is not a column on it — it is
   TIME COST + SUBS & EXP, which the app stated twice and never once asked him
   to do. bare:true on the section strips the subtitles, the "?" and the
   dashed edge. showall on each step, because the real page hides nothing.

   EVERY ROW HERE IS INVENTED. The repo is public. No Buro Happold project and
   no figure off any real report reaches this file, ever. */
{id:"real", level:700, layout:"real", bare:true,

 {id:"real.warm.margin", kind:"choice", state:R_DUNMORE, showall:true,

 {id:"real.warm.wip", kind:"choice", state:R_BRAMBLE, showall:true,

 {id:"real.intro", kind:"concept",
  title:"The page in its own order, with nothing explained.",
  body:"Everything so far has been one job opened out, in the order the numbers are calculated, with each formula printed under its name and a <b>?</b> on every field.<br><br><b>None of that scaffolding exists on the real report.</b><br><br>From here the board switches to the real column order, the formulas come off, and the <b>?</b> goes away.<br><br>Two columns you have not seen appear. <b>TIME COST</b> is the cost of the hours booked to the job: everybody's hours, priced at their internal rate. <b>SUBS &amp; EXP</b> is everything spent that is not somebody's hours, so sub-consultant invoices, travel, printing, equipment. Added together, those two are the job's cost to date.<br><br>Which brings up the one you have leaned on all the way through. <b>JTD COST is printed on the real report</b>, at column 15, sitting directly between SUBS &amp; EXP and ETC COST. It is <b>covered up on this board, once</b>, so you can prove to yourself that you can rebuild it out of the two columns it is made of.<br><br>None of this is a trick. It is the same arithmetic, laid out the way the thing on your screen at seven in the morning lays it out.<br><br>Every job and every figure from here on is invented.",
  src:["report"]},

  hint:"two of the columns in front of you, added together",
  why:"<b>{jtd}.</b> TIME COST of {time}, plus SUBS &amp; EXP of {subs}.<br><br>That is the whole of it, and it is worth being able to do without looking, because almost everything else depends on it. LIVE CALCULATED % COMP is that figure over EAC COST. JTD PROFIT is claimed revenue minus that figure.<br><br>On the real report you would not have to work it out: column 15 gives you the total, with its two halves sitting immediately to its left. <b>Being able to rebuild it is what tells you those three columns are one idea</b> rather than three unrelated numbers that happen to sit next to each other.",
  src:["names"]},

  disclosure:'<details class="src"><summary>What TIME COST and SUBS &amp; EXP mean</summary><p><b>TIME COST</b> is the cost of the hours booked to the job, priced at each person\'s internal rate — not the rate the client is charged. <b>SUBS &amp; EXP</b> is short for sub-consultants and expenses: everything spent that is not somebody\'s hours, so sub-consultant invoices, travel, printing, equipment. Added together, those two are JTD COST.</p></details>',

/* ═══════════════════════════════════════════════════════════════════
   PART 4 — DERIVED ANSWERS, TOKENS, STORAGE
   No answer key is ever written down. Every asserted value is produced
   by derive() at render time, from the same state the board draws from.
   ═══════════════════════════════════════════════════════════════════ */
/* v5.1 — the full remediation spec (Money_Puzzles_v5.1_Remediation_Spec_v1_260803_2100.md),
   ALL of it, now shipped. P0 (both showstoppers), P1 (every accuracy finding),
   P2 (all 8 measurement items), P3 (the whole re-entry cluster), P4
   (interaction and mobile), P5 (all 13 content/curriculum items, including
   the two structural splits: level 000 cut to two cards with model.who/
   model.names relocated to the end of level 700, and level 100 split into
   "origin" + a new level 150 "boundary"), P6 (all 4 accessibility fixes,
   plus the pre-existing P4-7 fix re-verified for P6-4), P7 (all 6 items,
   including two NEW permanent structural guards added this session:
   verify_v5.js §4c for P7-2's zero-mover flag, and §8 formalizing the
   P2-3/P2-4 option-bias checks that were previously a throwaway script).
   Every fix in every P-section carries a named regression test in
   smoke_v5.js or a structural assertion in verify_v5.js, each citing the
   defect it guards, each proven by seeding the original defect on a temp
   copy and watching it fail before being reinstated. Both suites green. */
const BUILD = "v5.1 · built 260807 0740 ET";

/* One caption per level. NOT rendered on the map since P4-10 (260804): six of
   its eight values were just the section name lowercased, printed a second
   time directly above the button that already prints it, costing ~350px of
   the map and pushing level 700 and the reset link below the fold. Kept as
   data — not deleted — in case a future screen wants a genuinely distinct
   per-level caption; the map itself now prefixes the section's own name with
   its level number instead. */
const LEVELCAP={
  0:"what you are actually looking at",
  100:"where each number comes from",
  200:"the arithmetic",
  300:"spending is the engine",
  400:"the forecast is yours",
  500:"earned, and billed",
  600:"mixed, and unlabelled",
  700:"the real page"
};

/* ---------- the session seed ----------
   Drawn once at load, used for option order and for which warm-up items come
   up. THIS IS NOT A CLOCK. It stores nothing, it measures nothing, and it
   cannot tell how long he was away — which is the one property of this build
   that must never be traded away. Deterministic WITHIN a load, so a re-render
   after a wrong answer does not move things under his thumb. */
const SESSION_SEED = Math.floor(Math.random()*2147483647)+1;
/* Math.imul IS NOT AN OPTIMISATION. `h * 1103515245` reaches about 4.7e18,
   roughly five hundred times above 2^53, so float64 rounding destroys exactly
   the low bits that `>>> 0` then keeps. In v5.0 that made the generator emit
   an even number 9,993 times out of 10,000, and the measured consequence was
   that 27 of 27 shuffled four-option items put the correct answer at display
   position 3, so "always pick the last option" scored 96.2%. That is worse
   than the v4 defect the shuffle was written to fix, and it passed 1,654
   checks. Math.imul does the multiply in 32-bit integer space, where it is
   exact. The index is taken from the HIGH bits, because an LCG's low bits
   have famously short periods. */
function shuffleOrder(n, key){
  let h=SESSION_SEED>>>0;
  for(let i=0;i<key.length;i++) h=(Math.imul(h,31)+key.charCodeAt(i))>>>0;
  const idx=[]; for(let i=0;i<n;i++) idx.push(i);
  for(let i=n-1;i>0;i--){
    h=(Math.imul(h,1103515245)+12345)>>>0;
    const j=Math.floor((h/4294967296)*(i+1)), t=idx[i]; idx[i]=idx[j]; idx[j]=t;
  }
  return idx;
}

/* ---------- cumulative warm-up ----------
   Nothing from an earlier level ever came back. Seventeen scored items, each
   met once, massed, days apart. A section may declare a `warm` pool: ordinary
   steps, written on a DIFFERENT invented job so the surface features vary, and
   two of them are spliced onto the front of the section each session.

   THIS RUNS WITHOUT A CLOCK, and that constraint is not negotiable. The app
   stores no timestamp, has no interval, and cannot tell how long he was away,
   so it can never say so. Scheduling here is by two things only: which items
   he has not yet got right, and a per-load random seed. An item he has never
   answered correctly comes up before one he has.

   The picked items are MOVED out of the pool, not copied, so no id exists
   twice; the ones left behind stay in `sec.pool` and the self-test validates
   them too, or half the warm-up content would ship unchecked. */
const KEY="mp_v4", SAVEV=5;   // KEY stays mp_v4: renaming it discards his answers
function priorAnswers(){
  try{
    if(typeof localStorage==="undefined") return {};
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    return (raw && raw.st) || {};
  }catch(e){ return {}; }
}
const WARMED=[];          // the warm items actually installed this session
function installWarmups(){
  const prior=priorAnswers();
  SECTIONS.forEach(sec=>{
    const pool=sec.warm;
    if(!Array.isArray(pool) || !pool.length) return;
    const n=Math.min(sec.warmN||2, pool.length);
    const order=shuffleOrder(pool.length, sec.id+"|warm");

    /* P3-2 · THREE TIERS, AND THE UNRESOLVED ONE GOES LAST.
       v5.0 ranked on `r.a1===1` alone, so an item he got wrong once on day one
       stayed in the priority bucket for the life of the save and was
       GUARANTEED to open the level, for ever. The thing he is stuck on was the
       thing the app put in front of him first, every single time. Retrieval
       practice is preserved by keeping never-attempted items first; what
       changes is that a standing failure stops being the door. */
    const tier=i=>{
      const r=prior[pool[i].id];
      if(!r || (r.a===undefined && r.a1===undefined)) return 0;   // never attempted
      if(r.a1===1 || r.a===1) return 1;                           // resolved at some point
      return 2;                                                    // still unresolved: LAST
    };
    const ranked=order.slice().sort((x,y)=>tier(x)-tier(y));       // stable: shuffle survives within a tier
    const take=ranked.slice(0,n).sort((a,b)=>a-b);
    const chosen=take.map(i=>pool[i]);
    sec.pool=pool.filter((s,i)=>take.indexOf(i)<0);
    pool.forEach(s=>{ s.warm=true; });

    /* P3-5 · ONE AT THE HEAD, THE REST INTERLEAVED.
       Four levels opened with two scored questions and no teaching card, on a
       job he had never seen. That is the entry tax on a level, paid before
       anything has been explained. Halving it and putting the second item
       mid-section improves the spacing at the same time. */
    const head=chosen.slice(0,1), mid=chosen.slice(1);
    const base=sec.steps.slice();
    if(mid.length){
      const at=Math.max(1, Math.floor(base.length/2));
      base.splice.apply(base, [at,0].concat(mid));
    }
    sec.steps=head.concat(base);
    chosen.forEach(s=>WARMED.push(s.id));
  });
}
installWarmups();

const ALLSTEPS = SECTIONS.flatMap((s,i)=>s.steps.concat(s.pool||[]).map(st=>({...st, _sec:i})));
const SECOF = {}; SECTIONS.forEach((s,i)=>s.steps.concat(s.pool||[]).forEach(st=>{SECOF[st.id]=i;}));
const layoutOf = step => SECTIONS[SECOF[step.id]].layout;

function fracHTML(s){
  const box='display:inline-flex;flex-direction:column;align-items:center;text-align:center';
  const lbl='font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.75';
  const num='font-size:14.5px;font-weight:800;padding:3px 10px';
  return '<span style="display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap">'
    +'<span style="'+box+'">'
    +'<span style="'+lbl+'">money spent</span>'
    +'<span style="'+num+'">'+money(s.jtd)+'</span>'
    +'<span style="border-top:2px solid currentColor;align-self:stretch"></span>'
    +'<span style="'+num+'">'+money(s.eac)+'</span>'
    +'<span style="'+lbl+'">money expected in total</span></span>'
    +'<span style="font-size:19px;font-weight:800">= '+pctS(s.pct)+'</span></span>';
}

function moversFor(step){
  const vis = visibleIds(layoutOf(step));
  if(!step.state) return [];
  const a=derive(step.state), b=derive(step.after||step.state);
  return vis.filter(id=>Math.abs(b[id]-a[id])>0.005);
}
function answerIds(step){
  return step.mode==="identify" ? step.ids.slice() : moversFor(step);
}
function computeAnswer(step){ return derive(step.state)[step.field]; }

function tokenValue(tok, step){
  if(tok==="job")     return step.state ? (derive(step.state).name||"") : undefined;
  if(tok==="FRAC")    return step.state ? fracHTML(derive(step.state)) : undefined;
  if(tok==="FRAC.after") return step.state ? fracHTML(derive(step.after||step.state)) : undefined;
  if(tok==="nmovers") return String(moversFor(step).length);
  if(tok==="lmovers"){
    const names=moversFor(step).map(id=>CMAP[id].k);
    if(!names.length) return "nothing";
    return names.length===1 ? names[0]
      : names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  }
  /* {c1.who}, {c1.hrs}, {c1.rate}, {c1.cost} — person N of this step's crew,
     1-based. cost is hours x rate and is computed here, never written down. */
  const cm=/^c(\d+)\.(who|hrs|rate|cost)$/.exec(tok);
  if(cm){
    const p=((step.state||{}).crew||[])[parseInt(cm[1],10)-1];
    if(!p) return undefined;
    if(cm[2]==="who")  return p.who;
    if(cm[2]==="hrs")  return String(p.hrs);
    if(cm[2]==="rate") return money(p.rate);
    return money(p.hrs*p.rate);
  }
  /* {r1.wip}, {r4.profit}, {r2.name} — a figure or a name off row N of a
     many-row step, 1-based, in the order the rows are printed. This is how the
     real-page explanations quote several rows at once without any of those
     figures being typed by hand. */
  const rm=/^r(\d+)\.([a-z]+)$/.exec(tok);
  if(rm){
    const rows=step.rows||[]; const rs=rows[parseInt(rm[1],10)-1];
    if(!rs) return undefined;
    const d=derive(rs);
    if(rm[2]==="name") return d.name;
    return CMAP[rm[2]] ? fmtVal(CMAP[rm[2]], d[rm[2]]) : undefined;
  }
  const m=/^(after\.|d\.)?([a-z]+)$/.exec(tok);
  if(!m || !CMAP[m[2]] || !step.state) return undefined;
  const c=CMAP[m[2]], a=derive(step.state), b=derive(step.after||step.state);
  if(m[1]==="after.") return fmtVal(c, b[m[2]]);
  if(m[1]==="d.")     return fmtVal(c, Math.abs(b[m[2]] - a[m[2]]));
  return fmtVal(c, a[m[2]]);
}
function expand(txt, step){
  if(txt==null) return txt;
  /* THE DIGIT IN THIS CLASS IS LOad-BEARING. Without it {c1.who} and {r2.name}
     never match, so tokenValue() is never asked and the braces render on
     screen verbatim. expand() throws on an UNRESOLVED token and never threw
     here, because there was nothing to resolve. Both suites passed at 1,654
     checks with six screens showing literal code, including the whole of the
     "how an hour becomes a dollar" card and the entire explanation on the
     700 level's flagship item. The number audit could not see it: it proves no
     figure was typed TWICE, and an unexpanded token produces no figure at all.
     The guard is now in selfTest() and refuses to boot. */
  return String(txt).replace(/\{([A-Za-z][A-Za-z0-9.]*)\}/g, (m,tok)=>{
    const v = tokenValue(tok, step);
    if(v===undefined) throw new Error("unresolved token "+m+" on step "+step.id);
    return v;
  });
}

/* ---------- progress. Keyed on stable string ids, never on position. ----------
   KEY and SAVEV are declared with the warm-up block above, because the warm-up
   picker has to read prior answers before this loader runs. */
let ST={}, HW=0, PLACE=null;   // HW is vestigial: nothing locks. Kept so older saves load.
(function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    /* accept any payload at or below this version and MIGRATE it rather than
       dropping it. Progress is keyed on stable step ids, so carrying it
       forward is safe; silently wiping weeks of three-minute sessions on a
       version bump is not. */
    if(raw && raw.st && typeof raw.v==="number" && raw.v<=SAVEV){
      const known=new Set(ALLSTEPS.map(s=>s.id));
      for(const k in raw.st) if(known.has(k)) ST[k]=raw.st[k];   // unknown ids dropped
      HW = Math.min(Math.max(0, raw.hw|0), SECTIONS.length-1);
      if(raw.place && typeof raw.place.sec==="string") PLACE=raw.place;
    }
  }catch(e){}
})();
/* P3-4 · A WARM-UP ITEM MUST BE ABLE TO COME BACK.
   firstUnfinished() skips anything already answered correctly, so each pool
   item yielded at most ONE spaced retrieval in its entire life and then went
   quiet for ever, which is the opposite of what a warm-up is for. Clearing `v`
   and `a` on the items installed this session lets them re-fire. `a1` is NEVER
   cleared: first-attempt correctness is written once and is the only honest
   record in the file. */
(function refireWarmups(){
  WARMED.forEach(id=>{
    const r=ST[id]; if(!r) return;
    const keep={};
    if(r.a1!==undefined) keep.a1=r.a1;
    ST[id]=keep;
  });
})();

/* P3-3 · WHERE HE WAS. Section id and step id, never indices: the warm-up
   installer splices a different number of items in front of a section between
   sessions, so an index means a different step tomorrow. NOT A CLOCK. This
   stores two strings naming a place. It records nothing about time and the app
   still cannot tell how long he was away. */
function markPlace(){
  try{ PLACE={sec:SECTIONS[SEC].id, step:(cur()||{}).id||null}; }catch(e){ return; }
  save();
}
function save(){
  try{
    /* P4-15 · THE V4 SAVE-KEY TRAP.
       Money_Puzzles_v4_260803.html sits in the same folder, uses this SAME
       localStorage key ("mp_v4"), and carries SAVEV=4. ITS loader rejects any
       payload whose v is higher than its own SAVEV, so opening that stale file
       (a stale home-screen icon, a stale published copy) after this one leaves
       its ST empty — and the very next time IT calls save(), it overwrites
       this key with {v:4, st:{}}, silently wiping every answer he has given.
       The same trap runs in reverse if a future build ever gets here first.
       Read what is actually on disk before writing over it: never overwrite a
       payload whose version is already ahead of this build's. (Money_Puzzles_
       v4_260803.html's own save() carries the mirror-image guard, so opening
       IT after this one cannot wipe THIS build's save either — see that file,
       same line number pattern.) */
    const existing=JSON.parse(localStorage.getItem(KEY)||"null");
    if(existing && typeof existing.v==="number" && existing.v>SAVEV) return;
    localStorage.setItem(KEY, JSON.stringify({v:SAVEV, st:ST, hw:HW, place:PLACE}));
  }catch(e){}
}
function rec(id, patch){ ST[id]=Object.assign({}, ST[id], patch); save(); }

const isScored = st => st.kind==="choice" || st.kind==="select"
                    || st.kind==="compute" || st.kind==="rowpick";

/* ---------- option order ----------
   The correct option sat at position 1 in six of nine items in v4, so "pick 1,
   then pick 2" cleared eight of nine inside the retry budget. Order is now
   shuffled per session, off SESSION_SEED above. Steps whose options have a
   natural reading order (up / down / it does not move) opt out with
   fixed:true. */
function optOrder(step){
  const n=(step.opts||[]).length;
  if(!n) return [];
  if(step.fixed){ const a=[]; for(let i=0;i<n;i++) a.push(i); return a; }
  return shuffleOrder(n, step.id);
}
/* Warm-up items are excluded from the section's own count. They are drawn from
   a pool and differ between sessions, so counting them would make the score on
   the map move for reasons he did not cause — and that count is his record of
   what he has done, not a live scoreboard. */
function secStat(i){
  const steps=SECTIONS[i].steps.filter(s=>!s.warm);
  const sc=steps.filter(isScored);
  const right=sc.filter(s=>ST[s.id] && ST[s.id].a===1).length;
  const seenAll=steps.every(s=>ST[s.id] && ST[s.id].v);
  return {n:sc.length, right, seenAll, complete: seenAll && right===sc.length};
}
/* NOTHING IS EVER LOCKED. [Josh, 260803]
   "No reason we shouldn't be able to jump around. It's not a college entry
   exam, it's a resource."
   This is a design decision, not a relaxed setting, and it settles two of the
   review's hardest findings at once. The behavioural risk was that one wrong
   answer sealed four sections and the only visible escape was wiping all
   progress; that risk is now structurally absent. And the measurement argument
   about whether "all correct" constitutes mastery stops being load-bearing,
   because nothing depends on the answer: the count is retrospective evidence
   of what he has done, which is the only kind of persistence this project ever
   agreed to keep. Do not reintroduce gating without re-reading both.
   `secStat().complete` survives ONLY as a label on the map. */
function bumpHW(){ save(); }
const unlocked = i => true;
function firstUnfinished(i){
  const steps=SECTIONS[i].steps;
  let found=-1;
  for(let k=0;k<steps.length;k++){
    const st=steps[k], r=ST[st.id];
    if(!r || !r.v){ found=k; break; }
    if(isScored(st) && r.a!==1){ found=k; break; }
  }
  if(found<0) return 0;
  const st=steps[found], r=ST[st.id];
  /* NEVER re-open on a question he has already got wrong. After a gap the
     app's first act was to re-administer the test he failed, which is the
     worst possible opening move for task initiation. Walk back to the nearest
     teaching card in this section so he arrives warm and walks in on his own
     momentum. */
  if(isScored(st) && r && r.a===0){
    for(let j=found-1;j>=0;j--)
      if(steps[j].kind==="concept" || steps[j].kind==="worked") return j;
    /* P3-1 · THE GUARD COULD NOT FIRE WHERE IT MATTERED MOST.
