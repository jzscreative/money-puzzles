<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Puzzles">
<meta name="theme-color" content="#f4f6f9">
<meta name="robots" content="noindex, nofollow">
<title>Money Puzzles</title>
<style>
/* LIGHT MODE IS FORCED. There is deliberately no prefers-color-scheme block.
   ONE LAYOUT AT EVERY WIDTH. There is deliberately no width media query.
   Sizes scale with clamp(); nothing ever rearranges, hides or reflows. */
:root{
  color-scheme:light only;
  --bg:#f4f6f9; --panel:#ffffff; --calc:#eef3f9;
  /* --line and --rule are BORDER tokens. Never use either as a text colour. */
  --line:#d7e0ea; --rule:#8b95a1; --cellline:#8a8f96;   /* --rule and --cellline
     carry operable-component boundaries and are measured at 3.06:1 and 3.25:1
     against the panel. --line is decorative dividers only. */
  --ink:#0e151d; --body:#31414f; --dim:#4d5d70;
  --up:#15803d; --upbg:#e9f9ef; --upline:#5e9975;
  --down:#b91c1c; --downbg:#fdeeee; --downline:#b97b7b;
  --hot:#a16207; --hotbg:#fdf6e3; --hotline:#a18b53;
  /* "deliberately unchanged" used to share --hot with the retry warning box,
     so a CORRECT answer on the nothing-moves question painted every cell
     warning-amber underneath a green Correct bar. It is now neutral slate.
     Measured 3.65:1 against the white panel, so it still passes 1.4.11. */
  --stillline:#7c8794; --stillbg:#eceff3; --stillink:#4d5d70;
  --acc:#1d4ed8; --accbg:#e8effd;
  --dark:#16202b; --darkink:#eaf0f7; --darkdim:#a9bccf;
  --judge:#0e151d;
  --footh:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;touch-action:manipulation}
button{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- error banner ---------- */
#err{display:none;background:var(--down);color:#fff;font-size:13.5px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  line-height:1.5;position:sticky;top:0;z-index:60}
#err b{display:block;font-size:15px;margin-bottom:5px}
#err ul{margin:6px 0 0 18px}

/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.t{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:650}
.t.f{font-weight:500;font-size:10px;letter-spacing:.03em;color:var(--dim);opacity:.85}
.topbtn{margin-left:auto;background:none;border:1px solid var(--rule);color:var(--dim);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
  padding:8px 13px;border-radius:99px;cursor:pointer;min-height:44px}

#stage{display:flex;flex-direction:column;align-items:center;width:100%;
  padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
  padding-bottom:calc(var(--footh) + env(safe-area-inset-bottom) + 14px)}
#left{width:100%;max-width:680px;padding:12px 0 4px}
#right{width:100%;max-width:680px;border-radius:12px;display:flex;flex-direction:column;
  padding:0;gap:0;margin:8px 0 14px;overflow:hidden;border:1px solid var(--line);
  background:var(--panel);box-shadow:0 1px 2px rgba(16,25,40,.05)}

/* ---------- page shape: TEACHING vs ASKING ----------
   The two modes are a real signal and they stay. What changed in v5 is the
   DOSE. Teaching used to invert the entire screen, so a ninety-second stretch
   of the app flipped between near-black and near-white five times, and the
   densest sustained reading in the file sat in the polarity that fails
   outdoors. Teaching now mirrors what asking already does: one panel colour, a
   coloured left rail, and an inverted band across the top. */
#right.teach{border-left:5px solid var(--dark)}
#right.ask{border-left:5px solid var(--acc)}
.band{padding:9px 14px;font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.band.teach{background:var(--dark);color:var(--darkink)}
.band.ask{background:var(--acc);color:#fff}
#panel{padding:14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.015em}
.body{font-size:15.5px;color:var(--body);line-height:1.55;max-width:64ch}
.body b{color:var(--ink);font-weight:700}
.stagen{font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim)}

/* ---------- board ---------- */
#board{display:flex;flex-direction:column;gap:6px}
.jobname{font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:0 2px 5px}
.brow{display:flex;gap:6px;align-items:stretch}
.cell{flex:1 1 0;min-width:0;background:var(--panel);border:1.5px solid var(--cellline);
  border-radius:9px;position:relative;transition:background .18s,border-color .18s}
.cell.calc{background:var(--calc);border-style:dashed}
.cellhit{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 10px 8px 9px;border-radius:8px;color:inherit;min-height:58px}
.cell.hasq .cellhit{padding-right:32px}
.cellhit .k{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);font-weight:750;line-height:1.2}
.cellhit .s{display:block;font-size:11.5px;font-weight:650;color:var(--body);line-height:1.25;
  margin-top:2px}
.cellhit .v{display:block;font-size:clamp(14px,4.3vw,21px);font-weight:700;margin-top:4px;
  letter-spacing:-.015em;white-space:nowrap;color:var(--ink)}
.cellhit .v.mask{color:var(--dim);letter-spacing:.14em}
.was{display:block;font-size:10.5px;color:var(--body);font-weight:650;margin-top:-2px;
  padding:0 10px 8px 9px;line-height:1.3}
.cell.hasq .was{padding-right:32px}
.cellq{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:99px;
  border:1.5px solid var(--rule);background:var(--panel);color:var(--dim);font-size:12px;
  font-weight:750;cursor:pointer;line-height:1;display:flex;align-items:center;
  justify-content:center;padding:0}
.op{display:flex;align-items:center;justify-content:center;color:var(--body);
  font-size:clamp(15px,4vw,19px);font-weight:650;flex:0 0 auto;padding:0 1px}

/* channel 1 — HUE = direction the data moved */
.cell.up{border-color:var(--upline);background:var(--upbg)}
.cell.down{border-color:var(--downline);background:var(--downbg)}
.cell.still{border-color:var(--stillline);background:var(--stillbg)}
/* channel 2 — HEAVY BLACK BORDER = you chose this. Persists through the reveal.
   It must NOT set border-style. Converting a dashed calculated cell to solid
   destroyed the dashed edge on the very question that asks which cells are
   calculated — selection was erasing the evidence. Width and an inset ring
   carry it instead, and the dash survives. */
.cell.chosen{border-color:var(--judge);border-width:3px;
  box-shadow:inset 0 0 0 3px rgba(14,21,29,.10)}
/* channel 3 — ACHROMATIC BADGE = right, wrong, missed */
.chip{position:absolute;top:-9px;right:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;color:#fff;white-space:nowrap}
.chip.up{background:var(--up)} .chip.down{background:var(--down)} .chip.still{background:var(--stillink)}

/* ---------- the real report: many rows, real column order ---------- */
.rp{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--cellline);
  border-radius:10px;background:var(--panel)}
.rp table{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap;width:100%}
.rp th,.rp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.rp tr:last-child td{border-bottom:0}
.rp th{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  font-weight:800;background:var(--calc);line-height:1.25}
.rp .jn{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:700;
  border-right:1.5px solid var(--cellline);z-index:1;font-size:12.5px;white-space:nowrap}
.rp th.jn{background:var(--calc);z-index:2}
.rp tbody tr{cursor:pointer}
.rp tr.pick td{background:var(--accbg)}
.rp tr.pick .jn{background:var(--accbg);box-shadow:inset 4px 0 0 var(--judge)}
.rp tr.rr td,.rp tr.rr .jn{background:var(--upbg)}
.rp tr.rw td,.rp tr.rw .jn{background:var(--downbg)}
.rp tr.rm td,.rp tr.rm .jn{background:var(--stillbg)}
.rpmark{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;
  margin-left:7px;padding:2px 6px;border-radius:99px;background:var(--judge);color:#fff}
.rpmark.missed{background:var(--panel);color:var(--judge);border:1.5px dashed var(--judge)}
.rpmark.wrong{background:var(--panel);color:var(--judge);border:1.5px solid var(--judge)}
.rphint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
/* mode chrome: the strip that says what tapping does, so a mode change is
   announced by a visible element rather than discovered by tapping. */
.mode{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  background:var(--calc);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;margin-bottom:7px}
.mode .clr{margin-left:auto;background:none;border:0;color:var(--acc);font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;
  text-decoration:underline;padding:6px;min-height:34px}
.badge{position:absolute;top:-9px;left:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;white-space:nowrap;
  background:var(--judge);color:#fff;border:1.5px solid var(--judge)}
.badge.missed{background:var(--panel);color:var(--judge);border-style:dashed}
.badge.wrong{background:var(--panel);color:var(--judge)}
.lphint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.flash{animation:flash .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fadein .28s ease}
@media(prefers-reduced-motion:reduce){.flash,.fade{animation:none}}

/* ---------- verdict ---------- */
.verdict{margin:-14px -14px 2px;padding:13px 14px;font-size:20px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:#fff}
.verdict.y{background:var(--up)} .verdict.n{background:var(--down)}
.verdict.s{background:var(--judge)}
.tally{font-size:13px;color:var(--dim);font-weight:650}

/* ---------- inputs ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel);border:1.5px solid var(--rule);color:var(--ink);
  padding:13px 14px;border-radius:9px;cursor:pointer;font-size:15.5px;min-height:50px}
.opt.right{border-color:var(--up);background:var(--upbg);font-weight:700}
.opt.wrong{border-color:var(--down);background:var(--downbg)}
.opt.chosen{border-color:var(--judge);border-width:3px}
.opt:disabled{cursor:default;opacity:.72}
.numin{font-size:20px;font-weight:700;padding:13px 14px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;max-width:280px;min-height:54px;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel)}
.numin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.txtin{font:inherit;font-size:15.5px;line-height:1.5;padding:12px 13px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;min-height:130px;color:var(--ink);
  background:var(--panel);resize:vertical}
.txtin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.hint{font-size:13.5px;color:var(--dim)}
.warn{font-size:14px;color:var(--ink);background:var(--hotbg);border:1.5px solid var(--hotline);
  border-radius:8px;padding:10px 12px;font-weight:650}
.model{border:1.5px solid var(--line);border-radius:9px;padding:12px 13px;background:var(--calc)}
.model ul{margin:6px 0 0 18px;color:var(--body);font-size:15px;line-height:1.55}
.model li{margin-bottom:7px}
.model .h{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.chklist{list-style:none;margin:0;padding:0}
.chklist li{margin-bottom:7px}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:11px 12px;
  font-size:15px;line-height:1.5;color:var(--body);min-height:48px}
.chk .box{flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:2px solid var(--rule);
  margin-top:2px}
.chk.on{border-color:var(--judge);background:var(--calc);color:var(--ink)}
.chk.on .box{background:var(--judge);border-color:var(--judge);position:relative}
.chk.on .box::after{content:"\2713";position:absolute;inset:0;color:#fff;font-size:14px;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.confirm{border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;
  padding:11px 13px;font-size:14px;line-height:1.55;color:var(--body);background:var(--accbg)}
.confirm .h{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--acc);display:block;margin-bottom:4px}
details.src{font-size:13.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
details.src summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  min-height:44px;font-weight:650}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:"\25B8"}
details.src[open] summary::after{content:"\25BE"}
details.src p{margin-top:6px;line-height:1.55;color:var(--body)}
#right.teach details.src p{color:var(--body)}

/* ---------- section map ---------- */
#map{width:100%;max-width:680px;padding:16px 0 20px;display:flex;flex-direction:column;gap:10px}
.maphead{font-size:21px;font-weight:700;letter-spacing:-.015em}
.mapsub{font-size:14px;color:var(--body);line-height:1.55}
.lvlhead{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:800;margin-top:14px}
.lvlhead span{color:var(--body);font-weight:600;letter-spacing:.01em;text-transform:none;font-size:12.5px}
.sec{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:11px;padding:13px 14px;cursor:pointer;text-align:left;width:100%;min-height:66px}
.sec.locked{cursor:default;background:#eef1f5}
.sec.done{border-color:var(--upline)}
.secnum{width:32px;height:32px;border-radius:99px;background:var(--calc);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
.sec.done .secnum{background:var(--up);color:#fff}
.sec.now .secnum{background:var(--acc);color:#fff}
.sec.locked .secnum{background:#dfe5ec;color:var(--dim)}
.secbody{flex:1 1 auto;min-width:0}
.secname{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.secline{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}
.secprog{font-size:11.5px;color:var(--dim);font-weight:750;flex:0 0 auto;white-space:nowrap;
  text-align:right;max-width:82px;line-height:1.3}

/* ---------- the one fixed action bar. Same place on every screen. ---------- */
.mapfoot{text-align:center;font-size:10px;letter-spacing:.03em;color:var(--dim);opacity:.85;
  padding:2px 0 6px}
.resetlink{margin:18px auto 0;background:none;border:0;color:var(--dim);font-size:13px;
  font-weight:600;text-decoration:underline;cursor:pointer;padding:12px;min-height:44px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));min-height:var(--footh)}
#foot .spacer{flex:1 1 auto}
.btn{background:var(--acc);color:#fff;border:0;padding:13px 22px;border-radius:9px;
  font-weight:700;font-size:15.5px;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--dim);border:1.5px solid var(--rule);font-weight:600;
  padding:13px 16px}
.btn.dark{background:var(--judge)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- definition dialog ---------- */
#defWrap{display:none;position:fixed;inset:0;background:rgba(14,21,29,.5);z-index:70;
  align-items:center;justify-content:center;padding:24px}
#defBox{background:var(--panel);border-radius:14px;padding:20px;max-width:430px;width:100%;
  box-shadow:0 8px 40px rgba(14,21,29,.35);font-size:15.5px;line-height:1.6;color:var(--body)}
#defBox b{color:var(--ink);font-weight:700}
</style>
</head>
<body>

<div id="err" role="alert"></div>

<div id="bar" role="banner">
  <!-- "Where am I" was unanswerable on a step screen: the section name appeared
       nowhere once you were inside it, and the top bar spent that space on the
       build string. The build string now sits in the map footer, where it is
       needed once a fortnight rather than on every screen. -->
  <span class="t" id="where">Money Puzzles</span>
  <button class="topbtn" id="topbtn" type="button" onclick="goMap()">All sections</button>
</div>

<div id="stage" role="main">
  <div id="map"></div>
  <div id="left" style="display:none">
    <div id="modechrome" style="display:none"></div>
    <div id="board"></div>
    <div class="lphint" id="lphint">Tap the <b>?</b> on any field for a plain-English reminder of what it means</div>
  </div>
  <div id="right" style="display:none">
    <div class="band" id="band"></div>
    <div id="panel"></div>
  </div>
</div>

<div id="foot" role="navigation" aria-label="Step controls"></div>

<div id="defWrap" role="dialog" aria-modal="true" aria-labelledby="defBody">
  <div id="defBox">
    <div id="defBody"></div>
    <button class="btn" id="defClose" type="button" style="margin-top:14px">Got it</button>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   PART 1 — THE MODEL
   Nine fields. Three arrive from outside the page, six are arithmetic.
   derive() is the ONLY place a value is ever produced. Nothing below
   may re-type a figure that derive() can compute.
   Board order here is CALCULATION order, not the order printed on the
   real Traffic Light Report, which runs FEE, % COMP, CLAIMED REVENUE,
   INV, WIP, then TIME COST, SUBS & EXP, JTD COST, ETC COST, EAC COST,
   JTD PROFIT. Calculation order is easier to learn. Confirmed by Josh
   260803. A later section should walk the real page so the translation
   is taught rather than assumed.
   ═══════════════════════════════════════════════════════════════════ */
const money = n => (n<0?"−$":"$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const pctS  = n => (n*100).toFixed(1) + "%";

/* JTD COST has two forms and they must agree.
   On the teaching board a state carries `jtd` directly. On the real-report
   board a state carries `time` and `subs` instead, because JTD COST is not a
   column on the real page — it is TIME COST + SUBS & EXP. A state may not
   carry both: the self-test refuses to start if one does, because a state
   with jtd:60000, time:40000, subs:15000 would silently teach 55000 while
   claiming 60000, and that is exactly the class of error this app exists to
   stop Josh repeating. */
/* A state may also carry a `crew`: who booked how many hours at what internal
   rate. TIME COST is then the sum of hours x rate, so the sentence "how an
   hour becomes a dollar" is arithmetic the engine does, not a claim typed into
   a paragraph. */
function crewTime(s){
  return (s.crew||[]).reduce((n,p)=>n + p.hrs*p.rate, 0);
}
function derive(s){
  const split = (s.time!==undefined || s.subs!==undefined || s.crew!==undefined);
  const time = s.crew ? crewTime(s) : (s.time!==undefined ? s.time : 0);
  const subs = s.subs!==undefined ? s.subs : 0;
  const jtd  = split ? time + subs : s.jtd;
  const eac = jtd + s.etc;
  const pct = eac ? jtd/eac : 0;
  const rev = pct * s.fee;
  return {name:s.name, fee:s.fee, time, subs, jtd, etc:s.etc, inv:s.inv,
          eac, pct, rev, wip:rev - s.inv, profit:rev - jtd};
}

const CELLS=[
 {id:"fee", k:"FEE", fmt:"money",
  def:"<b>FEE.</b> The price agreed for the work.<br><br>At <b>project</b> level that is what the signed contract says, and it changes only if the contract does, normally through an Additional Service Request.<br><br>On an individual <b>job</b> inside that project, the fee is the slice of the total allocated to it — and that slice can be moved between jobs, or drawn from the project's contingency, without the client contract changing at all.<br><br>On the real report the column is headed <b>FEE</b>, not \"contract\"."},
 {id:"time", k:"TIME COST", sub:"HOURS, PRICED", fmt:"money",

 {id:"origin.intro", kind:"concept",
  title:"Seven numbers describe a job.",
  body:"That is the whole page, for now.<br><br><b>Three of them arrive from somewhere outside this page.</b> A signed contract, a timesheet system, a person's judgement.<br><br><b>Four are worked out from those three</b>, by arithmetic, right here on the page.<br><br>This section is only about where each number comes from. No arithmetic yet."},

 {id:"origin.worked", kind:"worked", state:FOXGLOVE, blank:true,
  title:"The three that arrive from outside.",
  setup:"This is <b>{job}</b>, an invented job used throughout. It is not a real Buro Happold project and every figure in this app is made up.<br><br>The three arrive by three completely different routes, and that matters more than it sounds.",
  button:"Show me the first one",
  stages:[
   {cells:["fee"], text:"<b>FEE — {fee}.</b><br><br>Straight off the signed contract: the price the client agreed for the whole job.<br><br>Somebody in finance types it in, reading it off the contract document. The project total changes only if the contract does. The slice allocated to any one job inside that project can be moved around without the client ever hearing about it."},
   {cells:["jtd"], text:"<b>JTD COST — {jtd}.</b> JTD is short for <b>job to date</b>.<br><br>Money already spent. <b>Nobody types this total in.</b> It accumulates on its own: every hour anyone books to this job in their timesheet, plus every sub-consultant invoice and expense.<br><br>On the real report it is two columns added: <b>TIME COST</b> and <b>SUBS &amp; EXP</b>."},
   {cells:["etc"], text:"<b>ETC COST, {etc}.</b> ETC is short for <b>estimate to complete</b>.<br><br>The forecast of what is still left to spend before the job finishes.<br><br><b>This is the only one of the three that is somebody's opinion</b>, and on your own jobs that somebody is you. The fee is a contract. Money spent is a record of what happened. This is a judgement about a future that has not happened yet."},
   /* the recap stage. Every worked example ends on one: the whole chain in a
      single line, no new figures, cells:[] so nothing moves. That sentence is
      the one he has to be able to say out loud, and it was the only thing the
      app never showed him. */
   {cells:[], text:"<b>All three at once, which is the sentence to keep:</b><br><br>{job} has a fee of {fee} off a contract, has spent {jtd} that accumulated by itself, and forecasts {etc} still to spend, which somebody decided.<br><br>A contract, a record, and an opinion. Everything else on this board is arithmetic on those three, and the rest of this level takes them one at a time."}
  ], src:["names"]},

 /* ── UNIT 1 · FEE ───────────────────────────────────────────────────── */
 {id:"origin.fee.card", kind:"concept", state:FOXGLOVE,
  title:"FEE: the price, and the one number nothing here can move.",
  body:"On <b>{job}</b> the fee reads {fee}.<br><br>It came off a signed contract. Somebody in finance typed it in, reading it off the document.<br><br>Nothing on this board can change it. Not spending, not the forecast, not the calculation. It sits above all of that, and it moves only when the client agrees it moves.<br><br>There is one exception, and it is the next question but one.",
  src:["fee"]},

 {id:"origin.fee.q", kind:"choice", state:FOXGLOVE,
  q:"What has to happen for the fee on the whole <b>project</b> to change?",
  opts:["The client agrees it in writing, normally through an Additional Service Request",
        "The Project Director revises it at the monthly plan review",
        "It rises on its own once the forecast of remaining cost rises",
        "Finance recalculates it at each month end"],
  a:0,
  why:"<b>The client agrees it, in writing.</b><br><br>An Additional Service Request is the normal route. It has to be clear on scope, on fee and fee type, and on schedule, and it refers back to the base contract. A Partner signs it; a Project Director may co-sign with the Partner's approval.<br><br>The rule, in the Business Rules' own words: <b>“Work should not commence on ASRs until written approval is received.”</b> There is a narrow at-risk route if it has to, and it carries a clause worth knowing on this of all boards: <b>the fee is not increased, and revenue is not claimed, until the written approval arrives.</b><br><br>So nothing you are about to learn can move the project fee.",
  src:["fee"]},

 {id:"origin.fee.edge", kind:"choice", state:FOXGLOVE,
  q:"<b>{job}</b> is one job inside a project that has several. The contract has not changed and the client has not been asked for anything.<br><br>Can the fee shown against this one job change?",
  opts:["Yes. At job level the fee is a slice of the project total, and slices can be moved between jobs or drawn from the project's contingency",
        "No. A fee is contractual, so it cannot move without the client",
        "Only downwards, and only if the job has over-run",
        "Only at the end, when the project is reconciled"],
  a:0,
  why:"<b>Yes, and this is the trap sitting inside the word “fee”.</b><br><br>The <b>project</b> fee is the contract, and only the client moves it. The <b>job</b> fee is an allocation of that contract across the jobs underneath it, and reallocating it is ordinary monthly work: Task 2 of the Project Director Checklist is exactly this, checking fees allocated for expenses, checking additional fees are allocated correctly, and checking the invoice schedule still matches the total fee allocated.<br><br>One word, two meanings: a contract one level up, a bookkeeping decision one level down. When somebody says the fee changed, the first question is which one.",
  src:["fee"]},

 /* ── UNIT 2 · JTD COST ──────────────────────────────────────────────── */
 {id:"origin.jtd.card", kind:"concept", state:FOXGLOVE,
  title:"JTD COST: nobody types it in.",
  body:"<b>JTD COST</b> is short for <b>job to date cost</b>. On {job} it reads {jtd}.<br><br>Nobody typed that. It is a running total that fills itself, out of two places:<br><br><b>TIME COST</b>, every hour anybody books to this job on a timesheet, turned into money.<br><b>SUBS &amp; EXP</b>, every sub-consultant invoice and every expense.<br><br>On the real report those are two separate columns, 13 and 14, and JTD COST is a third at column 15 sitting directly beside them. This board shows only the total, because the arithmetic is easier to follow with fewer boxes. You meet all three together at the 700 level.<br><br>The next card is the one this app used to skip: how an hour turns into a dollar.",
  src:["names"]},

 {id:"origin.jtd.hour", kind:"concept", state:FOX_CREW,
  title:"How an hour becomes a dollar.",
  body:"Everybody in the firm carries an <b>internal rate</b>: what an hour of their time costs Buro Happold. Hours booked, times that rate, is what lands in TIME COST.<br><br>Say three people booked time to {job}. Every name, hour and rate here is invented.<br><br>{c1.who}: {c1.hrs} hours at {c1.rate} an hour, so <b>{c1.cost}</b>.<br>{c2.who}: {c2.hrs} hours at {c2.rate} an hour, so <b>{c2.cost}</b>.<br>{c3.who}: {c3.hrs} hours at {c3.rate} an hour, so <b>{c3.cost}</b>.<br><br>Added up that is <b>{time}</b> of TIME COST. Add <b>{subs}</b> of sub-consultant invoices and expenses, and JTD COST is <b>{jtd}</b>, which is exactly the figure on the board.<br><br><b>The internal rate is not what the client pays.</b> There is a second, higher rate used when a fee is being built: the cost of the hours, plus a margin on top.<br><br>Be careful with what that does and does not mean. On a <b>lump-sum</b> job, which is most of this firm's work, the client never sees an hourly rate at all. They agreed a fee, and nothing on this board is calculated from a rate. <b>Profit here is the fee against the expected cost</b>, which is the whole of the 200 level and everything after it. The rate is how the fee got estimated in the first place, not how the money is counted afterwards.<br><br>The exception is <b>time and materials</b> work, the minority case, where revenue really is hours booked times an agreed billing rate. If somebody says the profit is in the rate, the first question is which kind of job they are looking at.",
  src:["hours"]},

 {id:"origin.jtd.q", kind:"choice", state:FOX_CREW,
  q:"On {job}, {c1.who} and {c3.who} landed <b>the same money</b> on the job. One of them booked three times as many hours as the other.<br><br>How?",
  opts:["Their hours cost different amounts, so it takes three times as many of the cheaper ones to reach the same money",
        "The cheaper person is charged to the client at a lower rate, so the job earns less from them",
        "The board rounds small amounts together",
        "The project director's figure includes the sub-consultant invoices"],
  a:0,
  why:"<b>{c1.who} costs {c1.rate} an hour. {c3.who} costs {c3.rate} an hour.</b><br><br>{c1.hrs} hours of the first is {c1.cost}. {c3.hrs} hours of the third is {c3.cost}. Same money, three times the hours.<br><br>The second wrong answer is the one worth naming out loud. What the <b>client</b> is charged is a different and higher rate, and none of it appears anywhere on this board. This board is costs. Earning happens through a separate calculation, and that calculation is the whole of the 200 level.",
  src:["hours"]},

 {id:"origin.jtd.who", kind:"choice", state:FOXGLOVE,
  q:"Who types JTD COST into the system?",
  opts:["Nobody. It is a running total of timesheet hours, sub-consultant invoices and expenses",
        "The Project Director, at the monthly review",
        "Finance, at month end",
        "Whoever raises the invoice"],
  a:0,
  why:"<b>Nobody. It accumulates.</b><br><br>That matters more than it sounds, because it makes JTD COST the one number here that <b>nobody can revise</b>. The fee is a contract. The forecast, which is next, is an opinion. Money already spent is a record of what happened.<br><br>Keep it. Later, when a figure has moved and you cannot see why, JTD COST is the field to look at first. If it has not moved, no money moved.",
  src:["names"]},

 /* ── UNIT 3 · ETC COST ──────────────────────────────────────────────── */
 {id:"origin.etc.card", kind:"concept", state:FOXGLOVE,
  title:"ETC COST: the only opinion on the page.",
  body:"<b>ETC COST</b> is short for <b>estimate to complete</b>: what is still left to spend before the job finishes. On {job} it reads {etc}.<br><br>Look at the three side by side. FEE is a contract. JTD COST is a record of what already happened. <b>ETC COST is a judgement about a future that has not happened yet</b>, and on your own jobs the person making that judgement is you.<br><br>Hold on to that asymmetry. It is the reason the 400 level exists at all."},

 {id:"origin.etc.list", kind:"concept", state:FOXGLOVE,
  title:"ETC is not a feeling. It is a priced list.",
  body:"This is the most useful sentence in the level, and the app used to leave it out entirely.<br><br><b>ETC COST falls out of the project plan.</b> Hours planned per person for the work still to come, priced at their internal rates, plus the expenses and sub-consultant invoices still to come. That list, added up, is ETC COST. Buro Happold's own words for it are <i>“your future planned costs... as per our plans”</i>, and the firm requires every workstage where costs are expected to carry one.<br><br><b>Why you need it now.</b> At the 300 level you will be told that doing planned work cuts ETC COST by the same amount it adds to JTD COST. That is not a convention somebody invented. If the plan said an engineer would spend forty hours next month and the engineer spends them, those hours leave the list of work still to come and join the record of work already done. Same hours, priced the same way, moving from one column to the other.<br><br>Without the list, that is an assertion you have to swallow. With it, it is obvious.",
  src:["etclist"]},

 {id:"origin.etc.q", kind:"choice", state:FOXGLOVE,
  q:"Which of these makes ETC COST fall?",
  opts:["Somebody doing work that was on the plan, so it comes off the list of work still to come",
        "Sending an invoice to the client",
        "Issuing the drawings",
        "The client paying an invoice"],
  a:0,
  why:"<b>Doing planned work.</b> The plan holds the work still to come, priced. Doing a piece of it takes that piece off the list.<br><br>The other three all really happen on a job, and not one of them touches the plan. Invoicing is the 500 level, and it moves nothing at all on the cost side. Issuing the drawings is the 300 level, and the fact that it moves nothing at all is the point of that entire level.",
  src:["etclist"]},

 {id:"origin.opinion", kind:"choice", state:FOXGLOVE,
  q:"ETC COST, the estimate of what is still left to spend, is the one number here that is somebody's opinion. Why?",
  opts:["Because it is a forecast of money not yet spent, and a person has to judge it",
        "Because finance revises it every month",
        "Because it comes from the contract, and contracts get renegotiated",
        "Because it is calculated from the other numbers"],
  a:0,
  why:"<b>Because it is a forecast, and a person makes it.</b><br><br>FEE is contracted. JTD COST is a record of hours already booked and invoices already received. The four dashed fields are arithmetic.<br><br>ETC COST is a judgement about a future that has not happened. On your projects, the person making that judgement is you. The 300 and 400 levels are entirely about what follows from that.",
  src:["etclist"]},

 /* ── UNIT 4 · THE CALCULATED FOUR, as a group. Deliberately light: they are
      done by hand, one at a time, through the whole of the 200 level. ── */
 {id:"origin.calc", kind:"concept", state:FOXGLOVE,
  title:"The other four are arithmetic, and the board says so.",
  body:"Four of the boxes are drawn with a <b>dashed edge</b>. That is the board telling you it worked them out itself, out of the three solid ones.<br><br><b>EAC COST</b>, estimate at completion: money spent plus money still forecast.<br><b>LIVE CALCULATED % COMP</b>, live calculated percent complete: money spent divided by money expected in total.<br><b>CLAIMED REVENUE</b>: that percentage, applied to the fee.<br><b>JTD PROFIT</b>, job to date profit: claimed revenue minus money spent.<br><br>Each one carries its own formula printed under its name, and you are not being asked to do any of it yet. The whole of the 200 level does these four by hand.<br><br>The only thing to take off this card is which four they are, and that <b>not one of them can move unless one of the three above it moves first</b>."},

 {id:"origin.identify", kind:"select", mode:"identify", state:FOXGLOVE,
  ids:["fee","jtd","etc"],
  q:"<b>Tap the three fields that arrive from outside this page.</b><br><br>The other four are worked out right here, from those three.",
  why:"<b>FEE, JTD COST and ETC COST.</b><br><br>FEE comes off the signed contract. JTD COST accumulates from timesheets and supplier invoices. ETC COST comes out of a person's head.<br><br>The other four, EAC COST, LIVE CALCULATED % COMP, CLAIMED REVENUE and JTD PROFIT, are worked out from those three and from nothing else.<br><br>Tap the <b>?</b> on any field for a reminder of what it means.",
  src:["names"]},

 {id:"origin.finished", kind:"choice", state:FOXGLOVE,
  q:"Which of these tells you <b>how much of the scope has actually been delivered</b>: drawings issued, design work genuinely completed, deliverables out of the door?",
  opts:["LIVE CALCULATED % COMP","EAC COST","JTD PROFIT","There is no such field"],
  a:3,
  why:"<b>There is no such field.</b> Nothing on this board looks at the drawings, and that absence is the point of the whole app.<br><br>The one that looks as though it ought to be it is <b>LIVE CALCULATED % COMP</b>. That is money spent divided by money expected to be spent. It is a <i>money</i> percentage, not a <i>work</i> percentage.<br><br>{job} has spent {jtd} of an expected {eac}, so it reads {pct}. It would read {pct} whether the drawings were finished or barely started.",
  src:["formula","wholejob"]},

 {id:"origin.words", kind:"concept",
  title:"One name each, and the ones you will hear instead.",
  body:"Last card of the level, and it is the vocabulary, because the same quantity has several names in the room and you need exactly one to say out loud.<br><br><b>Say “claimed revenue”.</b> It is the real column heading. You will also hear it called revenue, earnings, reported income, and “what the job has earned”. All the same number.<br><br><b>Say “spent”, or “JTD COST”.</b> Job to date cost.<br><b>Say “billed”, or “INV”.</b> Invoiced. You meet it at the 500 level.<br><br>One word to be careful with. <b>“Booked”</b> gets used for two different things. Booking <i>hours</i> to a job means filling in a timesheet, and it pushes cost up. Booking <i>revenue</i> means recording income. Same word, opposite sides of the page. If somebody says booked, ask which.<br><br>And the abbreviations, spelled out once each: <b>JTD</b> job to date. <b>ETC</b> estimate to complete. <b>EAC</b> estimate at completion. <b>INV</b> invoiced. <b>WIP</b> work in progress. <b>ASR</b> additional service request. <b>FRS 102</b> is a UK accounting standard Buro Happold adopted in May 2026; it adds an adjustment on top of these numbers at project level and does not change the calculation you are learning. It gets its own level, and that level is not built yet.",
  src:["names"]}
]},

/* ═════════ 200 LEVEL ═════════ */
{id:"arith", level:200, layout:"core",
 name:"The Arithmetic",
 line:"How the four calculated numbers are made",
 steps:[

 {id:"arith.intro", kind:"concept",
  title:"Four numbers are only arithmetic.",
  body:"Every calculated field carries its own formula printed under its name, and you will see them as the boxes fill.<br><br>This section does all four by hand, once, on a second invented job, so they stop feeling like magic."},

 {id:"arith.worked", kind:"worked", state:SANDPIPER, blank:true,
  title:"A second job. Watch it build from empty.",
  setup:"This is <b>{job}</b>: a bigger fee, and it has barely started. Every box is empty and they fill one at a time.<br><br>Nothing carries over from the first job. Read every number fresh.",
  button:"Fill the first three",
  stages:[
   {cells:["fee","jtd","etc"], text:"The three that arrive from outside.<br><br>Fee <b>{fee}</b>, off the contract. <b>{jtd}</b> already spent, off timesheets and supplier invoices. <b>{etc}</b> still forecast to spend, which is somebody's judgement."},
   {cells:["eac"], text:"<b>EAC COST</b>, estimate at completion, is only the two cost numbers added together.<br><br>{jtd} already spent, plus {etc} still to come, is <b>{eac}</b> expected to be spent in total, start to finish."},
   {cells:["pct"], text:"Then the division that runs everything: money spent, over money expected in total.{FRAC}That is <b>LIVE CALCULATED % COMP</b>. A quarter of the expected money has gone out."},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is that percentage applied to the fee.<br><br>{pct} of {fee} is <b>{rev}</b>. That is what the firm claims it has earned on this job so far.<br><br>Nobody looked at a drawing to decide it."},
   {cells:["profit"], text:"<b>JTD PROFIT</b> is what the firm claims it earned, minus what it actually spent.<br><br>{rev} claimed, minus {jtd} spent, is <b>{profit}</b>.<br><br>That is every calculated field on this board."},
   {cells:[], text:"<b>The whole chain in one line, which is the line to be able to say:</b><br><br>{jtd} spent plus {etc} still to spend is {eac} expected in total. {jtd} over {eac} is {pct}. {pct} of the {fee} fee is {rev} claimed. {rev} claimed minus {jtd} spent is {profit} of profit.<br><br>Four steps, each one feeding the next. Nothing here looked at a drawing."}
  ], src:["formula"]},

 /* THE DRILLS RUN ON A THIRD JOB. In v4 all four re-used the exact figures
    from the worked example directly above them, so they measured recall of a
    number rather than application of a rule. */
 {id:"arith.eac", kind:"compute", state:KESTREL, field:"eac",
  q:"A third job. <b>{job}</b> has spent <b>{jtd}</b> so far, and forecasts <b>{etc}</b> still to spend.<br><br>What is EAC COST, the estimate at completion?",
  hint:"the two cost numbers, added together",
  why:"<b>{eac}.</b> EAC COST is only ever money already spent, plus the forecast of what is left. Nothing cleverer than that."},

 /* OPERAND SELECTION. Every compute item hands him both numbers in the stem,
    so none of them ever tests the part that actually breaks in front of a
    boss: working out WHICH two of the numbers on the page to use. */
 {id:"arith.pickop", kind:"select", mode:"identify", state:KESTREL,
  ids:["jtd","eac"],
  q:"Nobody has handed you the numbers this time.<br><br><b>Tap the two fields you would divide, one by the other, to get LIVE CALCULATED % COMP.</b>",
  why:"<b>JTD COST over EAC COST.</b> Money spent, over money expected in total.<br><br>The one that catches people is <b>ETC COST</b>. It feels as though the percentage ought to compare what is done against what is left, but it does not. It compares what is done against the <i>whole</i>, and the whole is EAC COST.<br><br>ETC COST does get in, but indirectly: it is half of EAC COST. That is why moving it moves the percentage, which is the whole of the 400 level.",
  src:["formula"]},

 {id:"arith.pct", kind:"compute", state:KESTREL, field:"pct",
  q:"Same job. <b>{jtd}</b> spent, <b>{eac}</b> expected to be spent in total.<br><br>What is LIVE CALCULATED % COMP? Type the number only.",
  hint:"money spent ÷ money expected in total. A percentage or a decimal are both accepted, and so is the sum itself.",
  why:"<b>{pct}.</b>{FRAC}It does not mean that share of the drawings is done. It means that share of the expected money has gone out.",
  src:["formula","wholejob"]},

 {id:"arith.rev", kind:"compute", state:KESTREL, field:"rev",
  q:"The fee is <b>{fee}</b>, and <b>LIVE CALCULATED % COMP reads {pct}</b>.<br><br>What does the firm claim it has earned? CLAIMED REVENUE.",
  hint:"that percentage, applied to the fee",
  why:"<b>{rev}.</b> That share of the fee, because that share of the expected cost has been spent.<br><br>Nobody looked at the drawings to decide it, and no human signed it off. It is two cost numbers and a price.",
  src:["formula","wholejob"]},

 {id:"arith.profit", kind:"compute", state:KESTREL, field:"profit",
  q:"{job} claims it has earned <b>{rev}</b>, and it has spent <b>{jtd}</b>.<br><br>What is JTD PROFIT?",
  hint:"claimed minus spent",
  why:"<b>{profit}.</b> Claimed minus spent.<br><br>It is a profit on paper. The claiming half of it came out of the calculation you just did, not out of anybody's bank account."},

 {id:"arith.chain", kind:"choice", state:KESTREL,
  q:"You want {job}'s JTD PROFIT and nothing has been calculated yet.<br><br>Which of the four has to be worked out <b>first</b>?",
  opts:["EAC COST, because the percentage needs it, and claimed revenue needs the percentage",
        "CLAIMED REVENUE, because profit is claimed revenue minus cost",
        "LIVE CALCULATED % COMP, because everything else is a percentage of something",
        "None of them. The four are worked out independently of each other"],
  a:0,
  why:"<b>EAC COST.</b> The four are a chain, not a list.<br><br>EAC COST needs the two cost numbers. LIVE CALCULATED % COMP needs EAC COST. CLAIMED REVENUE needs the percentage. JTD PROFIT needs claimed revenue.<br><br>Which is why one change at the top of the chain moves everything below it, and why nothing below it can move on its own.<br><br><b>Keep this as a habit.</b> When a figure has moved and you cannot see why, walk the chain upwards until you reach something that was not calculated. It will be the fee, the money spent, or the forecast, and there is nothing else it can be.",
  src:["formula"]},

 /* THE FAILURE STATE, and the first awkward percentage in the app. No job
    anywhere in v4 was ever over-run and every percentage landed tidy, so
    nothing ever asked him to judge whether an ugly number was roughly right —
    which is exactly what reading a real row demands. */
 {id:"arith.ugly", kind:"compute", state:MARLOW, field:"pct",
  q:"A fourth job, and this one is not tidy. <b>{job}</b> has spent <b>{jtd}</b> and expects to spend <b>{eac}</b> in total.<br><br>What is LIVE CALCULATED % COMP?",
  hint:"money spent ÷ money expected in total. Round to one decimal place, or type the division itself and let it work it out.",
  why:"<b>{pct}.</b>{FRAC}Nothing on a real report lands on a round number, and this is the first figure in this app that does not.<br><br>What matters more than the decimal is being able to say roughly where it should land before you work it out. Spent is a bit under three quarters of expected, so the answer had to be a bit under seventy-five. If your arithmetic had produced something in the thirties or the nineties, you would want to know why before repeating it to anybody.",
  src:["formula"]},

 {id:"arith.loss", kind:"choice", state:MARLOW,
  q:"Still <b>{job}</b>. Fee <b>{fee}</b>, spent <b>{jtd}</b>, forecast <b>{etc}</b> still to go.<br><br>Its JTD PROFIT reads <b>{profit}</b>. Every job you have seen so far has been positive. What has happened?",
  opts:["It expects to cost {eac} in total, which is more than the fee, so it can claim less than it has already spent",
        "It has already spent more than its fee",
        "The forecast of remaining cost has been set too low",
        "It has not invoiced enough of the fee yet"],
  a:0,
  why:"<b>Expected cost has gone past the fee.</b><br><br>{job} expects to cost {eac} all in, against a fee of {fee}. Claimed revenue is the percentage times the fee, and the percentage is {pct}, so the most it can claim is {rev}. It has already spent {jtd}. Claimed minus spent is {profit}.<br><br>The second answer is worth checking rather than waving away: it has spent {jtd}, which is still <i>under</i> the {fee} fee. <b>Overspending the fee is not what makes a job show a loss here. Expecting to overspend it is.</b><br><br>The loss appears the moment the forecast says it will happen, which can be months before the money actually goes out of the door. That is the single most useful thing on this screen.",
  src:["formula"]},

 {id:"arith.recap", kind:"concept", state:KESTREL,
  title:"The four, in one line.",
  body:"Before you leave the level, say it once.<br><br><b>Spent, plus still to spend, is the total expected. Spent over total expected is the percentage. The percentage times the fee is what we claim. What we claim minus what we spent is the profit.</b><br><br>On {job}: {jtd} plus {etc} is {eac}. {jtd} over {eac} is {pct}. {pct} of {fee} is {rev}. {rev} minus {jtd} is {profit}.<br><br>That is the whole arithmetic of the page. Everything from here is about what makes those three input numbers move."}
]},

{id:"spend", level:300, layout:"core",
 name:"Spending Is The Engine",
 line:"What the firm claims follows money spent, not work finished",
 warmN:2,
 /* Two of these four open the level, on jobs he has not seen this material on,
    picked by the session seed with never-yet-right ones first. Nothing here

 warm:[
 {id:"spend.warm.opinion", kind:"choice", state:KESTREL,
  q:"Warm-up, on a job you have not used for this before. On <b>{job}</b>, which of these three is somebody's <b>opinion</b> rather than a contract or a record?",

  a:0,
  why:"<b>ETC COST.</b> The fee is a contract, money spent is a record of what happened, and the forecast of what is left is a judgement about a future that has not happened.<br><br>On {job} that judgement currently reads {etc}."},

 {id:"spend.warm.eac", kind:"compute", state:MARLOW, field:"eac",

 {id:"spend.warm.calc", kind:"select", mode:"identify", state:KESTREL,

 {id:"spend.warm.rev", kind:"compute", state:KESTREL, field:"rev",

 ],
 steps:[

 {id:"spend.intro", kind:"concept",
  title:"Revenue answers to money spent. Nothing else.",
  body:"This is the idea everything else hangs off, and it is the one that feels wrong the first time you meet it.<br><br><b>Finishing something moves nothing on this page. Spending does.</b>"},

 {id:"spend.nothing", kind:"select", state:FOXGLOVE, after:FOXGLOVE,
  q:"Back on <b>{job}</b>. Today you issue the complete drawing set: a major milestone, delivered, out of the door.<br><br><b>Tap every field that moves.</b>",
  why:"<b>Nothing moved. Not one field.</b><br><br>Issuing the drawings changed no cost, so it changed no reported revenue. There is nowhere on this board to record that it happened at all.<br><br>This is why a job can feel finished and still report as though it is not.",
  src:["formula"]},

 {id:"spend.worked", kind:"worked", state:FOXGLOVE, after:FOX_PLAN6,
  title:"Book time that was planned, and follow it through.",
  setup:"Somebody puts <b>{d.jtd}</b> of hours on {job} in their timesheet this week.<br><br>It was planned work, so the forecast of what is left drops by the same amount. Nothing was delivered. No drawing was issued. Only money moved.",
  button:"Follow it through",
  stages:[
   {cells:["jtd"], text:"<b>JTD COST</b> rises by {d.jtd}, to <b>{after.jtd}</b>. That is the timesheet hours landing."},
   {cells:["etc"], text:"<b>ETC COST</b> falls by {d.etc}, to <b>{after.etc}</b>. The work got done, so there is that much less of it left to do."},
   {cells:["eac"], text:"<b>EAC COST does not move.</b> Still {after.eac}.<br><br>The money simply crossed from one side to the other. The job is not expected to cost a penny more than it was."},
   {cells:["pct"], text:"The top of the fraction grew and the bottom did not, so the percentage rises.{FRAC.after}"},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is {after.pct} of the {fee} fee, so <b>{after.rev}</b>. Up {d.rev}."},
   {cells:["profit"], text:"What the firm claims rose {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT goes {profit} to {after.profit}</b>.<br><br>Money went out of the door and the job got more profitable."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>{d.jtd} of planned time landed, so spent went {jtd} to {after.jtd} and the forecast came off by the same {d.etc}. Expected in total held still at {after.eac}, so the percentage rose from {pct} to {after.pct}, the claim rose {d.rev}, and profit went {profit} to {after.profit}.<br><br>Nothing was delivered. No drawing went out. The only event was money."}
  ], src:["formula"]},

 {id:"spend.planned", kind:"choice", state:FOXGLOVE, after:FOX_PLAN10, fixed:true,
  q:"You book <b>{d.jtd}</b> of time on {job} this week. The work was planned, so ETC COST drops by the same {d.etc}.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:0,
  why:"<b>Up.</b> EAC COST stays at {after.eac}, because the {d.jtd} crossed from one side to the other. JTD COST is now {after.jtd}, so LIVE CALCULATED % COMP rises to {after.pct} and CLAIMED REVENUE to {after.rev}.<br><br>The claim rose {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT rose from {profit} to {after.profit}</b>.<br><br>Spending on plan earns money. There is one exception, three screens from here.",
  src:["formula","wholejob"]},

 /* DEMONSTRATE THE HARD CASE. v4 gave the counterintuitive case no worked
    example at all: it demonstrated the planned booking and then asked the
    rework booking cold, which is the section's entire payload. */
 {id:"spend.reworked", kind:"worked", state:FOXGLOVE, after:FOX_REWORK10, stillLabel:"DID NOT MOVE",
  title:"Now the same money, on work nobody planned.",
  setup:"Back to the start. Somebody books <b>{d.jtd}</b> of time to {job} again, the same figure as before.<br><br>This time it is rework. It was not in the plan, so the plan still holds everything it held before: there is still <b>{etc}</b> of work to come.<br><br>Watch the second box, because the whole difference is there.",
  button:"Follow it through",
  stages:[
   {cells:["jtd"], text:"<b>JTD COST</b> rises by {d.jtd}, to <b>{after.jtd}</b>.<br><br>Exactly as before. The money does not know why it was spent."},
   {cells:["etc"], text:"<b>ETC COST does not move.</b> Still {after.etc}.<br><br>This is the whole difference, and it is one box. The rework was not on the list of work still to come, so doing it took nothing off that list. Everything that was still to do is still to do."},
   {cells:["eac"], text:"<b>EAC COST rises</b>, {eac} to <b>{after.eac}</b>.<br><br>Last time the money crossed from one side to the other and this total held still. This time it was added to one side and nothing came off the other, so the job is now expected to cost more than it was."},
   {cells:["pct"], text:"Both halves of the fraction grew, so the percentage barely moves.{FRAC.after}<br><br>Compare that with the planned week, where only the top grew."},
   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is {after.pct} of the {fee} fee, so <b>{after.rev}</b>. Up about {d.rev}."},
   {cells:["profit"], text:"And here is the sting. The claim rose about {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT falls, {profit} to about {after.profit}</b>."},
   {cells:[], text:"<b>Both weeks side by side, which is the sentence to keep:</b><br><br>Identical {d.jtd} of money out of the door. In the planned week the forecast came off by the same amount, expected cost held still, and profit rose. In this week the forecast did not move, expected cost rose to {after.eac}, and profit fell to about {after.profit}.<br><br>Same work, same money, opposite result. <b>The forecast decided it.</b>"}
  ], src:["formula"]},

 {id:"spend.rework", kind:"choice", state:FOXGLOVE, after:FOX_REWORK10, fixed:true,
  q:"Same week, same <b>{d.jtd}</b> booked on {job}. Again it is rework nobody planned, so <b>ETC COST does not drop</b>: there is still {etc} of work left to do.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down.</b> EAC COST rises to {after.eac}, because the {d.jtd} was added and nothing came off the forecast. LIVE CALCULATED % COMP goes to {after.pct}, so CLAIMED REVENUE is {after.rev}.<br><br>The claim rose about {d.rev} while cost rose {d.jtd}, so <b>JTD PROFIT fell from {profit} to about {after.profit}</b>.<br><br><b>Identical cash out of the door. Opposite result.</b> The only difference was what happened to a forecast.",
  src:["formula","wholejob"]},

 {id:"spend.etcwhy", kind:"choice", state:FOXGLOVE,
  q:"Why does doing <b>planned</b> work push ETC COST down by the same amount it pushes JTD COST up?",
  opts:["Because ETC COST is a priced list of the work still to come, and a planned piece comes off that list at the price it was on it for",
        "Because the system holds EAC COST steady by design",
        "Because the Project Director adjusts the forecast to match",
        "Because the fee has not changed, so the totals have to balance"],
  a:0,
  why:"<b>Because ETC COST is a priced list.</b> Hours planned per person for the work still to come, priced at their internal rates, plus the expenses and sub-consultants still to come.<br><br>Do a planned piece of it and that piece leaves the list of work still to come and joins the record of work already done. Same hours, priced the same way, crossing from one column to the other. That is the entire reason EAC COST held still.<br><br>The second answer is the one to reject hardest. <b>Nothing holds EAC COST steady by design.</b> It held still because the two halves happened to move by the same amount, and you have just watched what happens when they do not.",
  src:["etclist"]},

 /* THE EXCEPTION, and the most useful arithmetic in the app. Nothing in v4
    could produce it, because no job in v4 was ever expected to overspend. */
 {id:"spend.losing", kind:"choice", state:MARLOW, after:MAR_PLAN, fixed:true,
  q:"A different job. <b>{job}</b> expects to cost <b>{eac}</b> against a fee of <b>{fee}</b>, and already shows <b>{profit}</b> of JTD PROFIT.<br><br>Somebody books <b>{d.jtd}</b> of time to it. It was <b>planned</b> work, so ETC COST drops by the same {d.etc} and EAC COST does not move at all.<br><br>You have just learned that spending on plan earns money. Which way does JTD PROFIT go here?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, to {after.profit}.</b> And this is the exception worth carrying out of the level.<br><br>Every step of the mechanism worked exactly as you learned it. Spending on plan pushed the percentage up, {pct} to {after.pct}, so the claim rose from {rev} to {after.rev}. Nothing misbehaved.<br><br><b>Now look at the rate.</b> The claim rose {d.rev} while cost rose {d.jtd}. Every dollar spent on this job claims back less than a dollar, because EAC COST of {after.eac} is above the fee of {fee}, and the ratio between those two <i>is</i> the margin.<br><br>So the rule is not “spending on plan earns money”. It is <b>“spending on plan earns money at the job's own margin”</b>. If that margin is negative, working to plan makes the reported loss bigger every week, and it will keep doing so until the fee or the forecast changes.",
  src:["formula"]},

 {id:"spend.explain", kind:"explain", state:FOXGLOVE, after:FOX_REWORK10,
  prompt:"Say it in your own words, as if to somebody who has never seen this app.<br><br><b>Why did the same {d.jtd} of booked time make the job more profitable in one case, and less profitable in the other?</b>",
  model:["The booked cost landed on JTD COST in both cases, so money spent rose by the same {d.jtd} either way.",
         "In the planned case, the forecast of remaining work (ETC COST) dropped by the same amount, so EAC COST, the total expected cost, did not change at all.",
         "The top of the fraction grew and the bottom stayed still, so LIVE CALCULATED % COMP rose, and CLAIMED REVENUE rose with it, by more than the cost did.",
         "In the rework case, ETC COST did not drop, so EAC COST rose too. The bottom of the fraction grew as well, so the percentage rose much less, and the claim rose by less than the cost.",
         "So the thing that decided the outcome was neither the work nor the money. It was what happened to a forecast.",
         "And the exception: on a job already expecting to cost more than its fee, even the planned case loses money, because every dollar spent claims back less than a dollar."]},

 {id:"spend.recap", kind:"concept", state:FOXGLOVE,
  title:"The level in three sentences.",
  body:"<b>Finishing work moves nothing.</b> There is nowhere on this page to record that a drawing went out of the door.<br><br><b>Spending money moves everything</b>, because what the firm claims is driven by cost spent over cost expected in total.<br><br><b>Whether spending helps or hurts depends on two things.</b> Whether the forecast of remaining work came off by the same amount, and whether the job expects to cost less than its fee. Planned work on a healthy job earns money. The same work on a job expecting to overspend loses money, every week, until something above the arithmetic changes.<br><br>That is the engine. The 400 level is about the one input into it that you set yourself."}
]},

/* ═════════ 400 LEVEL ═════════ */
{id:"forecast", level:400, layout:"core",
 name:"The Forecast Is Yours",
 line:"Move it, and money already claimed moves with it",
 warmN:2,
 warm:[
 {id:"forecast.warm.rework", kind:"choice", state:KESTREL, after:KES_REWORK, fixed:true,
  q:"Warm-up, on a job you have not used for this before. <b>{d.jtd}</b> of unplanned rework is booked to <b>{job}</b>, so ETC COST does not drop.<br><br>Which way does JTD PROFIT go?",
  opts:["Up","Down","It does not move"], a:1,
  why:"<b>Down, {profit} to {after.profit}.</b> Nothing came off the forecast, so EAC COST rose from {eac} to {after.eac}. Both halves of the fraction grew, the claim only rose {d.rev}, and cost rose {d.jtd}."},

 {id:"forecast.warm.nothing", kind:"select", state:KESTREL, after:KESTREL,
  q:"Warm-up. <b>{job}</b> issues its full drawing set today. A real milestone, out of the door.<br><br><b>Tap every field that moves.</b>",
  why:"<b>Nothing moves.</b> No cost changed, so nothing the board calculates changed. There is nowhere on this page to record that the drawings went out."},

 {id:"forecast.warm.profit", kind:"compute", state:MARLOW, field:"profit",
  q:"Warm-up. <b>{job}</b> claims <b>{rev}</b> and has spent <b>{jtd}</b>.<br><br>What is JTD PROFIT? A minus sign is allowed.",
  hint:"claimed minus spent",
  why:"<b>{profit}.</b> Claimed minus spent, and on this job that comes out negative, because expected cost of {eac} is above the {fee} fee."},

 {id:"forecast.warm.fee", kind:"choice", state:KESTREL,
  q:"Warm-up. What has to happen for the fee on the whole <b>project</b> to change?",
  opts:["The client agrees it in writing, normally through an Additional Service Request",
        "The Project Director revises it at the monthly plan review",
        "Finance recalculates it at month end",
        "It rises automatically once expected cost passes it"],
  a:0,
  why:"<b>The client agrees it in writing.</b> A Partner signs the Additional Service Request, and the firm's instruction is not to start the work until written approval is in.",
  src:["fee"]}
 ],
 steps:[

 /* THE HONEST FRAME COMES FIRST. v4 demonstrated for four screens that a
    number he controls invents income, and only then said it was serious. The
    takeaway as sequenced was "the number is fake and I can move it". */
 {id:"forecast.intro", kind:"concept",
  title:"One number here is not a fact, and it is the most serious thing on the page.",
  body:"FEE is contracted. JTD COST is a record of what was actually spent, down to the timesheet line.<br><br><b>ETC COST is a forecast.</b> Somebody's estimate of what is still to come, and on your projects that somebody is you.<br><br><b>Here is the serious part, before the demonstration rather than after it.</b> A cost forecast is the only proxy for progress this system has. Nothing on this page looks at a drawing, so the forecast is doing the entire job of saying where the work has actually got to.<br><br>That is why the firm puts a control around it and asks for it reviewed and signed off every month. What follows shows you exactly how much a revision moves, in both directions. Read it as a description of your own responsibility, not as a loophole.",
  src:["plan"]},

 {id:"forecast.worked", kind:"worked", state:FOXGLOVE, after:FOX_ETC10, stillLabel:"DID NOT MOVE",
  title:"Change only the forecast. Change nothing real.",
  setup:"{job} is going far better than expected. You decide only {after.etc} of work is left, not {etc}.<br><br>You spend nothing. You deliver nothing. You change one thing: your view of the work still to come.",
  button:"Follow it through",
  stages:[
   {cells:["etc"], text:"<b>ETC COST</b> goes {etc} to <b>{after.etc}</b>. That is the only thing you touched."},
   {cells:["jtd"], text:"<b>JTD COST did not move.</b> {jtd} spent, before and after.<br><br>Keep your eye on this one. It is the field telling the truth."},
   {cells:["eac"], text:"<b>EAC COST</b> falls {eac} to <b>{after.eac}</b>, because it is only ever the two numbers above it added together."},
   {cells:["pct"], text:"The same money spent on top. A much smaller number underneath.{FRAC.after}"},
   {cells:["rev"], text:"{after.pct} of the {fee} fee is <b>{after.rev}</b> of CLAIMED REVENUE, up from {rev}."},
   {cells:["profit"], text:"<b>JTD PROFIT goes {profit} to {after.profit}.</b><br><br>The firm just recorded <b>{d.profit} of income because you revised an opinion.</b> No work was done. No invoice went out. Nobody spoke to the client."},
   {cells:[], text:"<b>The whole move in one line:</b><br><br>The forecast of remaining work went {etc} to {after.etc}. Nothing else was touched. Expected cost fell {eac} to {after.eac}, the same money spent now sits over a smaller total so the percentage rose {pct} to {after.pct}, the claim rose {rev} to {after.rev}, and profit went {profit} to {after.profit}.<br><br>Money spent: unchanged at {jtd}, before and after. That is the field telling the truth."}
  ], src:["formula","wholejob"]},

 {id:"forecast.raise", kind:"choice", state:FOXGLOVE, after:FOX_ETC90, fixed:true,
  q:"Back to where {job} started, with {etc} forecast still to spend. You now conclude the job will take longer, and you raise ETC COST from {etc} to {after.etc}. You touch nothing else.<br><br>Which way does CLAIMED REVENUE go?",
  opts:["Up","Down","It does not move, because no work changed"], a:1,
  why:"<b>Down.</b> EAC COST rises to {after.eac}, so LIVE CALCULATED % COMP falls from {pct} to {after.pct}, and CLAIMED REVENUE falls from {rev} to {after.rev}.<br><br><b>The firm has just un-earned {d.rev}</b>, in a month when nobody did anything differently.",
  src:["formula","wholejob"]},

 {id:"forecast.movers", kind:"select", state:FOXGLOVE, after:FOX_ETC90,
  q:"The same move. ETC COST goes from {etc} to {after.etc}, and nothing else is touched.<br><br><b>Tap every field that reads differently afterwards, including the one you changed yourself.</b>",
  why:"<b>{nmovers} fields move: {lmovers}.</b><br><br><b>JTD COST does not, and that is the one to watch.</b> Money actually spent is unchanged at {jtd}. Work delivered is unchanged. The client is unchanged.<br><br>What the firm claims fell {d.rev} anyway, and <b>JTD PROFIT is now {after.profit}</b>: the whole paper profit, gone, in a month when nobody did anything differently.",
  src:["formula","wholejob"]},

 {id:"forecast.cut", kind:"choice", state:FOX_ETC90, after:FOX_ETC30,
  q:"A month later {job} goes better than feared, and you cut ETC COST from {etc} down to {after.etc}.<br><br>What happens to CLAIMED REVENUE?",
  opts:["It rises to {after.rev}",
        "It stays at {rev}. You cannot un-claim income you have already lost",
        "It falls to {profit}, because cutting the forecast cuts what there is left to claim",
        "It does not move until the job closes and the {fee} fee is settled up"],
  a:0,
  why:"<b>It rises to {after.rev}.</b> LIVE CALCULATED % COMP jumps from {pct} to {after.pct}, because the same money spent now sits over a much smaller expected total.<br><br>That is {d.rev} more than last month, off a forecast revision and nothing else.<br><br><b>The lever works both ways.</b> It is not a penalty box, it is a live wire. Raising the forecast un-claims money; cutting it claims money back. Both happen in a month where nobody did anything differently, and both are your signature.",
  src:["formula","wholejob"]},

 /* THE ONE THAT MATTERS, and the reason the framing had to move to the front
    of the level. Cutting Marlow's forecast to this exact figure puts expected
    cost at the fee and the loss at zero, so the temptation is arithmetically
    perfect and the answer is still not "yes". */
 {id:"forecast.fix", kind:"choice", state:MARLOW, after:MAR_ETCFIX,
  q:"<b>{job}</b> is showing <b>{profit}</b> of JTD PROFIT, because it expects to cost {eac} against a fee of {fee}.<br><br>You could make that loss disappear this month by cutting ETC COST from {etc} to <b>{after.etc}</b>. That would put expected cost at {after.eac}, exactly the fee, and JTD PROFIT at <b>{after.profit}</b>.<br><br>Nothing about the work has changed. Should you?",
  opts:["Only if the remaining work really will cost {after.etc}. The forecast is a statement about the work, not a dial for the result",
        "Yes. The loss is an artifact of a cautious forecast, and taking it out makes the report more accurate",
        "Yes, but the client has to be told first",
        "No. A forecast must never be revised downwards"],
  a:0,
  why:"<b>Only if it is true.</b><br><br>The arithmetic is perfect and that is exactly the problem. Cutting the forecast to {after.etc} puts expected cost at {after.eac}, precisely the {fee} fee, and JTD PROFIT at {after.profit}. The loss vanishes and nobody had to do anything.<br><br>Which is why the firm's instruction on this is one sentence long: <b>do not manage the adjustment, fix the project data.</b> If the work left genuinely will cost {after.etc}, then the old forecast was wrong and correcting it is your job. If it will not, you have moved this month's number and next month it comes back larger, because the money still has to be spent.<br><br>The fourth answer is wrong too, and worth saying so out loud: forecasts get revised downwards all the time and should be. <b>The test is never the direction. It is whether the number is a description of the work.</b>",
  src:["plan"]},

 {id:"forecast.ugly", kind:"compute", state:MAR_ETCUP, field:"rev",
  q:"Different month, same job. <b>{job}</b> has now spent <b>{jtd}</b> and has raised its forecast to <b>{etc}</b> still to go. The fee is <b>{fee}</b>.<br><br>What is CLAIMED REVENUE?",
  hint:"spent, over expected in total, times the fee. You can type the whole sum as one expression and it will work it out.",
  why:"<b>{rev}.</b> Spent {jtd} over an expected total of {eac} is {pct}, and {pct} of the {fee} fee is {rev}.<br><br>JTD PROFIT is now {profit}. Nothing was spent between the last screen and this one. The forecast went up, so the claim came down, so the loss got bigger. That is the whole lever, on a number that does not land anywhere tidy.",
  src:["formula"]},

 {id:"forecast.explain", kind:"explain", state:FOXGLOVE, after:FOX_ETC90,
  prompt:"A colleague looks at the month-end sheet and says <b>“we lost {d.rev} on {job} this month.”</b> You check, and nothing changed except ETC COST.<br><br><b>In your own words, what do you tell them?</b>",
  model:["Nothing was actually lost. No extra money was spent, and no work was undone.",
         "The forecast of remaining cost, ETC COST, was raised from {etc} to {after.etc}.",
         "That raised EAC COST, the total expected cost, from {eac} to {after.eac}.",
         "LIVE CALCULATED % COMP is money spent divided by money expected in total, so a bigger bottom number makes the percentage fall, from {pct} to {after.pct}.",
         "CLAIMED REVENUE is that percentage times the fee, so it fell too, from {rev} to {after.rev}. That fall is the {d.rev} they are looking at.",
         "So the right question is not “what went wrong this month”. It is “is the new forecast right”.",
         "And if it is right, nothing needs explaining away. The job really is going to cost more, and we have just found out in the month we found out."]},

 {id:"forecast.close", kind:"concept",
  title:"The part no puzzle can teach.",
  body:"You have now seen that one number, which you set yourself, moves what the firm claims in either direction, with no change at all in the work.<br><br>That is why Buro Happold puts a control around it. The Project Director reviews progress with the Job Leads by the <b>23rd</b> of the month to make sure the plans are accurate, and signs off the ETC on every job plan as part of the Project Director Checklist by the <b>25th</b>. Before a plan is changed, the change gets laid out for the relevant people first. And when a number looks wrong, the firm's instruction is one line: <b>do not manage the adjustment, fix the project data.</b><br><br>Shading a forecast is a real decision, not a technicality. <b>There is no test at the end of this level, because the test happens every month.</b>",
  src:["plan"]}
]},

/* ═════════ 500 LEVEL ═════════
   Moved down two levels in v5 (it was the 300 level in v4).
   Moved out of the 100 level in v4 on 260803. Two reviewers disagreed on
   the surface and agreed underneath: the section is well built and it
   was in the wrong place. It is a second, competing schema, and its
   presence forced INV and WIP onto the board through eighteen steps
   where they did nothing. The board only grows to nine cells here. */
{id:"billing", level:500, layout:"full",
 name:"Claimed and Billed",
 line:"Two numbers, two schedules, and the gap between them",
 warmN:2,
 warm:[
 {id:"billing.warm.etc", kind:"choice", state:KESTREL, after:KES_ETCDOWN, fixed:true,
  q:"Warm-up. You cut <b>{job}</b>'s ETC COST from {etc} to {after.etc} because the job is going better than expected. You spend nothing and deliver nothing.<br><br>Which way does CLAIMED REVENUE go?",
  opts:["Up","Down","It does not move, because no work changed"], a:0,

 {id:"billing.warm.watch", kind:"select", state:KESTREL, after:KES_ETCDOWN,

 {id:"billing.warm.loss", kind:"choice", state:MARLOW,
