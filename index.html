<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Puzzles">
<meta name="theme-color" content="#f4f6f9">
<meta name="robots" content="noindex, nofollow">
<title>Money Puzzles</title>
<style>
/* LIGHT MODE IS FORCED. There is deliberately no prefers-color-scheme block.
   ONE LAYOUT AT EVERY WIDTH. There is deliberately no width media query.
   Sizes scale with clamp(); nothing ever rearranges, hides or reflows. */
:root{
  color-scheme:light only;
  --bg:#f4f6f9; --panel:#ffffff; --calc:#eef3f9;
  /* --line and --rule are BORDER tokens. Never use either as a text colour. */
  --line:#d7e0ea; --rule:#8b95a1; --cellline:#8a8f96;   /* --rule and --cellline
     carry operable-component boundaries and are measured at 3.06:1 and 3.25:1
     against the panel. --line is decorative dividers only. */
  --ink:#0e151d; --body:#31414f; --dim:#4d5d70;
  --up:#15803d; --upbg:#e9f9ef; --upline:#5e9975;
  --down:#b91c1c; --downbg:#fdeeee; --downline:#b97b7b;
  --hot:#a16207; --hotbg:#fdf6e3; --hotline:#a18b53;
  --acc:#1d4ed8; --accbg:#e8effd;
  --dark:#16202b; --darkink:#eaf0f7; --darkdim:#a9bccf;
  --judge:#0e151d;
  --footh:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;touch-action:manipulation}
button{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#right.teach :focus-visible{outline-color:var(--darkink)}

/* ---------- error banner ---------- */
#err{display:none;background:var(--down);color:#fff;font-size:13.5px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  line-height:1.5;position:sticky;top:0;z-index:60}
#err b{display:block;font-size:15px;margin-bottom:5px}
#err ul{margin:6px 0 0 18px}

/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.t{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:650}
.t.f{font-weight:500;font-size:10px;letter-spacing:.03em;color:var(--dim);opacity:.85}
.topbtn{margin-left:auto;background:none;border:1px solid var(--rule);color:var(--dim);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
  padding:8px 13px;border-radius:99px;cursor:pointer;min-height:44px}

#stage{display:flex;flex-direction:column;align-items:center;width:100%;
  padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
  padding-bottom:calc(var(--footh) + env(safe-area-inset-bottom) + 14px)}
#left{width:100%;max-width:680px;padding:12px 0 4px}
#right{width:100%;max-width:680px;border-radius:12px;display:flex;flex-direction:column;
  padding:0;gap:0;margin:8px 0 14px;overflow:hidden;border:1px solid var(--line);
  background:var(--panel);box-shadow:0 1px 2px rgba(16,25,40,.05)}

/* ---------- page shape: TEACHING (dark) vs ASKING (white) ---------- */
#right.teach{background:var(--dark);border-color:var(--dark)}
#right.ask{border-left:5px solid var(--acc)}
.band{padding:9px 14px;font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.band.teach{background:rgba(255,255,255,.07);color:var(--darkdim)}
.band.ask{background:var(--acc);color:#fff}
#panel{padding:14px;display:flex;flex-direction:column;gap:10px}
#right.teach #panel{color:var(--darkink)}
#right.teach .body{color:var(--darkink)}
#right.teach .body b{color:#fff}
#right.teach h1{color:#fff}
#right.teach .src{border-top-color:rgba(255,255,255,.18);color:var(--darkdim)}
h1{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.015em}
.body{font-size:15.5px;color:var(--body);line-height:1.55;max-width:64ch}
.body b{color:var(--ink);font-weight:700}
.stagen{font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;
  color:var(--darkdim)}

/* ---------- board ---------- */
#board{display:flex;flex-direction:column;gap:6px}
.jobname{font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:0 2px 5px}
.brow{display:flex;gap:6px;align-items:stretch}
.cell{flex:1 1 0;min-width:0;background:var(--panel);border:1.5px solid var(--cellline);
  border-radius:9px;position:relative;transition:background .18s,border-color .18s}
.cell.calc{background:var(--calc);border-style:dashed}
.cellhit{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 10px 8px 9px;border-radius:8px;color:inherit;min-height:58px}
.cell.hasq .cellhit{padding-right:32px}
.cellhit .k{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);font-weight:750;line-height:1.2}
.cellhit .s{display:block;font-size:11.5px;font-weight:650;color:var(--body);line-height:1.25;
  margin-top:2px}
.cellhit .v{display:block;font-size:clamp(14px,4.3vw,21px);font-weight:700;margin-top:4px;
  letter-spacing:-.015em;white-space:nowrap;color:var(--ink)}
.cellhit .v.mask{color:var(--dim);letter-spacing:.14em}
.was{display:block;font-size:10.5px;color:var(--body);font-weight:650;margin-top:-2px;
  padding:0 10px 8px 9px;line-height:1.3}
.cell.hasq .was{padding-right:32px}
.cellq{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:99px;
  border:1.5px solid var(--rule);background:var(--panel);color:var(--dim);font-size:12px;
  font-weight:750;cursor:pointer;line-height:1;display:flex;align-items:center;
  justify-content:center;padding:0}
.op{display:flex;align-items:center;justify-content:center;color:var(--body);
  font-size:clamp(15px,4vw,19px);font-weight:650;flex:0 0 auto;padding:0 1px}

/* channel 1 — HUE = direction the data moved */
.cell.up{border-color:var(--upline);background:var(--upbg)}
.cell.down{border-color:var(--downline);background:var(--downbg)}
.cell.still{border-color:var(--hotline);background:var(--hotbg)}
/* channel 2 — HEAVY BLACK BORDER = you chose this. Persists through the reveal. */
.cell.chosen{border-color:var(--judge);border-width:3px;border-style:solid}
/* channel 3 — ACHROMATIC BADGE = right, wrong, missed */
.chip{position:absolute;top:-9px;right:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;color:#fff;white-space:nowrap}
.chip.up{background:var(--up)} .chip.down{background:var(--down)} .chip.still{background:var(--hot)}
.badge{position:absolute;top:-9px;left:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;white-space:nowrap;
  background:var(--judge);color:#fff;border:1.5px solid var(--judge)}
.badge.missed{background:var(--panel);color:var(--judge);border-style:dashed}
.badge.wrong{background:var(--panel);color:var(--judge)}
.lphint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.flash{animation:flash .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fadein .28s ease}
@media(prefers-reduced-motion:reduce){.flash,.fade{animation:none}}

/* ---------- verdict ---------- */
.verdict{margin:-14px -14px 2px;padding:13px 14px;font-size:20px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:#fff}
.verdict.y{background:var(--up)} .verdict.n{background:var(--down)}
.verdict.s{background:var(--judge)}
.tally{font-size:13px;color:var(--dim);font-weight:650}

/* ---------- inputs ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel);border:1.5px solid var(--rule);color:var(--ink);
  padding:13px 14px;border-radius:9px;cursor:pointer;font-size:15.5px;min-height:50px}
.opt.right{border-color:var(--up);background:var(--upbg);font-weight:700}
.opt.wrong{border-color:var(--down);background:var(--downbg)}
.opt.chosen{border-color:var(--judge);border-width:3px}
.opt:disabled{cursor:default;opacity:.72}
.numin{font-size:20px;font-weight:700;padding:13px 14px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;max-width:280px;min-height:54px;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel)}
.numin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.txtin{font:inherit;font-size:15.5px;line-height:1.5;padding:12px 13px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;min-height:130px;color:var(--ink);
  background:var(--panel);resize:vertical}
.txtin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.hint{font-size:13.5px;color:var(--dim)}
.warn{font-size:14px;color:var(--ink);background:var(--hotbg);border:1.5px solid var(--hotline);
  border-radius:8px;padding:10px 12px;font-weight:650}
.model{border:1.5px solid var(--line);border-radius:9px;padding:12px 13px;background:var(--calc)}
.model ul{margin:6px 0 0 18px;color:var(--body);font-size:15px;line-height:1.55}
.model li{margin-bottom:7px}
.model .h{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.confirm{border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;
  padding:11px 13px;font-size:14px;line-height:1.55;color:var(--body);background:var(--accbg)}
.confirm .h{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--acc);display:block;margin-bottom:4px}
details.src{font-size:13.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
details.src summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  min-height:44px;font-weight:650}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:"\25B8"}
details.src[open] summary::after{content:"\25BE"}
details.src p{margin-top:6px;line-height:1.55;color:var(--body)}
#right.teach details.src p{color:var(--darkdim)}

/* ---------- section map ---------- */
#map{width:100%;max-width:680px;padding:16px 0 20px;display:flex;flex-direction:column;gap:10px}
.maphead{font-size:21px;font-weight:700;letter-spacing:-.015em}
.mapsub{font-size:14px;color:var(--body);line-height:1.55}
.lvlhead{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:800;margin-top:14px}
.lvlhead span{color:var(--body);font-weight:600;letter-spacing:.01em;text-transform:none;font-size:12.5px}
.sec{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:11px;padding:13px 14px;cursor:pointer;text-align:left;width:100%;min-height:66px}
.sec.locked{cursor:default;background:#eef1f5}
.sec.done{border-color:var(--upline)}
.secnum{width:32px;height:32px;border-radius:99px;background:var(--calc);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
.sec.done .secnum{background:var(--up);color:#fff}
.sec.now .secnum{background:var(--acc);color:#fff}
.sec.locked .secnum{background:#dfe5ec;color:var(--dim)}
.secbody{flex:1 1 auto;min-width:0}
.secname{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.secline{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}
.secprog{font-size:11.5px;color:var(--dim);font-weight:750;flex:0 0 auto;white-space:nowrap;
  text-align:right;max-width:82px;line-height:1.3}

/* ---------- the one fixed action bar. Same place on every screen. ---------- */
.resetlink{margin:18px auto 0;background:none;border:0;color:var(--dim);font-size:13px;
  font-weight:600;text-decoration:underline;cursor:pointer;padding:12px;min-height:44px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));min-height:var(--footh)}
#foot .spacer{flex:1 1 auto}
.btn{background:var(--acc);color:#fff;border:0;padding:13px 22px;border-radius:9px;
  font-weight:700;font-size:15.5px;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--dim);border:1.5px solid var(--rule);font-weight:600;
  padding:13px 16px}
.btn.dark{background:var(--judge)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- definition dialog ---------- */
#defWrap{display:none;position:fixed;inset:0;background:rgba(14,21,29,.5);z-index:70;
  align-items:center;justify-content:center;padding:24px}
#defBox{background:var(--panel);border-radius:14px;padding:20px;max-width:430px;width:100%;
  box-shadow:0 8px 40px rgba(14,21,29,.35);font-size:15.5px;line-height:1.6;color:var(--body)}
#defBox b{color:var(--ink);font-weight:700}
</style>
</head>
<body>

<div id="err" role="alert"></div>

<div id="bar">
  <span class="t">Money Puzzles</span>
  <span class="t f" id="ver"></span>
  <button class="topbtn" id="topbtn" type="button" onclick="goMap()">All sections</button>
</div>

<div id="stage">
  <div id="map"></div>
  <div id="left" style="display:none">
    <div id="board"></div>
    <div class="lphint">Tap the <b>?</b> on any field for a plain-English reminder of what it means</div>
  </div>
  <div id="right" style="display:none">
    <div class="band" id="band"></div>
    <div id="panel"></div>
  </div>
</div>

<div id="foot"></div>

<div id="defWrap" role="dialog" aria-modal="true" aria-labelledby="defBody">
  <div id="defBox">
    <div id="defBody"></div>
    <button class="btn" id="defClose" type="button" style="margin-top:14px">Got it</button>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   PART 1 — THE MODEL
   Nine fields. Three arrive from outside the page, six are arithmetic.
   derive() is the ONLY place a value is ever produced. Nothing below
   may re-type a figure that derive() can compute.
   Board order here is CALCULATION order, not the order printed on the
   real Traffic Light Report, which runs FEE, % COMP, CLAIMED REVENUE,
   INV, WIP, then TIME COST, SUBS & EXP, JTD COST, ETC COST, EAC COST,
   JTD PROFIT. Calculation order is easier to learn. Confirmed by Josh
   260803. A later section should walk the real page so the translation
   is taught rather than assumed.
   ═══════════════════════════════════════════════════════════════════ */
const money = n => (n<0?"−$":"$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const pctS  = n => (n*100).toFixed(1) + "%";

function derive(s){
  const eac = s.jtd + s.etc;
  const pct = eac ? s.jtd/eac : 0;
  const rev = pct * s.fee;
  return {name:s.name, fee:s.fee, jtd:s.jtd, etc:s.etc, inv:s.inv,
          eac, pct, rev, wip:rev - s.inv, profit:rev - s.jtd};
}

const CELLS=[
 {id:"fee", k:"FEE", fmt:"money",
  def:"<b>FEE.</b> The price agreed for the work.<br><br>At <b>project</b> level that is what the signed contract says, and it changes only if the contract does, normally through an Additional Service Request.<br><br>On an individual <b>job</b> inside that project, the fee is the slice of the total allocated to it — and that slice can be moved between jobs, or drawn from the project's contingency, without the client contract changing at all.<br><br>On the real report the column is headed <b>FEE</b>, not \"contract\"."},
 {id:"jtd", k:"JTD COST", sub:"JOB TO DATE", fmt:"money",
  def:"<b>JTD COST</b> is short for <b>job to date cost</b>: money already spent on this job.<br><br><b>Nobody types this total in.</b> It accumulates on its own — every hour anybody books to the job in their timesheet, plus every sub-consultant invoice and expense.<br><br>On the real report it is two columns added together: <b>TIME COST</b> (the timesheet hours) plus <b>SUBS &amp; EXP</b> (sub-consultants and expenses)."},
 {id:"etc", k:"ETC COST", sub:"ESTIMATE TO COMPLETE", fmt:"money",
  def:"<b>ETC COST</b> is short for <b>estimate to complete</b>: the forecast of what is still left to spend before the job finishes.<br><br><b>This is the only number on the board that is an opinion rather than a record</b>, and on your own jobs the opinion is yours."},
 {id:"eac", k:"EAC COST", sub:"JTD + ETC", fmt:"money", calc:1,
  def:"<b>EAC COST</b> is short for <b>estimate at completion</b>: what the job is expected to cost in total, start to finish.<br><br>Money already spent, plus the forecast of what is left. Nothing more than those two added together."},
 {id:"pct", k:"LIVE CALCULATED % COMP", sub:"JTD ÷ EAC", fmt:"pct", calc:1,
  def:"<b>LIVE CALCULATED % COMP</b> is short for <b>live calculated percent complete</b>: money spent, divided by money expected to be spent in total.<br><br><b>It is not how much of the work is finished.</b> Nothing on this board looks at the drawings. A job that has burned half its budget reads 50% whether the drawings are done or barely started."},
 {id:"rev", k:"CLAIMED REVENUE", sub:"% COMP × FEE", fmt:"money", calc:1,
  def:"<b>CLAIMED REVENUE.</b> What the firm reports it has earned on this job so far: the percentage above, applied to the fee.<br><br>\"Claimed\" is the real column heading, not a word invented for this app. It is also the number people mean when they say the job has <b>earned</b> something."},
 {id:"inv", k:"INV", sub:"INVOICED", fmt:"money",
  def:"<b>INV</b> is short for <b>invoiced</b>: what has actually been billed to the client so far.<br><br>It moves on its own schedule — the invoice schedule set up on the project — and not on the cost calculation above it. People also say <b>billed</b> for this."},
 {id:"wip", k:"WIP", sub:"REVENUE − INV", fmt:"money", calc:1,
  def:"<b>WIP</b> is short for <b>work in progress</b>: money the firm says it has earned but has not yet asked the client for.<br><br>Claimed revenue minus invoiced. The gap between what has been earned on paper and what has been billed."},
 {id:"profit", k:"JTD PROFIT", sub:"REVENUE − JTD", fmt:"money", calc:1,
  def:"<b>JTD PROFIT</b> is short for <b>job to date profit</b>: what the firm says it earned, minus what it actually spent.<br><br>It is a profit on paper. The earning half of it comes out of a calculation, not out of anybody's bank account."}
];
const CMAP = Object.fromEntries(CELLS.map(c=>[c.id,c]));
const fmtVal = (c,v) => c.fmt==="pct" ? pctS(v) : money(v);

/* Board layout is DATA. A section names a layout; the engine draws it.
   The first four sections run on seven cells. INV and WIP do not exist
   on the board until the section that teaches them. */
const LAYOUTS={
  core:[["fee"],["jtd","+","etc","=","eac"],["pct","rev"],["profit"]],
  full:[["fee"],["jtd","+","etc","=","eac"],["pct","rev"],["inv","wip","profit"]]
};
const visibleIds = key => LAYOUTS[key].flat().filter(x=>CMAP[x]);

/* ═══════════════════════════════════════════════════════════════════
   PART 2 — THE JOBS
   Two invented jobs. No relation to any real Buro Happold project and
   every figure is made up. Change a literal here and every number in
   every sentence of the app follows it, because nothing is typed twice.
   ═══════════════════════════════════════════════════════════════════ */
const FOXGLOVE = {name:"Foxglove Library",   fee:100000, jtd:40000, etc:40000, inv:30000};
const SANDPIPER= {name:"Sandpiper Pavilion", fee:200000, jtd:25000, etc:75000, inv:0};

const FOX_PLAN4    = {...FOXGLOVE, jtd:44000, etc:36000};
const FOX_PLAN10   = {...FOXGLOVE, jtd:50000, etc:30000};
const FOX_REWORK10 = {...FOXGLOVE, jtd:50000, etc:40000};
const FOX_ETC10    = {...FOXGLOVE, etc:10000};
const FOX_ETC60    = {...FOXGLOVE, etc:60000};
const FOX_ETC30    = {...FOXGLOVE, etc:30000};
const FOX_INV45    = {...FOXGLOVE, inv:45000};
const FOX_INV40    = {...FOXGLOVE, inv:40000};

const SRC={
 formula:{t:"Slide 39 of an official internal Buro Happold deck states it directly: revenue equals cost spent to date, divided by total cost expected by the end, multiplied by the fee.<br><br>Two qualifiers, from the same slide. This is how <b>lump-sum</b> jobs work, which that deck puts at 90 to 95% of the firm's work; time-and-materials jobs recognise revenue as hours booked times an agreed billing rate instead. And that deck predates the May 2026 FRS 102 change, although the April 2026 FRS deck confirms this calculation itself continues unchanged."},
 names:{t:"These are the real column headings off the <b>Traffic Light Report</b> — the Vantagepoint report a Project Director works from, which lands daily. They are the words used in the room, not plainer substitutes invented for this app.<br><br>Worth knowing before you quote them: the <b>monthly</b> project accounts sheet uses different words for several of these same numbers. Translating between the two reports is its own lesson."},
 wholejob:{callout:true, h:"Two answers, not one",

   No answer key is ever written down. Every asserted value is produced
   by derive() at render time, from the same state the board draws from.
   ═══════════════════════════════════════════════════════════════════ */
const BUILD = "v4.1 · built 260803 1739 ET";

const ALLSTEPS = SECTIONS.flatMap((s,i)=>s.steps.map(st=>({...st, _sec:i})));
const SECOF = {}; SECTIONS.forEach((s,i)=>s.steps.forEach(st=>{SECOF[st.id]=i;}));
const layoutOf = step => SECTIONS[SECOF[step.id]].layout;

function fracHTML(s){
  const box='display:inline-flex;flex-direction:column;align-items:center;text-align:center';
  const lbl='font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.75';
  const num='font-size:14.5px;font-weight:800;padding:3px 10px';
  return '<span style="display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap">'
    +'<span style="'+box+'">'
    +'<span style="'+lbl+'">money spent</span>'
    +'<span style="'+num+'">'+money(s.jtd)+'</span>'
    +'<span style="border-top:2px solid currentColor;align-self:stretch"></span>'
    +'<span style="'+num+'">'+money(s.eac)+'</span>'
    +'<span style="'+lbl+'">money expected in total</span></span>'
    +'<span style="font-size:19px;font-weight:800">= '+pctS(s.pct)+'</span></span>';
}

function moversFor(step){
  const vis = visibleIds(layoutOf(step));
  if(!step.state) return [];
  const a=derive(step.state), b=derive(step.after||step.state);
  return vis.filter(id=>Math.abs(b[id]-a[id])>0.005);
}
function answerIds(step){
  return step.mode==="identify" ? step.ids.slice() : moversFor(step);
}
function computeAnswer(step){ return derive(step.state)[step.field]; }

function tokenValue(tok, step){
  if(tok==="job")     return step.state ? (derive(step.state).name||"") : undefined;
  if(tok==="FRAC")    return step.state ? fracHTML(derive(step.state)) : undefined;
  if(tok==="FRAC.after") return step.state ? fracHTML(derive(step.after||step.state)) : undefined;
  if(tok==="nmovers") return String(moversFor(step).length);
  if(tok==="lmovers"){
    const names=moversFor(step).map(id=>CMAP[id].k);
    if(!names.length) return "nothing";
    return names.length===1 ? names[0]
      : names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  }
  const m=/^(after\.|d\.)?([a-z]+)$/.exec(tok);
  if(!m || !CMAP[m[2]] || !step.state) return undefined;
  const c=CMAP[m[2]], a=derive(step.state), b=derive(step.after||step.state);
  if(m[1]==="after.") return fmtVal(c, b[m[2]]);
  if(m[1]==="d.")     return fmtVal(c, Math.abs(b[m[2]] - a[m[2]]));
  return fmtVal(c, a[m[2]]);
}
function expand(txt, step){
  if(txt==null) return txt;
  return String(txt).replace(/\{([A-Za-z][A-Za-z.]*)\}/g, (m,tok)=>{
    const v = tokenValue(tok, step);
    if(v===undefined) throw new Error("unresolved token "+m+" on step "+step.id);
    return v;
  });
}

/* ---------- progress. Keyed on stable string ids, never on position. ---------- */
const KEY="mp_v4", SAVEV=4;
let ST={}, HW=0;
(function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    /* accept any payload at or below this version and MIGRATE it rather than
       dropping it. Progress is keyed on stable step ids, so carrying it
       forward is safe; silently wiping weeks of three-minute sessions on a
       version bump is not. */
    if(raw && raw.st && typeof raw.v==="number" && raw.v<=SAVEV){
      const known=new Set(ALLSTEPS.map(s=>s.id));
      for(const k in raw.st) if(known.has(k)) ST[k]=raw.st[k];   // unknown ids dropped
      HW = Math.min(Math.max(0, raw.hw|0), SECTIONS.length-1);
    }
  }catch(e){}
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({v:SAVEV, st:ST, hw:HW})); }catch(e){} }
function rec(id, patch){ ST[id]=Object.assign({}, ST[id], patch); save(); }

const isScored = st => st.kind==="choice" || st.kind==="select" || st.kind==="compute";
function secStat(i){
  const steps=SECTIONS[i].steps;
  const sc=steps.filter(isScored);
  const right=sc.filter(s=>ST[s.id] && ST[s.id].a===1).length;
  const seenAll=steps.every(s=>ST[s.id] && ST[s.id].v);
  return {n:sc.length, right, seenAll, complete: seenAll && right===sc.length};
}
/* Unlocking is a HIGH-WATER MARK and is never revoked. It used to be
   recomputed live, so backing into a finished section and fumbling one retry
   re-locked everything downstream and the map rendered a green tick, the word
   "Locked" and "finish the section above first" on the same row. */
function bumpHW(){
  for(let i=0;i<SECTIONS.length;i++) if(secStat(i).complete && i+1>HW) HW=Math.min(i+1,SECTIONS.length-1);
  save();
}
const unlocked = i => i===0 || i<=HW || secStat(i-1).complete;
function firstUnfinished(i){
  const steps=SECTIONS[i].steps;
  let found=-1;
  for(let k=0;k<steps.length;k++){
    const st=steps[k], r=ST[st.id];
    if(!r || !r.v){ found=k; break; }
    if(isScored(st) && r.a!==1){ found=k; break; }
  }
  if(found<0) return 0;
  const st=steps[found], r=ST[st.id];
  /* NEVER re-open on a question he has already got wrong. After a gap the
     app's first act was to re-administer the test he failed, which is the
     worst possible opening move for task initiation. Walk back to the nearest
     teaching card in this section so he arrives warm and walks in on his own
     momentum. */
  if(isScored(st) && r && r.a===0){
    for(let j=found-1;j>=0;j--)
      if(steps[j].kind==="concept" || steps[j].kind==="worked") return j;
  }
  return found;
}

/* ═══════════════════════════════════════════════════════════════════
   PART 5 — THE BOARD
   Three visual channels, never crossed:
     HUE           the direction the data moved (green up, red down,
                   amber deliberately unchanged)
     HEAVY BORDER  you chose this cell. Survives the reveal.
     BADGE         right, wrong, missed. Achromatic on purpose, so it
                   can sit on a red or green cell and still be read.
   ═══════════════════════════════════════════════════════════════════ */
const MASK="•••••";
const $ = id => document.getElementById(id);
let lastTrigger=null, lpTimer=null, suppressUntil=0;
const CALC_IDS = CELLS.filter(c=>c.calc).map(c=>c.id);

/* WHAT IS HIDDEN ON A QUESTION SCREEN, and why it changed.
   v4.0 masked the whole board. That removed information the learner needed
   and gave nothing back: on the two hardest questions in the app the answer
   turns on the fee and the total expected cost, and v4.0 had both hidden and
   neither restated in the question, so the only way through was to pattern-
   match the worked example — which is the exact failure masking existed to
   prevent. Now only the DASHED calculated cells are hidden. Showing the three
   that arrive from outside the page leaks no answer anywhere, and it teaches
   the section-1 distinction again on every question screen for free. */
function maskSet(opt){
  const vis=visibleIds(opt.layout);
  if(opt.mask===true) return new Set(vis);
  if(Array.isArray(opt.mask)) return new Set(opt.mask.filter(id=>vis.indexOf(id)>=0));
  return new Set();
}
const hiddenCalc = layout => CALC_IDS.filter(id=>visibleIds(layout).indexOf(id)>=0);

function drawBoard(state, opt){
  clearTimeout(lpTimer);
  const s=derive(state), L=LAYOUTS[opt.layout], hide=maskSet(opt);
  let html='<div class="jobname">'+(s.name||"")+'</div>';
  html += L.map(row=>'<div class="brow">'+row.map(x=>{
    if(!CMAP[x]) return '<div class="op" aria-hidden="true">'+x+'</div>';
    const c=CMAP[x], masked=hide.has(x);
    const spoken = masked ? "value hidden for this question" : fmtVal(c,s[x]);
    return '<div class="cell'+(c.calc?' calc':'')+(opt.tappable?' hasq':'')
      + '" id="cell-'+x+'" data-id="'+x+'">'
      + '<button type="button" class="cellhit" data-id="'+x+'" aria-label="'
      + c.k+(c.sub?", "+c.sub:"")+", "+spoken+'"'
      + (opt.tappable?' aria-pressed="false"':'')+'>'
      + '<span class="k" aria-hidden="true">'+c.k+'</span>'
      + (c.sub?'<span class="s" aria-hidden="true">'+c.sub+'</span>':'')
      + '<span class="v'+(masked?' mask':'')+'" aria-hidden="true">'
      + (masked?MASK:fmtVal(c,s[x]))+'</span></button>'
      + (opt.tappable
          ? '<button type="button" class="cellq" data-id="'+x+'" aria-label="What does '
            + c.k+' mean?">?</button>'
          : '')
      + '</div>';
  }).join("")+'</div>').join("");
  $("board").innerHTML=html;
  wireCells(!!opt.tappable);
}

function wireCells(tappable){
  document.querySelectorAll("#board .cellq").forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); showDef(b.dataset.id, b); };
  });
  document.querySelectorAll("#board .cellhit").forEach(b=>{
    const id=b.dataset.id;
    if(tappable){
      /* On a select step the cell IS the answer control, and there is NO
         long-press: a deliberate press was opening a definition instead of
         choosing, which cost two taps and looked like the app ignoring you.
         The "?" button, rendered only on these steps, is the definition path. */
      b.onclick=()=>{
        /* NO suppression guard here. The "?" is a sibling button that does not
           bubble, and there is no long-press on this step, so nothing can have
           legitimately armed a guard. The guard being global is what swallowed
           the first tap after every definition lookup. */
        const on=$("cell-"+id).classList.toggle("chosen");
        b.setAttribute("aria-pressed", on?"true":"false");
      };
      return;
    }
    b.onclick=()=>{ if(Date.now()<suppressUntil) return; showDef(id,b); };
    const start=()=>{ clearTimeout(lpTimer); lpTimer=setTimeout(()=>showDef(id,b),650); };
    const stop =()=> clearTimeout(lpTimer);
    b.addEventListener("touchstart",start,{passive:true});
    ["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener("mousedown",start);
    b.addEventListener("contextmenu",e=>{ e.preventDefault(); showDef(id,b); });
  });
}

function setCell(id, from, to, opt){
  opt=opt||{};
  const el=$("cell-"+id); if(!el) return;
  const c=CMAP[id], a=derive(from), b=derive(to);
  const d=b[id]-a[id], moved=Math.abs(d)>0.005;
  const v=el.querySelector(".v");
  if(v){ v.className="v"; v.textContent=fmtVal(c,b[id]); }
  const hit=el.querySelector(".cellhit");
  if(hit) hit.setAttribute("aria-label", c.k+(c.sub?", "+c.sub:"")+", "+fmtVal(c,b[id])
    + (moved ? ", was "+fmtVal(c,a[id]) : ""));
  el.classList.remove("up","down","still","flash");
  void el.offsetWidth;
  if(opt.direction!==false){
    el.classList.add(moved ? (d>0?"up":"down") : "still", "flash");
    if(!el.querySelector(".chip"))
      el.insertAdjacentHTML("beforeend", moved
        ? '<span class="chip '+(d>0?"up":"down")+'" aria-hidden="true">'+(d>0?"▲":"▼")+'</span>'
        : '<span class="chip still" aria-hidden="true">'+(opt.stillLabel||"NO CHANGE")+'</span>');
    if(moved && !el.querySelector(".was"))
      el.insertAdjacentHTML("beforeend", '<span class="was" aria-hidden="true">was '+fmtVal(c,a[id])+'</span>');
  } else {
    el.classList.add("flash");
  }
}
function badge(id, kind, text){
  const el=$("cell-"+id); if(!el || el.querySelector(".badge")) return;
  /* a judgement badge and a direction chip overlap by about a third of a cell
     on a phone. At the moment of judgement the badge is the information; hue
     and the "was" line still carry the direction. */
  const chip=el.querySelector(".chip"); if(chip) chip.remove();
  el.insertAdjacentHTML("beforeend", '<span class="badge '+kind+'" aria-hidden="true">'+text+'</span>');
  const hit=el.querySelector(".cellhit");
  if(hit) hit.setAttribute("aria-label",(hit.getAttribute("aria-label")||"")+". "
    + text.replace(/[^A-Za-z ]/g,"").trim().toLowerCase());
}

/* ---------- definition dialog ---------- */
const defOpen = () => $("defWrap").style.display==="flex";
function showDef(id, trigger){
  const c=CMAP[id]; if(!c||!c.def) return;
  suppressUntil=Date.now()+400; lastTrigger=trigger||null;
  $("defBody").innerHTML=c.def;
  $("defWrap").style.display="flex";
  $("defClose").focus();
}
function hideDef(){
  $("defWrap").style.display="none";
  if(lastTrigger && lastTrigger.focus) lastTrigger.focus();
  lastTrigger=null;
}

/* ═══════════════════════════════════════════════════════════════════
   PART 6 — THE ENGINE
   Nothing below needs editing to add, remove or reorder content.
   ═══════════════════════════════════════════════════════════════════ */
let view="map", SEC=0, S=0, answered=false, tries=0, warned=false, wIdx=0;

const cur = () => SECTIONS[SEC].steps[S];
const foot = h => { $("foot").innerHTML=h; };
const primary = (label,fn,cls) =>
  '<button class="btn '+(cls||"")+'" type="button" onclick="'+fn+'">'+label+'</button>';
const ghost = (label,fn) =>
  '<button class="btn ghost" type="button" onclick="'+fn+'">'+label+'</button>';
/* step 0 used to render a dead disabled Back, leaving an 11px pill in the top
   corner as the only exit. prevStep() already knew how to fall through. */
const backBtn = () => S===0 ? ghost("All sections","goMap()") : ghost("Back","prevStep()");
const lastStep = () => S >= SECTIONS[SEC].steps.length-1;

function srcHTML(step){
  return (step.src||[]).map(k=>{
    const s=SRC[k]; if(!s) return "";
    return s.callout
      ? '<div class="confirm"><span class="h">'+s.h+'</span>'+s.t+'</div>'
      : '<details class="src"><summary>Where this comes from</summary><p>'+s.t+'</p></details>';
  }).join("");
}
function tallyHTML(){
  const st=secStat(SEC);
  return '<div class="tally">'+st.right+' of '+st.n+' answered correctly in this section</div>';
}

function render(){
  if(view==="map") return renderMap();
  const sec=SECTIONS[SEC], step=cur();
  answered=false; tries=0; warned=false; wIdx=0;
  $("map").style.display="none";
  $("right").style.display="";
  $("topbtn").style.display="";
  const teaching = step.kind==="concept" || step.kind==="worked";
  $("right").className = teaching ? "teach" : "ask";
  const pos=(S+1)+" of "+sec.steps.length;
  $("band").className="band "+(teaching?"teach":"ask");
  $("band").textContent = step.kind==="concept" ? "Read · "+pos
                        : step.kind==="worked"  ? "Watch · "+pos
                        : "Your turn · "+pos;
  window.scrollTo(0,0);

  if(step.kind==="concept"){
    $("left").style.display="none";
    $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
      +'<div class="body">'+expand(step.body,step)+'</div>'+srcHTML(step);
    foot(backBtn()+'<span class="spacer"></span>'
      +primary(lastStep()?"Finish section":"Continue","nextStep()"));
    return;
  }
  $("left").style.display="";

  if(step.kind==="worked"){
    drawBoard(step.state,{layout:sec.layout, mask:!!step.blank});
    $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
      +'<div class="body" id="wtext">'+expand(step.setup,step)+'</div>';
    foot(backBtn()+'<span class="spacer"></span>'
      +primary(expand(step.button||"Follow it through",step),"showStage(0)"));
    return;
  }

  /* A question already answered correctly re-opens as a REVIEW, not a re-test.
     One stray tap while re-reading used to overwrite a correct answer. A tool
     built to be consulted cannot only be taken. */
  if(isScored(step) && ST[step.id] && ST[step.id].a===1) return reviewStep(step);

  drawBoard(step.state,{layout:sec.layout, mask:hiddenCalc(sec.layout),
                        tappable:step.kind==="select"});

  if(step.kind==="choice"){
    $("panel").innerHTML='<div class="body">'+expand(step.q,step)+'</div>'
      +'<div class="opts" id="opts">'+step.opts.map((o,i)=>
        '<button class="opt" type="button" onclick="pick('+i+')">'+expand(o,step)+'</button>').join("")
      +'</div><div id="msg" role="status"></div>';
    foot(backBtn()+'<span class="spacer"></span><span class="hint">Choose one</span>');
    return;
  }
  if(step.kind==="select"){
    $("panel").innerHTML='<div class="body">'+expand(step.q,step)+'</div>'
      +'<div class="hint">Tap fields on the board above. Tap again to unselect. '
      +'The <b>?</b> on each field explains what it means.</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn" type="button" onclick="submitSel()">Submit</button>';
    foot(backBtn()+'<span class="spacer"></span>'+primary("Submit","submitSel()"));
    return;
  }
  /* TYPED STEPS: the primary control is repeated IN THE PANEL, above the fold.
     The fixed bottom bar sits underneath the iOS keyboard, and the Enter
     fallback cannot fire because a decimal keypad has no Return key, so the
     bar alone was a dead end on every typed question in the app. */
  if(step.kind==="compute"){
    $("panel").innerHTML='<div class="body">'+expand(step.q,step)+'</div>'
      +'<input class="numin" id="numin" inputmode="decimal" enterkeyhint="go" autocomplete="off" '
      +'aria-label="Your answer" placeholder="type your answer">'
      +'<div class="hint">'+expand(step.hint||"",step)+'</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn" type="button" onclick="submitNum()">Check</button>';
    foot(backBtn()+'<span class="spacer"></span>'+primary("Check","submitNum()"));
    $("numin").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();submitNum();} });
    return;
  }
  if(step.kind==="explain"){
    const prev=(ST[step.id]&&ST[step.id].txt)||"";
    $("panel").innerHTML='<div class="body">'+expand(step.prompt,step)+'</div>'
      +'<textarea class="txtin" id="txtin" aria-label="Your explanation" '
      +'placeholder="Write it out. Nobody but you sees this.">'+prev+'</textarea>'
      +'<div class="hint">There is no grade here, and skipping it blocks nothing. '
      +'You compare your own words against a model answer.</div>'
      +'<div id="msg" role="status"></div>'
      +'<button class="btn dark" type="button" onclick="showModel()">Show the model answer</button>'
      +ghost("Skip — it blocks nothing","skipExplain()");
    foot(backBtn()+'<span class="spacer"></span>'+primary("Show the model answer","showModel()","dark"));
    return;
  }
}

function reviewStep(step){
  answered=true;
  revealBoard(step, []);
  $("panel").innerHTML='<div class="verdict s" role="status">Answered</div>'
    +'<div class="body">'+expand(step.q,step)+'</div>'
    +'<div class="body">'+expand(step.why,step)+'</div>'+srcHTML(step);
  foot(backBtn()+'<span class="spacer"></span>'+ghost("Try it again","retry()")
    +primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
}
function retry(){ const step=cur(); ST[step.id]={v:1}; save(); render(); }

/* ---------- worked examples: one stage per tap, text replaced ---------- */
function showStage(i){
  const sec=SECTIONS[SEC], step=cur();
  wIdx=Math.max(0, Math.min(i, step.stages.length-1));
  const reached=new Set();
  for(let k=0;k<=wIdx;k++) (step.stages[k].cells||[]).forEach(id=>reached.add(id));
  /* Any calculated cell not yet reached is masked. Mid-sequence the board used
     to display arithmetic that contradicted the rule printed two lines above
     it — EAC still reading its old total while JTD had already moved. */
  const pending = visibleIds(sec.layout).filter(id=>CMAP[id].calc && !reached.has(id));
  drawBoard(step.state,{layout:sec.layout, mask: step.blank ? true : pending});
  for(let k=0;k<=wIdx;k++){
    (step.stages[k].cells||[]).forEach(id=>{
      if(step.blank) setCell(id, step.state, step.state, {direction:false});
      else setCell(id, step.state, step.after||step.state, {stillLabel:step.stillLabel});
    });
  }
  const st=step.stages[wIdx];
  $("panel").innerHTML='<h1>'+expand(step.title,step)+'</h1>'
    +'<div class="stagen">Step '+(wIdx+1)+' of '+step.stages.length+'</div>'
    +'<div class="body fade">'+expand(st.text,step)+'</div>'
    +(wIdx===step.stages.length-1 ? srcHTML(step) : "");
  const back = wIdx===0 ? backBtn() : ghost("Back","showStage("+(wIdx-1)+")");
  const next = wIdx < step.stages.length-1
    ? primary("Next","showStage("+(wIdx+1)+")")
    : primary(lastStep()?"Finish section":"Continue","nextStep()");
  foot(back+'<span class="spacer"></span>'+next);
  window.scrollTo(0,0);
}

/* ---------- grading. Answers are stored, not views. ---------- */
function msg(html,cls){ const m=$("msg"); if(m) m.innerHTML='<div class="'+(cls||"warn")+'">'+html+'</div>'; }
function grade(ok){
  const step=cur();
  answered=true;
  rec(step.id,{a:ok?1:0, n:tries+1, v:1});
  bumpHW();
  return ok;
}
function verdictHTML(ok){
  return '<div class="verdict '+(ok?"y":"n")+'" role="status">'+(ok?"Correct":"Not quite")+'</div>';
}
function revealBoard(step, keepChosen){
  const sec=SECTIONS[SEC];
  drawBoard(step.after||step.state,{layout:sec.layout});
  if(step.mode!=="identify"){
    const movers=moversFor(step);
    movers.forEach(id=>setCell(id, step.state, step.after||step.state, {stillLabel:step.stillLabel}));
    if(!movers.length && step.kind==="select")
      visibleIds(sec.layout).forEach(id=>setCell(id, step.state, step.state,
        {stillLabel:step.stillLabel||"NO CHANGE"}));
  }
  (keepChosen||[]).forEach(id=>{
    const el=$("cell-"+id); if(!el) return;
    el.classList.add("chosen");
    const hit=el.querySelector(".cellhit");
    if(hit) hit.setAttribute("aria-pressed","true");
  });
}
function reveal(ok, step, keepChosen){
  revealBoard(step, keepChosen);
  $("panel").innerHTML = verdictHTML(ok)
    + '<div class="body">'+expand(step.why,step)+'</div>'
    + srcHTML(step) + tallyHTML();
  foot(backBtn()+'<span class="spacer"></span>'
    + (ok ? "" : ghost("Try it again","retry()"))
    + primary(lastStep()?"Finish section":"Continue","nextStep()"));
  window.scrollTo(0,0);
}

function pick(i){
  if(answered) return;
  const step=cur();
  const btns=[...document.querySelectorAll("#opts .opt")];
  if(i===step.a){
    btns.forEach((b,j)=>{ b.disabled=true; if(j===step.a) b.classList.add("right"); });
    btns[i].classList.add("chosen");
    grade(true); return reveal(true, step);
  }
  if(tries===0){
    tries=1; btns[i].disabled=true; btns[i].classList.add("wrong");
    msg("Not quite. <b>One more try</b> — pick again.");
    return;
  }
  btns.forEach((b,j)=>{ b.disabled=true;
    if(j===step.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  grade(false); reveal(false, step);
}

function submitSel(){
  if(answered) return;
  const step=cur();
  const picked=[...document.querySelectorAll("#board .cell.chosen")].map(e=>e.dataset.id);
  if(!picked.length && !warned){
    warned=true;
    msg("Nothing is selected. If you mean <b>none of them move</b>, tap Submit again and that is the answer you will give.");
    return;
  }
  const want=answerIds(step);
  const ok = picked.length===want.length && picked.slice().sort().join()===want.slice().sort().join();
  if(!ok && tries===0){
    tries=1; warned=true;
    msg("Not quite. <b>One more try</b> — change your selection and submit again.");
    return;
  }
  grade(ok);
  reveal(ok, step, picked);
  visibleIds(SECTIONS[SEC].layout).forEach(id=>{
    const p=picked.includes(id), w=want.includes(id);
    if(p&&w) badge(id,"right","✓ RIGHT");
    else if(p&&!w) badge(id,"wrong","✗ WRONG");
    else if(!p&&w) badge(id,"missed","○ MISSED");
  });
}

function parseNum(raw){
  let t=String(raw||"").trim().replace(/−/g,"-").replace(/[$,\s]/g,"")
        .replace(/×/g,"*").replace(/÷/g,"/");
  if(t.endsWith("%")) t=t.slice(0,-1);
  let mult=1;
  const suf=/^(-?[\d.]+)([kKmM])$/.exec(t);          // 80k, 1.2m — the notation people use
  if(suf){ t=suf[1]; mult = /[kK]/.test(suf[2]) ? 1000 : 1000000; }
  t=t.replace(/[xX]/g,"*");
  if(!t) return NaN;
  if(/^-?\d*\.?\d+$/.test(t)) return parseFloat(t)*mult;
  if(/^[0-9+\-*/(). ]+$/.test(t)){
    try{ const v=Function('"use strict";return ('+t+')')();
      return (typeof v==="number" && isFinite(v)) ? v*mult : NaN; }catch(e){ return NaN; }
  }
  return NaN;
}
function submitNum(){
  if(answered) return;
  const step=cur(), el=$("numin"), raw=(el.value||""), n=parseNum(raw);
  /* An unreadable entry is NOT an answer. It used to consume the retry and
     then grade you wrong, so typing "100k" twice — the correct answer, twice —
     was scored as a failure. */
  if(isNaN(n)){
    msg(raw.trim()
      ? "That is not a number I can read. Digits are fine, and so is <b>80k</b>, or a sum like <b>40000+40000</b>. This does not count as a try."
      : "Nothing typed yet. <b>Type an answer</b> — this does not count as a try.");
    return;
  }
  const target=computeAnswer(step), c=CMAP[step.field];
  const hadPct = raw.indexOf("%")>=0;
  const ok = c.fmt==="pct"
    ? (hadPct ? Math.abs(n-target*100)<=0.1
              : (Math.abs(n-target*100)<=0.1 || Math.abs(n-target)<=0.001))
    : Math.abs(n-target)<=1;
  if(!ok && tries===0){
    tries=1;
    msg("Not quite. <b>One more try</b> — check the arithmetic and tap Check again.");
    el.select();
    return;
  }
  el.disabled=true; el.style.borderColor = ok?"var(--up)":"var(--down)";
  grade(ok); reveal(ok, step);
}

/* ---------- constructed response. Self-scored, always skippable. ---------- */
function skipExplain(){ rec(cur().id,{sk:1, v:1}); nextStep(); }
function showModel(){
  const step=cur();
  const txt=($("txtin")&&$("txtin").value)||"";
  rec(step.id,{txt:txt, v:1});
  $("panel").innerHTML='<div class="verdict s" role="status">Compare</div>'
    +'<div class="body">'+(txt.trim()
        ? 'What you wrote:<br><br><i>'+txt.replace(/[<>]/g,"")+'</i>'
        : 'You did not write anything. Read the model answer, then come back to this step when you want to try it cold.')+'</div>'
    +'<div class="model"><div class="h">A model answer</div><ul>'
      +step.model.map(m=>'<li>'+expand(m,step)+'</li>').join("")+'</ul></div>'
    +'<div class="body">Did your own words cover those points?</div>'
    +'<div class="opts" id="selfopts">'
      +'<button class="opt" type="button" onclick="selfScore(1)">Covered it</button>'
      +'<button class="opt" type="button" onclick="selfScore(0.5)">Covered some of it</button>'
      +'<button class="opt" type="button" onclick="selfScore(0)">The model has things mine did not</button>'
    +'</div><div id="msg" role="status"></div>';
  foot(backBtn()+'<span class="spacer"></span>'
    +primary(lastStep()?"Finish section":"Continue","nextStep()"));
}
function selfScore(v){
  rec(cur().id,{self:v});
  const btns=[...document.querySelectorAll("#selfopts .opt")];
  btns.forEach(b=>b.disabled=true);
  const idx = v===1?0 : v===0.5?1 : 2;
  if(btns[idx]) btns[idx].classList.add("chosen");
  msg("Noted. This is not scored and it changes nothing — it is for you.","hint");
}

/* ---------- the section map ---------- */
function goMap(){ view="map"; render(); }
function openSection(i){
  if(!unlocked(i)) return;
  SEC=i; S=firstUnfinished(i); view="sec"; render();
}
function resume(){
  for(let i=0;i<SECTIONS.length;i++) if(unlocked(i) && !secStat(i).complete) return openSection(i);
  openSection(SECTIONS.length-1);
}
function resetAll(){
  if(!confirm("Clear all progress, including anything you have typed, and start again from the beginning?")) return;
  ST={}; HW=0; save(); goMap();
}
function renderMap(){
  view="map";
  $("map").style.display="flex";
  $("left").style.display="none";
  $("right").style.display="none";
  $("topbtn").style.display="none";
  const totalSc=SECTIONS.reduce((n,s)=>n+s.steps.filter(isScored).length,0);
  const rightSc=SECTIONS.reduce((n,s,i)=>n+secStat(i).right,0);
  const touched=Object.keys(ST).length>0;
  let html='<div class="maphead">How the firm counts money</div>'
    +'<div class="mapsub">Every figure in here is invented and no real Buro Happold project appears.'
    +'<br><b>'+rightSc+' of '+totalSc+' questions answered correctly.</b> '
    +'It saves after every answer, so you can stop anywhere and lose nothing. '
    +'You can retry any question as often as you like.</div>';
  let lvl=null;
  SECTIONS.forEach((s,i)=>{
    if(s.level!==lvl){
      lvl=s.level;
      const cap = s.level===100 ? "what each number is"
                : s.level===200 ? "what moves what"
                : "billing, and what it does not do";
      html+='<div class="lvlhead">'+s.level+' level <span>· '+cap+'</span></div>';
    }
    const st=secStat(i), lock=!unlocked(i);
    const prog = lock ? "Locked"
      : st.complete ? "All "+st.n+" correct"
      : st.right+" of "+st.n+" correct";
    html+='<button class="sec '+(lock?"locked":"")+' '+(st.complete?"done":"")
      +' '+(!lock&&!st.complete?"now":"")+'" type="button"'+(lock?' disabled':'')
      +' onclick="openSection('+i+')">'
      +'<span class="secnum">'+(st.complete?"✓":i+1)+'</span>'
      +'<span class="secbody"><span class="secname">'+s.name+'</span>'
      +'<span class="secline">'+(lock?"Finish the section above first":s.line)
      +' · '+s.steps.length+' steps</span></span>'
      +'<span class="secprog">'+prog+'</span></button>';
  });
  /* Reset used to sit in the footer slot that says "Back" on every other
     screen, on the screen he opens every single time. */
  html+='<button class="resetlink" type="button" onclick="resetAll()">Start over from the beginning</button>';
  $("map").innerHTML=html;
  foot('<span class="spacer"></span>'+primary(touched?"Continue":"Start","resume()"));
  window.scrollTo(0,0);
}

/* ---------- navigation ---------- */
function prevStep(){ if(S>0){ S--; render(); } else goMap(); }
function nextStep(){
  /* "seen" means got to the end of, not glanced at. It used to be stamped on
     paint, so a two-second look before a meeting counted as finished and the
     step was skipped for ever after. */
  rec(cur().id,{v:1});
  bumpHW();
  S++;
  if(S>=SECTIONS[SEC].steps.length){ goMap(); return; }
  render();
}

/* ═══════════════════════════════════════════════════════════════════
   PART 7 — THE SELF TEST
   This runs before the app will start. A phone has no console, so a
   stray backtick used to be a white screen. Now it is a red banner
   naming the defect. The number audit is the important one: it expands
   every sentence in the app and refuses to start if any money or
   percentage figure in the prose is not a value derive() produced from
   that step's own state. That is the mechanical guarantee that no
   figure is ever typed twice.
   ═══════════════════════════════════════════════════════════════════ */
const SCAN_MONEY=/−?\$\d{1,3}(?:,\d{3})*(?:\.\d+)?/g, SCAN_PCT=/\d+(?:\.\d+)?%/g;
const TOKENS=/\{([A-Za-z][A-Za-z.]*)\}/g;
/* The allow-set is scoped to the TOKENS THIS SENTENCE ACTUALLY USES, not to
   every value on the board. The board-wide version passed a figure that was
   wrong for its sentence but happened to equal some other field on the same
   step — which is precisely how a plausible wrong number survives review. */
function allowedFigures(step, raw){
  const out=new Set();
  if(!step.state) return out;
  const a=derive(step.state), b=derive(step.after||step.state);
  if(raw===undefined){                       // whole-step set, kept for tooling
    CELLS.forEach(c=>[a[c.id],b[c.id],Math.abs(b[c.id]-a[c.id])].forEach(v=>out.add(fmtVal(c,v))));
    return out;
  }
  let m; TOKENS.lastIndex=0;
  while((m=TOKENS.exec(String(raw)))!==null){
    const tok=m[1];
    if(tok==="FRAC" || tok==="FRAC.after"){
      const s2 = tok==="FRAC" ? a : b;
      out.add(money(s2.jtd)); out.add(money(s2.eac)); out.add(pctS(s2.pct));
      continue;
    }
    const t=/^(after\.|d\.)?([a-z]+)$/.exec(tok);
    if(!t || !CMAP[t[2]]) continue;
    const c=CMAP[t[2]], f=t[2];
    out.add(fmtVal(c, t[1]==="after." ? b[f] : t[1]==="d." ? Math.abs(b[f]-a[f]) : a[f]));
  }
  return out;
}
function stringsOf(step){
  const out=[];
  ["title","body","setup","button","q","hint","why","prompt"].forEach(k=>{ if(step[k]) out.push([k,step[k]]); });
  (step.opts||[]).forEach((o,i)=>out.push(["opts["+i+"]",o]));
  (step.model||[]).forEach((o,i)=>out.push(["model["+i+"]",o]));
  (step.stages||[]).forEach((s,i)=>out.push(["stages["+i+"].text",s.text]));
  return out;
}
function selfTest(){
  const err=[], ids=new Set(), sids=new Set();
  const KINDS=["concept","worked","choice","select","compute","explain"];
  SECTIONS.forEach((sec,i)=>{
    if(sids.has(sec.id)) err.push("duplicate section id: "+sec.id); sids.add(sec.id);
    if(!LAYOUTS[sec.layout]) err.push(sec.id+": unknown layout "+sec.layout);
    const vis=LAYOUTS[sec.layout]?visibleIds(sec.layout):[];
    sec.steps.forEach(step=>{
      const at=sec.id+" / "+step.id;
      if(!step.id) err.push(at+": step has no id");
      if(ids.has(step.id)) err.push("duplicate step id: "+step.id); ids.add(step.id);
      if(KINDS.indexOf(step.kind)<0) err.push(at+": unknown kind "+step.kind);
      (step.src||[]).forEach(k=>{ if(!SRC[k]) err.push(at+": unknown source key "+k); });
      if(step.kind==="choice"){
        if(!Array.isArray(step.opts)||step.opts.length<2) err.push(at+": needs at least two options");
        else if(!(step.a>=0 && step.a<step.opts.length)) err.push(at+": answer index out of range");
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="select"){
        if(!step.state) err.push(at+": select needs a state");
        if(step.mode==="identify"){
          if(!Array.isArray(step.ids)||!step.ids.length) err.push(at+": identify needs ids");
          else step.ids.forEach(id=>{ if(vis.indexOf(id)<0) err.push(at+": id "+id+" is not on this section's board"); });
        }
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="compute"){
        if(!step.state||!CMAP[step.field]) err.push(at+": compute needs a state and a real field");
        else if(!isFinite(computeAnswer(step))) err.push(at+": derived answer is not a finite number");
        if(!step.why) err.push(at+": no explanation");
      }
      if(step.kind==="worked"){
        if(!Array.isArray(step.stages)||!step.stages.length) err.push(at+": worked needs stages");
        (step.stages||[]).forEach((s,k)=>(s.cells||[]).forEach(id=>{
          if(vis.indexOf(id)<0) err.push(at+" stage "+(k+1)+": cell "+id+" is not on this section's board");
        }));
      }
      if(step.kind==="explain" && (!Array.isArray(step.model)||!step.model.length))
        err.push(at+": explain needs a model answer");
      /* a compute step must TALK ABOUT the field it GRADES. Repointing the
         field silently produced a build that asked for EAC, graded against
         JTD, and marked the correct answer wrong — with a clean self-test. */
      if(step.kind==="compute" && CMAP[step.field]){
        /* The EXPLANATION must assert the graded field. Checking the question
           was too weak: a question legitimately names its operands, so a step
           asking for EAC and grading JTD still passed because {jtd} appears in
           the stem. The `why` is where the answer is asserted, so that is
           where the graded field has to appear. */
        const f=step.field, refs=new RegExp("\\{(?:after\\.)?"+f+"\\}");
        if(!refs.test(String(step.why||"")))
          err.push(at+": grades the field "+f+" but its explanation never states {"+f+"}. "
            + "The graded field and the described field have diverged.");
      }
      stringsOf(step).forEach(([k,raw])=>{
        let out;
        try{ out=expand(raw,step); }
        catch(e){ err.push(at+" ."+k+": "+e.message); return; }
        const allow=allowedFigures(step, raw);
        (out.match(SCAN_MONEY)||[]).forEach(f=>{ if(!allow.has(f))
          err.push(at+" ."+k+": the figure "+f+" is typed in, not derived. Use a token."); });
        (out.match(SCAN_PCT)||[]).forEach(f=>{ if(!allow.has(f))
          err.push(at+" ."+k+": the percentage "+f+" is typed in, not derived. Use a token."); });
      });
    });
  });
  return err;
}
function fail(title, lines){
  const e=$("err"); if(!e) return;
  e.style.display="block";
  e.innerHTML='<b>'+title+'</b>'+(lines.length?'<ul>'+lines.map(l=>'<li>'+l+'</li>').join("")+'</ul>':"");
}

/* ---------- boot ---------- */
function boot(){
  window.onerror=function(m,src,line){ fail("Something broke and the app stopped.",[m+" (line "+line+")"]); };
  $("ver").textContent=BUILD;
  $("defClose").onclick=hideDef;
  $("defWrap").addEventListener("click",e=>{ if(e.target===$("defWrap")) hideDef(); });
  document.addEventListener("keydown",e=>{
    if(!defOpen()) return;
    if(e.key==="Escape"){ hideDef(); return; }
    /* the dialog had no containment: Shift+Tab landed on buttons hidden
       underneath the overlay, which a keyboard user could then activate. */
    if(e.key==="Tab"){ e.preventDefault(); $("defClose").focus(); }
  });
  const errs=selfTest();
  if(errs.length){ fail("This build did not pass its own check, so it has not started. "+errs.length+" problem(s):", errs); return; }
  render();
}
if(typeof window!=="undefined" && typeof document!=="undefined" && document.getElementById) boot();
else if(typeof globalThis!=="undefined") globalThis.__MP={SECTIONS,CELLS,CMAP,LAYOUTS,SRC,derive,money,pctS,
  fmtVal,visibleIds,moversFor,answerIds,computeAnswer,expand,selfTest,parseNum,BUILD,allowedFigures,stringsOf};
</script>
</body>
