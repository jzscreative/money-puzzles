<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Puzzles">
<meta name="theme-color" content="#f4f6f9">
<meta name="robots" content="noindex, nofollow">
<!-- P4-14 · with no icon, the home-screen tile was an auto-screenshot of a
     white page. This is a plain 180x180 PNG, no manifest needed for iOS. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Money Puzzles</title>
<style>
/* LIGHT MODE IS FORCED. There is deliberately no prefers-color-scheme block.
   ONE LAYOUT AT EVERY WIDTH. There is deliberately no width media query.
   Sizes scale with clamp(); nothing ever rearranges, hides or reflows. */
:root{
  color-scheme:light only;
  --bg:#f4f6f9; --panel:#ffffff; --calc:#eef3f9;
  /* --line and --rule are BORDER tokens. Never use either as a text colour. */
  --line:#d7e0ea; --rule:#8b95a1; --cellline:#8a8f96;   /* --rule and --cellline
     carry operable-component boundaries and are measured at 3.06:1 and 3.25:1
     against the panel. --line is decorative dividers only. */
  --ink:#0e151d; --body:#31414f; --dim:#4d5d70;
  --up:#15803d; --upbg:#e9f9ef; --upline:#5e9975;
  --down:#b91c1c; --downbg:#fdeeee; --downline:#b97b7b;
  --hot:#a16207; --hotbg:#fdf6e3; --hotline:#a18b53;
  /* "deliberately unchanged" used to share --hot with the retry warning box,
     so a CORRECT answer on the nothing-moves question painted every cell
     warning-amber underneath a green Correct bar. It is now neutral slate.
     Measured 3.65:1 against the white panel, so it still passes 1.4.11. */
  --stillline:#7c8794; --stillbg:#eceff3; --stillink:#4d5d70;
  --acc:#1d4ed8; --accbg:#e8effd;
  --dark:#16202b; --darkink:#eaf0f7; --darkdim:#a9bccf;
  --judge:#0e151d;
  --footh:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;touch-action:manipulation}
button{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- error banner ---------- */
#err{display:none;background:var(--down);color:#fff;font-size:13.5px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  line-height:1.5;position:sticky;top:0;z-index:60}
#err b{display:block;font-size:15px;margin-bottom:5px}
#err ul{margin:6px 0 0 18px}

/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.t{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:650}
.t.f{font-weight:500;font-size:10px;letter-spacing:.03em;color:var(--dim);opacity:.85}
.topbtn{margin-left:auto;background:none;border:1px solid var(--rule);color:var(--dim);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
  padding:8px 13px;border-radius:99px;cursor:pointer;min-height:44px}

#stage{display:flex;flex-direction:column;align-items:center;width:100%;
  padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
  padding-bottom:calc(var(--footh) + env(safe-area-inset-bottom) + 14px)}
#left{width:100%;max-width:680px;padding:12px 0 4px}
#right{width:100%;max-width:680px;border-radius:12px;display:flex;flex-direction:column;
  padding:0;gap:0;margin:8px 0 14px;overflow:hidden;border:1px solid var(--line);
  background:var(--panel);box-shadow:0 1px 2px rgba(16,25,40,.05)}

/* ---------- page shape: TEACHING vs ASKING ----------
   The two modes are a real signal and they stay. What changed in v5 is the
   DOSE. Teaching used to invert the entire screen, so a ninety-second stretch
   of the app flipped between near-black and near-white five times, and the
   densest sustained reading in the file sat in the polarity that fails
   outdoors. Teaching now mirrors what asking already does: one panel colour, a
   coloured left rail, and an inverted band across the top. */
#right.teach{border-left:5px solid var(--dark)}
#right.ask{border-left:5px solid var(--acc)}
.band{padding:9px 14px;font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.band.teach{background:var(--dark);color:var(--darkink)}
.band.ask{background:var(--acc);color:#fff}
#panel{padding:14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.015em}
.body{font-size:15.5px;color:var(--body);line-height:1.55;max-width:64ch}
.body b{color:var(--ink);font-weight:700}
.stagen{font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim)}

/* ---------- board ---------- */
#board{display:flex;flex-direction:column;gap:6px}
.jobname{font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:0 2px 5px}
.brow{display:flex;gap:6px;align-items:stretch}
.cell{flex:1 1 0;min-width:0;background:var(--panel);border:1.5px solid var(--cellline);
  border-radius:9px;position:relative;transition:background .18s,border-color .18s}
.cell.calc{background:var(--calc);border-style:dashed}
.cellhit{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 10px 8px 9px;border-radius:8px;color:inherit;min-height:58px}
.cell.hasq .cellhit{padding-right:32px}
.cellhit .k{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);font-weight:750;line-height:1.2}
.cellhit .s{display:block;font-size:11.5px;font-weight:650;color:var(--body);line-height:1.25;
  margin-top:2px}
.cellhit .v{display:block;font-size:clamp(14px,4.3vw,21px);font-weight:700;margin-top:4px;
  letter-spacing:-.015em;white-space:nowrap;color:var(--ink)}
.cellhit .v.mask{color:var(--dim);letter-spacing:.14em}
.was{display:block;font-size:10.5px;color:var(--body);font-weight:650;margin-top:-2px;
  padding:0 10px 8px 9px;line-height:1.3}
.cell.hasq .was{padding-right:32px}
/* P4-7 · the "?" sat inside a 26px box on top of the 58px .cellhit button
   underneath it. A thumb that missed the 26px target did not do nothing — it
   landed on .cellhit instead and silently added a wrong cell to the answer.
   The BUTTON's own hit area is now 44px (right:-9px;bottom:-9px expands it
   9px past where the 26px circle used to sit, in every direction: 26+9+9=44),
   while ::before draws the circle back down to the original 26px, centred
   inside that 44px box, so nothing about the visual changes. */
.cellq{position:absolute;right:-9px;bottom:-9px;width:44px;height:44px;
  border:0;background:none;color:var(--dim);font-size:12px;font-weight:750;
  cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0;z-index:2}
.cellq::before{content:"";position:absolute;inset:9px;border-radius:99px;
  border:1.5px solid var(--rule);background:var(--panel)}
.op{display:flex;align-items:center;justify-content:center;color:var(--body);
  font-size:clamp(15px,4vw,19px);font-weight:650;flex:0 0 auto;padding:0 1px}

/* channel 1 — HUE = direction the data moved */
.cell.up{border-color:var(--upline);background:var(--upbg)}
.cell.down{border-color:var(--downline);background:var(--downbg)}
.cell.still{border-color:var(--stillline);background:var(--stillbg)}
/* channel 2 — HEAVY BLACK BORDER = you chose this. Persists through the reveal.
   It must NOT set border-style. Converting a dashed calculated cell to solid
   destroyed the dashed edge on the very question that asks which cells are
   calculated — selection was erasing the evidence. Width and an inset ring
   carry it instead, and the dash survives. */
.cell.chosen{border-color:var(--judge);border-width:3px;
  box-shadow:inset 0 0 0 3px rgba(14,21,29,.10)}
/* channel 3 — ACHROMATIC BADGE = right, wrong, missed */
.chip{position:absolute;top:-9px;right:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;color:#fff;white-space:nowrap}
.chip.up{background:var(--up)} .chip.down{background:var(--down)} .chip.still{background:var(--stillink)}

/* ---------- the real report: many rows, real column order ---------- */
.rp{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--cellline);
  border-radius:10px;background:var(--panel)}
.rp table{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap;width:100%}
/* P4-1(c) · 13px padding puts every row at a 44px pitch — the real page's
   rows are a tap target now that rowpick makes them tappable, not just text. */
.rp th,.rp td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right}
.rp tr:last-child td{border-bottom:0}
/* P4-1(a) · headers were the widest content in every column — a header like
   "LIVE CALCULATED % COMP" forced the whole column wide even though every
   money value under it is a third that width. Letting headers wrap drops the
   table from 1,025px to roughly 810px on a five-column layout and changes
   nothing about the one-layout rule: nothing reflows, nothing hides. */
.rp th{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  font-weight:800;background:var(--calc);line-height:1.3;white-space:normal;
  vertical-align:bottom}
/* P4-1(b) · the job-name column is now a FIXED width, wrapped rather than
   nowrap. Two things this buys: the column itself stops being the single
   widest thing on the page ("Alderman Street Rooms" no longer forces 180px+
   of nowrap text), and — P4-1(c) — because the width is fixed rather than
   content-driven, inserting the right/wrong/missed mark at reveal time can
   never change the column's rendered width, so the frozen first column
   cannot jump sideways the moment the answer is shown. */
.rp .jn{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:700;
  border-right:1.5px solid var(--cellline);z-index:1;font-size:12.5px;
  white-space:normal;width:130px;min-width:130px;max-width:130px}
.rp th.jn{background:var(--calc);z-index:2}
.rp tbody tr{cursor:pointer}
.rp tr.pick td{background:var(--accbg)}
.rp tr.pick .jn{background:var(--accbg);box-shadow:inset 4px 0 0 var(--judge)}
.rp tr.rr td,.rp tr.rr .jn{background:var(--upbg)}
.rp tr.rw td,.rp tr.rw .jn{background:var(--downbg)}
.rp tr.rm td,.rp tr.rm .jn{background:var(--stillbg)}
/* P4-1(c), continued: the mark sits on its own line under the name, inside
   the now-fixed-width cell, instead of trying to share the name's line and
   overflow it. */
.rpmark{display:block;width:fit-content;font-size:9px;font-weight:800;letter-spacing:.05em;
  margin-top:4px;padding:2px 6px;border-radius:99px;background:var(--judge);color:#fff}
.rpmark.missed{background:var(--panel);color:var(--judge);border:1.5px dashed var(--judge)}
.rpmark.wrong{background:var(--panel);color:var(--judge);border:1.5px solid var(--judge)}
.rphint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
/* mode chrome: the strip that says what tapping does, so a mode change is
   announced by a visible element rather than discovered by tapping. */
.mode{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  background:var(--calc);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;margin-bottom:7px}
/* P4-6/P4-7 · Clear is the ONLY undo in the app. A 34px target on the one
   control that reverses a mis-tap is exactly the wrong place to be tight. */
.mode .clr{margin-left:auto;background:none;border:0;color:var(--acc);font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;
  text-decoration:underline;padding:10px 8px;min-height:44px;min-width:44px}
/* P4-2 · the badge used to sit at top:-9px, sharing the chip's row with wide
   text on both sides, so on a narrow cell the two collided and badge() simply
   deleted the chip out from under itself — the three-channel scheme (colour +
   direction chip + judgement badge) silently dropped to two on every
   correctly-chosen cell that moved. The badge already anchored left and the
   chip already anchored right; what overlapped was the SHARED top edge. Move
   the badge to the bottom edge instead — diagonally opposite the chip — so
   the two can never collide regardless of how wide either one's text is, and
   the chip no longer has to be removed. */
.badge{position:absolute;bottom:-9px;left:6px;font-size:9px;font-weight:800;padding:3px 7px;
  border-radius:99px;letter-spacing:.05em;white-space:nowrap;
  background:var(--judge);color:#fff;border:1.5px solid var(--judge)}
.badge.missed{background:var(--panel);color:var(--judge);border-style:dashed}
.badge.wrong{background:var(--panel);color:var(--judge)}
.lphint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.flash{animation:flash .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fadein .28s ease}
/* P4-3 · STAGE THE REVEAL. About twenty things used to become visible in one
   frame, including a vertical reflow from every "was $X" line landing at
   once. The underlying DOM state still updates SYNCHRONOUSLY — screen readers
   and this file's own test suite both need the real values the instant they
   exist, so nothing here delays data, only its entrance animation. Each cell
   touched by a reveal gets an animation-delay set at draw time, in board
   order, roughly 120ms apart, so a sighted reader's eye is drawn across the
   board the way a hand would move across it rather than seeing it change all
   at once. The verdict bar is a separate element and is never delayed. */
@keyframes revealin{from{opacity:0}to{opacity:1}}
.chip,.badge,.was{opacity:0;animation:revealin .22s ease forwards}
@media(prefers-reduced-motion:reduce){.flash,.fade,.chip,.badge,.was{animation:none;opacity:1}}

/* ---------- verdict ---------- */
.verdict{margin:-14px -14px 2px;padding:13px 14px;font-size:20px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:#fff}
.verdict.y{background:var(--up)} .verdict.n{background:var(--down)}
.verdict.s{background:var(--judge)}
.tally{font-size:13px;color:var(--dim);font-weight:650}

/* ---------- inputs ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel);border:1.5px solid var(--rule);color:var(--ink);
  padding:13px 14px;border-radius:9px;cursor:pointer;font-size:15.5px;min-height:50px}
.opt.right{border-color:var(--up);background:var(--upbg);font-weight:700}
.opt.wrong{border-color:var(--down);background:var(--downbg)}
.opt.chosen{border-color:var(--judge);border-width:3px}
.opt:disabled{cursor:default;opacity:.72}
.numin{font-size:20px;font-weight:700;padding:13px 14px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;max-width:280px;min-height:54px;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel)}
.numin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.txtin{font:inherit;font-size:15.5px;line-height:1.5;padding:12px 13px;border-radius:9px;
  border:1.5px solid var(--rule);width:100%;min-height:130px;color:var(--ink);
  background:var(--panel);resize:vertical}
.txtin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.hint{font-size:13.5px;color:var(--dim)}
.warn{font-size:14px;color:var(--ink);background:var(--hotbg);border:1.5px solid var(--hotline);
  border-radius:8px;padding:10px 12px;font-weight:650}
.model{border:1.5px solid var(--line);border-radius:9px;padding:12px 13px;background:var(--calc)}
.model ul{margin:6px 0 0 18px;color:var(--body);font-size:15px;line-height:1.55}
.model li{margin-bottom:7px}
.model .h{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.chklist{list-style:none;margin:0;padding:0}
.chklist li{margin-bottom:7px}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:11px 12px;
  font-size:15px;line-height:1.5;color:var(--body);min-height:48px}
.chk .box{flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:2px solid var(--rule);
  margin-top:2px}
.chk.on{border-color:var(--judge);background:var(--calc);color:var(--ink)}
.chk.on .box{background:var(--judge);border-color:var(--judge);position:relative}
.chk.on .box::after{content:"\2713";position:absolute;inset:0;color:#fff;font-size:14px;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.confirm{border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;
  padding:11px 13px;font-size:14px;line-height:1.55;color:var(--body);background:var(--accbg)}
.confirm .h{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--acc);display:block;margin-bottom:4px}
details.src{font-size:13.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
details.src summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  min-height:44px;font-weight:650}
details.src summary::-webkit-details-marker{display:none}
details.src summary::after{content:"\25B8"}
details.src[open] summary::after{content:"\25BE"}
details.src p{margin-top:6px;line-height:1.55;color:var(--body)}
#right.teach details.src p{color:var(--body)}

/* ---------- section map ---------- */
#map{width:100%;max-width:680px;padding:16px 0 20px;display:flex;flex-direction:column;gap:10px}
.maphead{font-size:21px;font-weight:700;letter-spacing:-.015em}
.mapsub{font-size:14px;color:var(--body);line-height:1.55}
/* P4-10 · .lvlhead deleted (see renderMap()). .sec's border moved off --line
   (decorative-dividers-only, 1.2:1 against the page) onto --cellline, the
   token this file already reserves for operable-component boundaries and
   measures at 3.25:1 — without it, all eight tap targets on the map had
   effectively no visible edge outdoors. */
.sec{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--cellline);
  border-radius:11px;padding:13px 14px;cursor:pointer;text-align:left;width:100%;min-height:66px}
.sec.locked{cursor:default;background:#eef1f5}
.sec.done{border-color:var(--upline)}
.secnum{width:32px;height:32px;border-radius:99px;background:var(--calc);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
.sec.done .secnum{background:var(--up);color:#fff}
.sec.now .secnum{background:var(--acc);color:#fff}
.sec.locked .secnum{background:#dfe5ec;color:var(--dim)}
.secbody{flex:1 1 auto;min-width:0}
.secname{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.secline{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}
/* P4-10 · a 3px progress bar per row, replacing some of the vertical space
   .lvlhead used to cost. */
.secbar{display:block;height:3px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.secbar span{display:block;height:100%;background:var(--acc);border-radius:99px}
.sec.done .secbar span{background:var(--up)}
.secprog{font-size:11.5px;color:var(--dim);font-weight:750;flex:0 0 auto;white-space:nowrap;
  text-align:right;max-width:82px;line-height:1.3}

/* ---------- the one fixed action bar. Same place on every screen. ---------- */
.mapfoot{text-align:center;font-size:10px;letter-spacing:.03em;color:var(--dim);opacity:.85;
  padding:2px 0 6px}
.resetlink{margin:18px auto 0;background:none;border:0;color:var(--dim);font-size:13px;
  font-weight:600;text-decoration:underline;cursor:pointer;padding:12px;min-height:44px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
  /* P4-13 · left/right are safe-area-aware so the Back button and Continue
     don't slide under a notched phone's sensor housing or the home-indicator
     curve in landscape. env() falls back to 0 on devices with no notch. */
  padding:11px calc(14px + env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  min-height:var(--footh)}
#foot .spacer{flex:1 1 auto}
.btn{background:var(--acc);color:#fff;border:0;padding:13px 22px;border-radius:9px;
  font-weight:700;font-size:15.5px;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--dim);border:1.5px solid var(--rule);font-weight:600;
  padding:13px 16px}
.btn.dark{background:var(--judge)}
/* P6-1 · the global :focus-visible outline uses var(--acc), which measures only
   2.74:1 against .btn.dark's var(--judge) background — a confirmed WCAG 1.4.11
   non-text-contrast failure on a reachable, keyboard-focusable control (the
   "Show the model answer" button on every explain step). var(--darkink) against
   the same background measures 18.36:1. Scoped to .btn.dark only — every other
   button keeps the standard var(--acc) outline, which already clears 3:1 against
   the light-panel backgrounds those buttons sit on. */
.btn.dark:focus-visible{outline-color:var(--darkink)}
/* "Try it again" lives in the panel now, not in the fixed action bar ten pixels
   from Continue. Full width and its own row, so a thumb aiming at Continue
   cannot land on it. */
.retryb{align-self:flex-start;margin-top:2px}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- definition dialog ---------- */
#defWrap{display:none;position:fixed;inset:0;background:rgba(14,21,29,.5);z-index:70;
  align-items:center;justify-content:center;padding:24px}
#defBox{background:var(--panel);border-radius:14px;padding:20px;max-width:430px;width:100%;
  box-shadow:0 8px 40px rgba(14,21,29,.35);font-size:15.5px;line-height:1.6;color:var(--body)}
#defBox b{color:var(--ink);font-weight:700}
</style>
</head>
<body>

<div id="err" role="alert"></div>

<div id="bar" role="banner">
  <!-- "Where am I" was unanswerable on a step screen: the section name appeared
       nowhere once you were inside it, and the top bar spent that space on the
       build string. The build string now sits in the map footer, where it is
       needed once a fortnight rather than on every screen. -->
  <span class="t" id="where">Money Puzzles</span>
  <button class="topbtn" id="topbtn" type="button" onclick="goMap()">All sections</button>
</div>

<div id="stage" role="main">
  <div id="map"></div>
  <div id="left" style="display:none">
    <div id="modechrome" style="display:none"></div>
    <div id="board"></div>
    <div class="lphint" id="lphint">Tap the <b>?</b> on any field for a plain-English reminder of what it means</div>
  </div>
  <div id="right" style="display:none">
    <div class="band" id="band"></div>
    <div id="panel"></div>
  </div>
</div>

<div id="foot" role="navigation" aria-label="Step controls"></div>

<!-- P6-3 · the dialog used to be labelled BY its own body (aria-labelledby="defBody"),
     so most screen readers announced the whole definition once as the dialog's
     accessible NAME and then again as its content — the entire definition, twice,
     before he had heard a single new word. defTitle is a short, visually hidden
     heading ("FEE, definition" etc., filled in by showDef()) that becomes the name;
     defBody moves to aria-describedby, which is read once, as content, the normal way. -->
<div id="defWrap" role="dialog" aria-modal="true" aria-labelledby="defTitle" aria-describedby="defBody">
  <div id="defBox">
    <h2 id="defTitle" style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0"></h2>
    <div id="defBody"></div>
    <button class="btn" id="defClose" type="button" style="margin-top:14px">Got it</button>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   PART 1 — THE MODEL
   Nine fields. Three arrive from outside the page, six are arithmetic.
   derive() is the ONLY place a value is ever produced. Nothing below
   may re-type a figure that derive() can compute.
   Board order here is CALCULATION order, not the order printed on the
   real Traffic Light Report, which runs FEE, % COMP, CLAIMED REVENUE,
   INV, WIP, then TIME COST, SUBS & EXP, JTD COST, ETC COST, EAC COST,
   JTD PROFIT. Calculation order is easier to learn. Confirmed by Josh
   260803. A later section should walk the real page so the translation
   is taught rather than assumed.
   ═══════════════════════════════════════════════════════════════════ */
const money = n => (n<0?"−$":"$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const pctS  = n => (n*100).toFixed(1) + "%";

/* JTD COST has two forms and they must agree.
   On the teaching board a state carries `jtd` directly. On the real-report
   board a state carries `time` and `subs` instead, because JTD COST is not a
   column on the real page — it is TIME COST + SUBS & EXP. A state may not
   carry both: the self-test refuses to start if one does, because a state
   with jtd:60000, time:40000, subs:15000 would silently teach 55000 while
   claiming 60000, and that is exactly the class of error this app exists to
   stop Josh repeating. */
/* A state may also carry a `crew`: who booked how many hours at what internal
   rate. TIME COST is then the sum of hours x rate, so the sentence "how an
   hour becomes a dollar" is arithmetic the engine does, not a claim typed into
   a paragraph. */
function crewTime(s){
  return (s.crew||[]).reduce((n,p)=>n + p.hrs*p.rate, 0);
}
function derive(s){
  const split = (s.time!==undefined || s.subs!==undefined || s.crew!==undefined);
  const time = s.crew ? crewTime(s) : (s.time!==undefined ? s.time : 0);
  const subs = s.subs!==undefined ? s.subs : 0;
  const jtd  = split ? time + subs : s.jtd;
  const eac = jtd + s.etc;
  const pct = eac ? jtd/eac : 0;
  const rev = pct * s.fee;
  return {name:s.name, fee:s.fee, time, subs, jtd, etc:s.etc, inv:s.inv,
          eac, pct, rev, wip:rev - s.inv, profit:rev - jtd};
}

const CELLS=[
 {id:"fee", k:"FEE", fmt:"money",
  def:"<b>FEE.</b> The price agreed for the work.<br><br>At <b>project</b> level that is what the signed contract says, and it changes only if the contract does, normally through an Additional Service Request.<br><br>On an individual <b>job</b> inside that project, the fee is the slice of the total allocated to it — and that slice can be moved between jobs, or drawn from the project's contingency, without the client contract changing at all.<br><br>On the real report the column is headed <b>FEE</b>, not \"contract\"."},
 {id:"time", k:"TIME COST", sub:"HOURS, PRICED", fmt:"money",
  def:"<b>TIME COST.</b> The cost of the hours people have booked to this job.<br><br><b>How an hour becomes a dollar:</b> every person carries an <b>internal rate</b>, which is what an hour of their time costs the firm. Hours booked, multiplied by that person's internal rate, is what lands here. A senior person's hour costs more than a junior person's hour, so the same number of hours can arrive as very different money.<br><br>That internal rate is <b>not</b> the rate the client is charged. The external rate is the internal rate with profit added on top. Both exist for the same person at the same time, and mixing them up is one of the easier mistakes to make.<br><br>On the real report the column is <b>TIME COST</b>, singular."},
 {id:"subs", k:"SUBS & EXP", sub:"SUBS AND EXPENSES", fmt:"money",
  def:"<b>SUBS &amp; EXP</b> is short for <b>sub-consultants and expenses</b>: everything spent on the job that is not somebody's hours.<br><br>Sub-consultant invoices, travel, printing, equipment.<br><br>It sits beside TIME COST on the real report, and the two of them added together are the job's cost to date."},
 {id:"jtd", k:"JTD COST", sub:"JOB TO DATE", fmt:"money",
  def:"<b>JTD COST</b> is short for <b>job to date cost</b>: money already spent on this job.<br><br><b>Nobody types this total in.</b> It accumulates on its own — every hour anybody books to the job in their timesheet, plus every sub-consultant invoice and expense.<br><br>On the real report it is two columns added together: <b>TIME COST</b> (the timesheet hours) plus <b>SUBS &amp; EXP</b> (sub-consultants and expenses)."},
 {id:"etc", k:"ETC COST", sub:"ESTIMATE TO COMPLETE", fmt:"money",
  def:"<b>ETC COST</b> is short for <b>estimate to complete</b>: the forecast of what is still left to spend before the job finishes.<br><br><b>This is the only number on the board that is an opinion rather than a record</b>, and on your own jobs the opinion is yours."},
 {id:"eac", k:"EAC COST", sub:"JTD + ETC", fmt:"money", calc:1,
  def:"<b>EAC COST</b> is short for <b>estimate at completion</b>: what the job is expected to cost in total, start to finish.<br><br>Money already spent, plus the forecast of what is left. Nothing more than those two added together."},
 {id:"pct", k:"LIVE CALCULATED % COMP", sub:"JTD ÷ EAC", fmt:"pct", calc:1,
  def:"<b>LIVE CALCULATED % COMP</b> is short for <b>live calculated percent complete</b>: money spent, divided by money expected to be spent in total.<br><br><b>It is not how much of the work is finished.</b> Nothing on this board looks at the drawings. A job that has burned half its budget reads 50% whether the drawings are done or barely started."},
 {id:"rev", k:"CLAIMED REVENUE", sub:"% COMP × FEE", fmt:"money", calc:1,
  def:"<b>CLAIMED REVENUE.</b> What the firm reports it has earned on this job so far: the percentage above, applied to the fee.<br><br>\"Claimed\" is the real column heading, not a word invented for this app. It is also the number people mean when they say the job has <b>earned</b> something."},
 {id:"inv", k:"INV", sub:"INVOICED", fmt:"money",
  def:"<b>INV</b> is short for <b>invoiced</b>: what has actually been billed to the client so far.<br><br>It moves on its own schedule — the invoice schedule set up on the project — and not on the cost calculation above it. People also say <b>billed</b> for this."},
 {id:"wip", k:"WIP", sub:"REVENUE − INV", fmt:"money", calc:1,
  def:"<b>WIP</b> is short for <b>work in progress</b>: money the firm says it has earned but has not yet asked the client for.<br><br>Claimed revenue minus invoiced. The gap between what has been earned on paper and what has been billed."},
 {id:"profit", k:"JTD PROFIT", sub:"REVENUE − JTD", fmt:"money", calc:1,
  def:"<b>JTD PROFIT</b> is short for <b>job to date profit</b>: what the firm says it earned, minus what it actually spent.<br><br>It is a profit on paper. The earning half of it comes out of a calculation, not out of anybody's bank account."}
];
const CMAP = Object.fromEntries(CELLS.map(c=>[c.id,c]));
const fmtVal = (c,v) => c.fmt==="pct" ? pctS(v) : money(v);

/* Board layout is DATA. A section names a layout; the engine draws it.
   The first four sections run on seven cells. INV and WIP do not exist
   on the board until the section that teaches them. */
const LAYOUTS={
  core:[["fee"],["jtd","+","etc","=","eac"],["pct","rev"],["profit"]],
  full:[["fee"],["jtd","+","etc","=","eac"],["pct","rev"],["inv","wip","profit"]],
  /* THE REAL COLUMN ORDER. Read verbatim off two live Vantagepoint exports,
     "260802 0215 Traffic Light Report - Simple.xlsx" and "260802 0230 Traffic
     Light Report (in Billing Currency).xlsx", both dated 2 August 2026 —
     recorded in 02_Working/Traffic_Light_Report_Terminology_260802.md.
     Columns 5,6,7,8,10,13,14,15,16,17,18 of that report, in that order,
     wrapped onto a phone. It prints the RESULT first and its EVIDENCE last,
     which is the exact reverse of the teaching board, and JTD COST is not a
     column he can look up — it is TIME COST + SUBS & EXP. The four columns
     this app never teaches (RT, UNPAID INV, CASH LOCKUP, MAX CASH LOCKUP)
     are left out rather than faked.

     JTD COST IS DELIBERATELY HIDDEN, AND THE REASON MATTERS.
     v5.0 shipped a comment here, and three sentences on screen, saying JTD
     COST is not a column on the real report. THAT WAS FALSE. It is column 15
     of the Traffic Light Report (in Billing Currency), sitting directly
     between SUBS & EXP (14) and ETC COST (16), read verbatim off row 4 of the
     live 2 August 2026 export and recorded in
     02_Working/Traffic_Light_Report_Terminology_260802.md. Level 100's
     origin.jtd.card said so correctly the whole time, so the app contradicted
     itself and the false half was the half Josh would have repeated.
     The exercise is worth keeping; the justification is not. It is covered up
     HERE, once, so he can prove he can rebuild it from the two columns it is
     made of. That is a teaching decision about this board, not a claim about
     the report. */
  real:[["fee","pct","rev"],["inv","wip"],["time","subs"],["etc","eac"],["profit"]]
};
const visibleIds = key => LAYOUTS[key].flat().filter(x=>CMAP[x]);

/* ═══════════════════════════════════════════════════════════════════
   PART 2 — THE JOBS
   Two invented jobs. No relation to any real Buro Happold project and
   every figure is made up. Change a literal here and every number in
   every sentence of the app follows it, because nothing is typed twice.
   ═══════════════════════════════════════════════════════════════════ */
/* FOXGLOVE's opening figures were changed in v5. Under the old set the job
   started at exactly 50% complete, which made CLAIMED REVENUE before a booking
   numerically identical to JTD COST after it — the same $50,000 naming two
   different things one line apart. Arithmetically correct, and it read as an
   error to anyone who had just done the sum. Every figure in the app follows
   these four literals, so changing them re-derived every sentence. */
const FOXGLOVE = {name:"Foxglove Library",   fee:120000, jtd:30000, etc:50000, inv:25000};
const SANDPIPER= {name:"Sandpiper Pavilion", fee:200000, jtd:25000, etc:75000, inv:0};
/* Job three exists so the arithmetic drills stop re-using the exact figures
   from the worked example directly above them, which measured recall of a
   number rather than application of a rule. */
const KESTREL  = {name:"Kestrel Interchange", fee:240000, jtd:54000, etc:126000, inv:40000};
/* Job four is the failure state. No job anywhere in v4 was ever over-run:
   JTD never exceeded EAC, JTD PROFIT was never negative, and every percentage
   landed on a tidy value. A losing job with an awkward percentage is the only
   condition under which a boss actually asks. */
const MARLOW   = {name:"Marlow Street Depot", fee:85000, jtd:71400, etc:25900, inv:55000};

/* The same Foxglove, with its TIME COST opened out into who booked what.
   Its derived JTD COST must come to exactly FOXGLOVE's, or the level-100 card
   teaches one total while the board next door prints another; verify_v5
   checks that they still agree. Every name, hour and rate here is invented.
   Two people are deliberately set to the same MONEY on very different HOURS,
   because that is the whole lesson. */
const FOX_CREW = {name:FOXGLOVE.name, fee:FOXGLOVE.fee, etc:FOXGLOVE.etc, inv:FOXGLOVE.inv,
  subs:6000,
  crew:[{who:"The project director", hrs:40,  rate:150},
        {who:"An engineer",          hrs:160, rate:75},
        {who:"A graduate",           hrs:120, rate:50}]};

/* Marlow booking eight thousand four hundred of PLANNED time. EAC COST does
   not move, percent complete rises, claimed revenue rises — and JTD PROFIT
   still falls, because EAC COST is above the fee. Every dollar spent on a job
   like this claims back less than a dollar. It is the most useful single
   arithmetic result in the app and nothing in v4 could produce it, because no
   job in v4 was ever over-run. */
const MAR_PLAN   = {...MARLOW, jtd:79800, etc:17500};
const MAR_REWORK = {...MARLOW, jtd:79800, etc:25900};
const MAR_ETCUP  = {...MARLOW, etc:34300};
/* cutting Marlow's forecast to this exact figure puts expected cost at the fee
   and JTD PROFIT at zero, so the temptation is arithmetically perfect */
const MAR_ETCFIX = {...MARLOW, etc:13600};
const KES_REWORK = {...KESTREL, jtd:66000};
const KES_PLAN   = {...KESTREL, jtd:72000, etc:108000};
const KES_INV    = {...KESTREL, inv:65000};
const KES_ETCDOWN= {...KESTREL, etc:96000};
/* P5-7 · a second, independent over-budget job. mixed.f used to share
   MARLOW -> MAR_PLAN with spend.losing, and its stem said "same shape as two
   screens ago", which handed over the identification (the level's whole
   point) instead of making it re-derive from EAC COST against FEE. KES_OVER
   raises Kestrel's own forecast until expected cost passes its fee — a
   different job, different fee, different numbers throughout — then
   KES_OVER_PLAN books planned time on it the same way KES_PLAN does on the
   healthy Kestrel, so the two are a genuine minimal pair on the SAME job:
   identical mechanism, opposite margin, distinct figures from Marlow's. */
const KES_OVER     = {...KESTREL, etc:200000};                    // eac 254000, above the 240000 fee
const KES_OVER_PLAN= {...KES_OVER, jtd:74000, etc:180000};        // planned booking: eac unchanged at 254000
/* P5-7 · a COMPOUND month: unplanned cost lands (jtd up, etc unchanged, so
   EAC rises) AND an invoice goes out (inv up), in the same month. Level 600
   had no item where two of its four events happen at once, and WIP moving
   under two simultaneous causes is exactly where "WIP on its own never tells
   you what happened" (taught at level 500) gets genuinely hard to hold onto.
   Profit falls (real money landed, unplanned) and both JTD COST and INV move. */
const MAR_COMPOUND = {...MARLOW, jtd:79800, inv:65000};

const FOX_PLAN6    = {...FOXGLOVE, jtd:36000, etc:44000};
const FOX_PLAN10   = {...FOXGLOVE, jtd:40000, etc:40000};
const FOX_REWORK10 = {...FOXGLOVE, jtd:40000, etc:50000};
const FOX_ETC10    = {...FOXGLOVE, etc:10000};
const FOX_ETC90    = {...FOXGLOVE, etc:90000};
const FOX_ETC30    = {...FOXGLOVE, etc:30000};
const FOX_INV42    = {...FOXGLOVE, inv:42000};
const FOX_INV38    = {...FOXGLOVE, inv:38000};

/* ── THE REAL-PAGE ROWS ──────────────────────────────────────────────────
   Five invented jobs carrying TIME COST and SUBS & EXP instead of a JTD COST
   total, because JTD COST is deliberately COVERED UP on this board so he can
   rebuild it. It is column 15 of the real report. THE REPO IS
   PUBLIC. Not one of these is a Buro Happold project and not one figure is
   taken from a real report. */
const R_ALDER    = {name:"Alderman Street Rooms", fee:150000, time:42000, subs:6000,  etc:72000, inv:44000};
const R_BRAMBLE  = {name:"Bramble Court",        fee:96000,  time:28500, subs:3900,  etc:21600, inv:5000};
const R_CEDARWAY = {name:"Cedarway Terminal",    fee:200000, time:96000, subs:24000, etc:40000, inv:130000};
const R_DUNMORE  = {name:"Dunmore Bridge",       fee:64000,  time:51200, subs:9600,  etc:19200, inv:48000};
const R_ELMGROVE = {name:"Elmgrove Annexe",      fee:110000, time:20000, subs:2000,  etc:66000, inv:15000};
const REALROWS = [R_ALDER, R_BRAMBLE, R_CEDARWAY, R_DUNMORE, R_ELMGROVE];

const SRC={
 formula:{t:"Slide 39 of an official internal Buro Happold deck states it directly: revenue equals cost spent to date, divided by total cost expected by the end, multiplied by the fee.<br><br>Two qualifiers, from the same slide. This is how <b>lump-sum</b> jobs work, which the speaker on that deck estimates in their own words as <i>“I would say 90 to 95% of our projects are lump sum fee”</i>, so treat it as an experienced estimate rather than a published figure; time-and-materials jobs recognise revenue as hours booked times an agreed billing rate instead. And that deck predates the May 2026 FRS 102 change, although the April 2026 FRS deck confirms this calculation itself continues unchanged."},
 wip:{t:"<b>PP-PD Forum 6, April 2026, slide 13</b>, “Project Director Checklist: Traffic Light Report Focus”, on what to do with this column: <i>“Review WIP for trends and drivers, especially +WIP as that indicates an invoice should be raised.”</i><br><br>The same slide asks that <i>“Reasons for JTD profit variances on the jobs should be understood”</i>, and PP-PD Forum 7 of June 2026, slide 30, puts it in company: <i>“Check dashboards, invoicing, WIP and debt together.”</i><br><br>So a wide WIP is a prompt to go and look, and the thing it prompts you to look at first is the invoice schedule."},
 plan:{t:"Two official Buro Happold decks set the control around the forecast.<br><br><b>PP-PD Forum 7, June 2026, slide 24:</b> <i>“PD's review progress with JL's by 23rd of the month, to make sure plans are accurate”</i>, and <i>“The PD owns the plan; Job Leads keep it real.”</i> Slide 26 of the same deck adds that before changing a plan, the Project Director lays the change out for the relevant parties first.<br><br><b>PP-PD Forum 6, April 2026, slide 10:</b> Task 5 of the Project Director Checklist is <i>“Review all job project plans/ETCs”</i> and <i>“Once satisfied the job ETCs are reflecting the remaining scope to be delivered, sign off plan review tab for each job project plan”</i>, with the checklist due <i>“by the 25th of each month.”</i><br><br><b>Slide 16 of the same deck, on what to do when a number looks wrong:</b> <i>“Do NOT manage the revenue adjustment – fix the project data.”</i> Its speaker notes: <i>“If something looks off, the answer is always the same: fix the plan, fix the ETCs, fix the risks.”</i>"},
 fee:{t:"At <b>project</b> level the fee is the contract, and changing it means an <b>Additional Service Request</b>.<br><br><b>The governing document is not a deck.</b> It is <i>US Project Business Rules: Commencing Work on a Project</i>, V3, 5 February 2026, pages 9 and 10. It says an ASR must be clear on scope, fee and fee type, and schedule, and must reference the base contract terms and conditions, and then: <i>“Work should not commence on ASRs until written approval is received.”</i><br><br><b>That prohibition is not absolute, and the exception is on this app's own subject.</b> Page 10 sets out a narrow at-risk route: a written ASR must already have been sent to the client, available project contingency must exceed the fee value of the ASR, and the project principal must approve. And then, directly relevant here: <i>“The project fee should not be increased, and revenue should not be claimed until written approval is received.”</i> If any of those conditions are not met, MD or COO approval is required. If the scope involves a deliverable, the deliverable is not released until written approval is received.<br><br><b>Two signature routes, not one.</b> On a BH-format ASR the signatory is a Partner, and a Project Director may co-sign with the Partner's approval (PP-PD Forum deck, Review and Signature table). Where a <i>client-format</i> ASR form is used, the Business Rules require legal-team review and a corporate officer's signature.<br><br>At <b>job</b> level the fee is an allocated slice of that contract, and moving it is ordinary monthly work. PP-PD Forum 6, slide 10, Task 2: <i>“Complete Fee Allocation check and Include in Fees check to ensure additional fees are allocated correctly”</i>, and <i>“Check the Invoice Schedule matches the total fee allocated.”</i>"},
 hours:{t:"<b>OBSERVED.</b> Every person carries two rates. Gabe Guilliams, describing how a fee is built: <i>“Make sure you add up the hours with the internal rates. I would only show them the internal rates, and at the bottom just have profit margin... This is just our cost to do the work plus a profit margin.”</i> The internal rate is at cost; the external rate is that plus profit. Recorded in this project's transcript extracts from conversations across 2025.<br><br><b>INFERRED, and flagged rather than smoothed.</b> That timesheet hours land in TIME COST at the <i>internal</i> rate is the only reading consistent with TIME COST being a cost, but no document on file states it in those words. <b>The test that would settle it:</b> take one job, multiply each person's booked hours by their published internal rate, and see whether the total matches TIME COST on the report. Until somebody runs that, the mechanism is safe to rely on and the exact rate table is UNKNOWN.<br><br>Two limits on the OBSERVED half, stated rather than smoothed. It rests on <b>testimony in a transcript, not on a policy document</b>: no rate card or written rule on file states it. And whether an internal rate is raw salary or salary plus overhead is <b>UNKNOWN</b>; nothing on file says which, and the difference matters if you ever try to reconcile a number.<br><br>Every rate in this app is invented."},
 etclist:{t:"<b>ETC comes out of the project plan, not out of the air.</b> PP-PD Forum deck 3, slide 39, speaker notes: <i>“ETC — Estimate to complete, so that is your future planned costs. So what it's gonna cost from this point to the end of the project, as per our plans.”</i><br><br>PP-PD Forum 6, slide 11: <i>“Ensure the root project plan's labor, expenses and consultant are up to date”</i> and <i>“All workstages where costs are anticipated require planning.”</i> Its speaker notes go further: <i>“Project performance will be entirely driven from the plans - missing or outdated ETCs are the single most common cause of revenue distortion under FRS102.”</i>"},
 report:{t:"The report is the <b>Traffic Light Report</b>, an export out of Vantagepoint. Two versions exist: a <b>Simple</b> one of sixteen columns, and one <b>in Billing Currency</b> of twenty-five, which is the one carrying the cost breakdown this app is about.<br><br>Every column name here was read verbatim off row four of two live exports dated 2 August 2026, under the header “Buro Happold Inc [PC] - LIVE”. The pull is scheduled <b>daily</b>, at about 02:15 and 02:30. <b>OBSERVED:</b> dated copies exist for 29 and 31 July and 1 and 2 August 2026 — four files, with 30 July absent from the folder, which is why this says the pull is scheduled daily rather than that a file arrives every single morning."},
 checklist:{t:"An official Buro Happold deck, PP-PD Forum 6 of April 2026, slide 10, sets out the <b>Project Director Checklist</b> as five tasks. Task 3 is <i>“Review the Traffic Light Report”</i>, and its five checks are quoted from that slide: <i>“EAC % Profit (with contingency spent) is in line with Target Profit % across all jobs and the root project”</i>; <i>“JTD % Profit is in line with EAC % Profit (with contingency spent) across all jobs and root project”</i>; <i>“Review unpaid invoices”</i>; <i>“Check Cash Lock Up does not exceed Max Cash Lock Up”</i>; <i>“Review WIP”</i>.<br><br>Same slide, on timing, quoted exactly: <i>“The recommended best practice remains for PDs to complete the project checklist by the 25th of each month.”</i> It is stated as recommended best practice. <b>No source on file states a consequence for missing it</b>, and this app does not invent one.<br><br>So the report is pulled daily and the decision it feeds is monthly."},
 names:{t:"These are the real column headings off the <b>Traffic Light Report</b> — the Vantagepoint report a Project Director works from, which lands daily. They are the words used in the room, not plainer substitutes invented for this app.<br><br>Worth knowing before you quote them: the <b>monthly</b> project accounts sheet uses different words for several of these same numbers. Translating between the two reports is its own lesson."},
 wholejob:{callout:true, h:"Two answers, not one",
   t:"<b>The calculation on this board runs per workstage</b> — the sub-code that hours and costs book to. An official Buro Happold deck, PP-PD Forum 6 of April 2026, slide 9, states it: <i>“Currently, revenue is calculated at the workstage level based on fees, JTD costs, and EAC costs. That process will continue, but FRS 102 introduces a project level adjustment.”</i> On the live report, each workstage row carries its own percentage.<br><br><b>Sitting on top of that is one further line, the FRS adjustment, and that one is whole-job.</b> PP-PD Forum 6, slide 8, states where it lands: the old world recognised revenue <i>“at workstage level”</i>, the new world recognises it <i>“at project (root) and entity level”</i> — both, not just the project. Samantha Teague, Project Accounting Manager, Buro Happold US Finance, in writing on 3 August 2026: <i>“The FRS adjustment is based on the % complete on the entire job.”</i> It sits on the root of the project, not on the individual jobs underneath it.<br><br>So: workstage by workstage for what you have just learned, whole job for the adjustment sitting above it."}

 {id:"origin.words", kind:"concept",
  title:"A few words, before any of them get used.",
  body:"One name each, because the same quantity has several names in the room and you need exactly one to say out loud.<br><br><b>Say “claimed revenue”.</b> It is the real column heading. You will also hear it called revenue, earnings, reported income, and “what the job has earned”. All the same number.<br><br><b>Say “spent”, or “JTD COST”.</b> Job to date cost.<br><b>Say “billed”, or “INV”.</b> Invoiced. You meet the actual INV field at the 500 level; the word is worth having now.<br><br>One word to be careful with. <b>“Booked”</b> gets used for two different things. Booking <i>hours</i> to a job means filling in a timesheet, and it pushes cost up. Booking <i>revenue</i> means recording income. Same word, opposite sides of the page. If somebody says booked, ask which.<br><br>And the abbreviations, spelled out once each: <b>JTD</b> job to date. <b>ETC</b> estimate to complete. <b>EAC</b> estimate at completion. <b>INV</b> invoiced. <b>WIP</b> work in progress. <b>ASR</b> additional service request. <b>FRS 102</b> is a UK accounting standard Buro Happold adopted in May 2026; it adds an adjustment on top of these numbers at project level and does not change the calculation you are about to learn. It gets its own level, and that level is not built yet.",
  src:["names"]},

 {id:"origin.worked", kind:"worked", state:FOXGLOVE, blank:true,
  title:"The three that arrive from outside.",

 {id:"origin.fee.card", kind:"concept", state:FOXGLOVE,
  title:"FEE: the price, and the one number nothing here can move.",
  body:"On <b>{job}</b> the fee reads {fee}.<br><br>It came off a signed contract. Somebody in finance typed it in, reading it off the document.<br><br>Nothing on this board can change it. Not spending, not the forecast, not the calculation. It sits above all of that, and it moves only when the client agrees it moves.<br><br>There is one exception, and it is the next question but one.",

 {id:"origin.fee.q", kind:"choice", state:FOXGLOVE,
  q:"What has to happen for the fee on the whole <b>project</b> to change?",

  a:0,

 {id:"origin.fee.edge", kind:"choice", state:FOXGLOVE,

 {id:"origin.jtd.card", kind:"concept", state:FOXGLOVE,
  title:"JTD COST: nobody types it in.",
  body:"<b>JTD COST</b> is short for <b>job to date cost</b>. On {job} it reads {jtd}.<br><br>Nobody typed that. It is a running total that fills itself, out of two places:<br><br><b>TIME COST</b>, every hour anybody books to this job on a timesheet, turned into money.<br><b>SUBS &amp; EXP</b>, every sub-consultant invoice and every expense.<br><br>On the real report those are two separate columns, 13 and 14, and JTD COST is a third at column 15 sitting directly beside them. This board shows only the total, because the arithmetic is easier to follow with fewer boxes. You meet all three together at the 700 level.<br><br>The next card is worth reading slowly: how an hour turns into a dollar.",
  src:["names"]},

 {id:"origin.jtd.hour", kind:"concept", state:FOX_CREW,
  title:"How an hour becomes a dollar.",
  body:"Everybody in the firm carries an <b>internal rate</b>: what an hour of their time costs Buro Happold. Hours booked, times that rate, is what lands in TIME COST.<br><br>Say three people booked time to {job}. Every name, hour and rate here is invented.<br><br>{c1.who}: {c1.hrs} hours at {c1.rate} an hour, so <b>{c1.cost}</b>.<br>{c2.who}: {c2.hrs} hours at {c2.rate} an hour, so <b>{c2.cost}</b>.<br>{c3.who}: {c3.hrs} hours at {c3.rate} an hour, so <b>{c3.cost}</b>.<br><br>Added up that is <b>{time}</b> of TIME COST. Add <b>{subs}</b> of sub-consultant invoices and expenses, and JTD COST is <b>{jtd}</b>, which is exactly the figure on the board.<br><br><b>The internal rate is not what the client pays.</b> There is a second, higher rate used when a fee is being built: the cost of the hours, plus a margin on top.<br><br>Be careful with what that does and does not mean. On a <b>lump-sum</b> job, which is most of this firm's work, the client never sees an hourly rate at all. They agreed a fee, and nothing on this board is calculated from a rate. <b>Profit here is the fee against the expected cost</b>, which is the whole of the 200 level and everything after it. The rate is how the fee got estimated in the first place, not how the money is counted afterwards.<br><br>The exception is <b>time and materials</b> work, the minority case, where revenue really is hours booked times an agreed billing rate. If somebody says the profit is in the rate, the first question is which kind of job they are looking at.",
  src:["hours"]},

 {id:"origin.jtd.q", kind:"choice", state:FOX_CREW,

 {id:"origin.etc.card", kind:"concept", state:FOXGLOVE,
  title:"ETC COST: the only opinion on the page.",
  body:"<b>ETC COST</b> is short for <b>estimate to complete</b>: what is still left to spend before the job finishes. On {job} it reads {etc}.<br><br>Look at the three side by side. FEE is a contract. JTD COST is a record of what already happened. <b>ETC COST is a judgement about a future that has not happened yet</b>, and on your own jobs the person making that judgement is you.<br><br>Hold on to that asymmetry. It is the reason the 400 level exists at all."},

 {id:"origin.etc.list", kind:"concept", state:FOXGLOVE,
  title:"ETC is not a feeling. It is a priced list.",
  body:"This is the most useful sentence in the level.<br><br><b>ETC COST falls out of the project plan.</b> Hours planned per person for the work still to come, priced at their internal rates, plus the expenses and sub-consultant invoices still to come. That list, added up, is ETC COST. Buro Happold's own words for it are <i>“your future planned costs... as per our plans”</i>, and the firm requires every workstage where costs are expected to carry one.<br><br><b>Why you need it now.</b> At the 300 level you will be told that doing planned work cuts ETC COST by the same amount it adds to JTD COST. That is not a convention somebody invented. If the plan said an engineer would spend forty hours next month and the engineer spends them, those hours leave the list of work still to come and join the record of work already done. Same hours, priced the same way, moving from one column to the other.<br><br>Without the list, that is an assertion you have to swallow. With it, it is obvious.",

   {cells:["rev"], text:"<b>CLAIMED REVENUE</b> is that percentage applied to the fee.<br><br>{pct} of {fee} is <b>{rev}</b>. That is what the firm claims it has earned on this job so far.<br><br>Nobody looked at a drawing to decide it."},
   {cells:["profit"], text:"<b>JTD PROFIT</b> is what the firm claims it earned, minus what it actually spent.<br><br>{rev} claimed, minus {jtd} spent, is <b>{profit}</b>.<br><br>That is every calculated field on this board."},
   {cells:[], text:"<b>The whole chain in one line, which is the line to be able to say:</b><br><br>{jtd} spent plus {etc} still to spend is {eac} expected in total. {jtd} over {eac} is {pct}. {pct} of the {fee} fee is {rev} claimed. {rev} claimed minus {jtd} spent is {profit} of profit.<br><br>Four steps, each one feeding the next. Nothing here looked at a drawing."}
  ], src:["formula"]},

 /* THE DRILLS RUN ON A THIRD JOB. In v4 all four re-used the exact figures
    from the worked example directly above them, so they measured recall of a
    number rather than application of a rule. */
 {id:"arith.eac", kind:"compute", state:KESTREL, field:"eac",
  q:"A third job. <b>{job}</b> has spent <b>{jtd}</b> so far, and forecasts <b>{etc}</b> still to spend.<br><br>What is EAC COST, the estimate at completion?",
  hint:"the two cost numbers, added together",
  why:"<b>{eac}.</b> EAC COST is only ever money already spent, plus the forecast of what is left. Nothing cleverer than that."},

 /* OPERAND SELECTION. Every compute item hands him both numbers in the stem,
    so none of them ever tests the part that actually breaks in front of a
    boss: working out WHICH two of the numbers on the page to use. */
 {id:"arith.pickop", kind:"select", mode:"identify", state:KESTREL,
  ids:["jtd","eac"],
  q:"Nobody has handed you the numbers this time.<br><br><b>Tap the two fields you would divide, one by the other, to get LIVE CALCULATED % COMP.</b>",
  why:"<b>JTD COST over EAC COST.</b> Money spent, over money expected in total.<br><br>The one that catches people is <b>ETC COST</b>. It feels as though the percentage ought to compare what is done against what is left, but it does not. It compares what is done against the <i>whole</i>, and the whole is EAC COST.<br><br>ETC COST does get in, but indirectly: it is half of EAC COST. That is why moving it moves the percentage, which is the whole of the 400 level.",
  src:["formula"]},

 {id:"arith.pct", kind:"compute", state:KESTREL, field:"pct",
  q:"Same job. <b>{jtd}</b> spent, <b>{eac}</b> expected to be spent in total.<br><br>What is LIVE CALCULATED % COMP? Type the number only.",
  hint:"money spent ÷ money expected in total. A percentage or a decimal are both accepted, and so is the sum itself.",
  why:"<b>{pct}.</b>{FRAC}It does not mean that share of the drawings is done. It means that share of the expected money has gone out.",
  src:["formula","wholejob"]},

 {id:"arith.rev", kind:"compute", state:KESTREL, field:"rev",
  q:"The fee is <b>{fee}</b>, and <b>LIVE CALCULATED % COMP reads {pct}</b>.<br><br>What does the firm claim it has earned? CLAIMED REVENUE.",
  hint:"that percentage, applied to the fee",
  why:"<b>{rev}.</b> That share of the fee, because that share of the expected cost has been spent.<br><br>Nobody looked at the drawings to decide it, and no human signed it off. It is two cost numbers and a price.",
  src:["formula","wholejob"]},

 {id:"arith.profit", kind:"compute", state:KESTREL, field:"profit",
  q:"{job} claims it has earned <b>{rev}</b>, and it has spent <b>{jtd}</b>.<br><br>What is JTD PROFIT?",
  hint:"claimed minus spent",
  why:"<b>{profit}.</b> Claimed minus spent.<br><br>It is a profit on paper. The claiming half of it came out of the calculation you just did, not out of anybody's bank account."},

 {id:"arith.chain", kind:"choice", state:KESTREL,
  q:"You want {job}'s JTD PROFIT and nothing has been calculated yet.<br><br>Which of the four has to be worked out <b>first</b>?",
  opts:["EAC COST, because the percentage needs it, and claimed revenue needs the percentage",
        "CLAIMED REVENUE, because profit is only ever claimed revenue minus cost spent so far",
        "LIVE CALCULATED % COMP, because everything else here is a percentage of something",
        "None of them. The four are worked out entirely independently of each other"],
  a:0,
  why:"<b>EAC COST.</b> The four are a chain, not a list.<br><br>EAC COST needs the two cost numbers. LIVE CALCULATED % COMP needs EAC COST. CLAIMED REVENUE needs the percentage. JTD PROFIT needs claimed revenue.<br><br>Which is why one change at the top of the chain moves everything below it, and why nothing below it can move on its own.<br><br><b>Keep this as a habit.</b> When a figure has moved and you cannot see why, walk the chain upwards until you reach something that was not calculated. It will be the fee, the money spent, or the forecast, and there is nothing else it can be.",
  src:["formula"]},

 /* THE FAILURE STATE, and the first awkward percentage in the app. No job
    anywhere in v4 was ever over-run and every percentage landed tidy, so
    nothing ever asked him to judge whether an ugly number was roughly right —
    which is exactly what reading a real row demands. */
 {id:"arith.ugly", kind:"compute", state:MARLOW, field:"pct",
  q:"A fourth job, and this one is not tidy. <b>{job}</b> has spent <b>{jtd}</b> and expects to spend <b>{eac}</b> in total.<br><br>What is LIVE CALCULATED % COMP?",
  hint:"money spent ÷ money expected in total. Round to one decimal place, or type the division itself and let it work it out.",
  why:"<b>{pct}.</b>{FRAC}Nothing on a real report lands on a round number, and this is the first figure in this app that does not.<br><br>What matters more than the decimal is being able to say roughly where it should land before you work it out. Spent is a bit under three quarters of expected, so the answer had to be a bit under seventy-five. Knowing that range before you divide is what lets you sanity-check a real row in a few seconds, without redoing the arithmetic.",
  src:["formula"]},

 {id:"arith.loss", kind:"choice", state:MARLOW,
  q:"Still <b>{job}</b>. Fee <b>{fee}</b>, spent <b>{jtd}</b>, forecast <b>{etc}</b> still to go.<br><br>Its JTD PROFIT reads <b>{profit}</b>. Every job you have seen so far has been positive. What has happened?",
  opts:["It expects to cost {eac} in total, which is more than the fee, so it can claim less than it has already spent",
        "It has already spent more money than its {fee} fee is worth in total, which is exactly what triggers the loss shown",
        "The forecast of remaining cost has been deliberately and quietly set far too low this particular month",
        "It has not yet invoiced enough of its {fee} fee to cover the money it has already spent so far"],
  a:0,
  why:"<b>Expected cost has gone past the fee.</b><br><br>{job} expects to cost {eac} all in, against a fee of {fee}. Claimed revenue is the percentage times the fee, and the percentage is {pct}, so the most it can claim is {rev}. It has already spent {jtd}. Claimed minus spent is {profit}.<br><br>The second answer is worth checking rather than waving away: it has spent {jtd}, which is still <i>under</i> the {fee} fee. <b>Overspending the fee is not what makes a job show a loss here. Expecting to overspend it is.</b><br><br>The loss appears the moment the forecast says it will happen, which can be months before the money actually goes out of the door. That is the single most useful thing on this screen.",
  src:["formula"]},

 {id:"arith.recap", kind:"concept", state:KESTREL,
  title:"The four, in one line.",
  body:"Before you leave the level, say it once.<br><br><b>Spent, plus still to spend, is the total expected. Spent over total expected is the percentage. The percentage times the fee is what we claim. What we claim minus what we spent is the profit.</b><br><br>On {job}: {jtd} plus {etc} is {eac}. {jtd} over {eac} is {pct}. {pct} of {fee} is {rev}. {rev} minus {jtd} is {profit}.<br><br>That is the whole arithmetic of the page. Everything from here is about what makes those three input numbers move."}
]},

/* ═════════ 300 LEVEL ═════════ */
{id:"spend", level:300, layout:"core",
 name:"Spending Is The Engine",
 line:"What the firm claims follows money spent, not work finished",
 warmN:2,
 /* Two of these four open the level, on jobs he has not seen this material on,
